# yaml-language-server: $schema=../../schema/v2/universe.json
# The universe-wide layer only. Storylines bring their own cards (a Sentence, an APB, a gang's
# favor) and add tags as their locations need them.
format: 2
id: graystone
name: Graystone

categories:
  - { id: go,   name: GO }
  - { id: talk, name: TALK }
  - { id: work, name: WORK }
  - { id: take, name: TAKE }
  - { id: risk, name: RISK }
  - { id: look, name: LOOK }
  - { id: deal, name: DEAL }

trackers:
  - id: nerve
    name: Nerve
    max: 6
    breaking_point:
      text: |
        Something in you folds. You find a wall to put your back against and stay there
        until your hands are hands again. The afternoon doesn't wait for you.
      effects:
        - tracker.change: { time: -2 }
  - id: body
    name: Body
    max: 6
    breaking_point:
      text: |
        Your legs quit. You sit down where you are, on a curb or a step or a floor, and wait
        for them to come back. Nobody in Graystone hurries you, and nobody helps.
      effects:
        - tracker.change: { time: -2 }
  - id: time
    name: Time
    max: 12
    breaking_point:
      text: |
        The light goes long over the grain elevators. Whatever you came to do, the day is
        nearly out of room for it.
      effects:
        - tracker.change: { nerve: -1 }

difficulties:
  - { id: easy, name: Easy Day,  start: { nerve: 6, body: 6, time: 12 } }
  - { id: hard, name: Rough Day, start: { nerve: 4, body: 4, time: 10 } }

dice:
  pool: 10
  faces:
    - { id: nerve,   type: tracker, tracker: nerve }
    - { id: body,    type: tracker, tracker: body }
    - { id: time-1,  type: tracker, tracker: time }
    - { id: time-2,  type: tracker, tracker: time }
    - { id: setback, type: setback }
    - { id: blank,   type: blank }

tags:
  - { id: law,       name: Law }
  - { id: prison,    name: Prison }
  # The Undercroft storyline
  - { id: cooperate, name: Cooperate }
  - { id: please,    name: Please }
  - { id: chained,   name: Chained }
  - { id: caged,     name: Caged }
  - { id: gagged,    name: Gagged }
  - { id: served,    name: Served }
  - { id: trusted,   name: Trusted }
  # Fetish cards (read by other storylines' requires)
  - { id: boots,     name: Boots }
  - { id: uniform,   name: Uniform }

currencies:
  - { id: cash, name: Cash, symbol: "$", start: 3 }

card_kinds:
  - { id: hero,      name: Hero,      placement: center }
  - { id: mission,   name: Mission,   placement: supply }
  - { id: gear,      name: Gear,      placement: grid }
  - { id: restraint, name: Restraint, placement: grid, forced: true }
  - { id: favor,     name: Favor,     placement: grid }
  - { id: dossier,   name: Dossier,   placement: grid, forced: true }
  - { id: fetish,    name: Fetish,    placement: grid }

run: { character_kind: hero, mission_kind: mission, default_defeat: run-out }
reserve_capacity: 3
exits: { category: go, word: WALK, cost: 1 }

character_powers:
  - { price: 1, effect: reroll }
  - { price: 2, effect: { skill: random } }
  - { price: 1, effect: recall }

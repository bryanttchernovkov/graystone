# yaml-language-server: $schema=../../schema/v2/universe.json
# The universe-wide layer only. Storylines bring their own cards (a Criminal Record, a gang's
# favor) and add tags as their locations need them.
format: 2
id: graystone
name: Graystone
tagline: Crime is down in Graystone. Nobody pretends to wonder why.
maturity: mature
cover:
  subject: the limestone courthouse square at dusk, the old First Church with warm light in its windows, a tan-and-azure sheriff's patrol car parked out front, autumn leaves on the street, wide establishing shot

categories:
  - { id: go,   name: GO }
  - { id: talk, name: TALK }
  - { id: work, name: WORK }
  - { id: take, name: TAKE }
  - { id: risk, name: RISK }
  - { id: look, name: LOOK }
  - { id: deal, name: DEAL }

trackers:
  - id: nerve
    name: Nerve
    max: 6
    breaking_point:
      text: |
        Something in you folds. You find a wall to put your back against and stay there
        until your hands are hands again. The afternoon doesn't wait for you.
      effects:
        - tracker.change: { time: -2 }
  - id: body
    name: Body
    max: 6
    breaking_point:
      text: |
        Your legs quit. You sit down where you are, on a curb or a step or a floor, and wait
        for them to come back. Nobody in Graystone hurries you, and nobody helps.
      effects:
        - tracker.change: { time: -2 }
  - id: time
    name: Time
    max: 12
    breaking_point:
      text: |
        The light goes long over the grain elevators. Whatever you came to do, the day is
        nearly out of room for it.
      effects:
        - tracker.change: { nerve: -1 }

difficulties:
  - { id: easy, name: Easy Day,  start: { nerve: 6, body: 6, time: 12 } }
  - { id: hard, name: Rough Day, start: { nerve: 4, body: 4, time: 10 } }

dice:
  pool: 10
  faces:
    - { id: nerve,   type: tracker, tracker: nerve }
    - { id: body,    type: tracker, tracker: body }
    - { id: time-1,  type: tracker, tracker: time }
    - { id: time-2,  type: tracker, tracker: time }
    - { id: setback, type: setback }
    - { id: blank,   type: blank }

tags:
  - { id: law,       name: Law }
  - { id: prison,    name: Prison }
  - { id: patrol,    name: Patrol }    # streets the department drives
  - { id: wanted,    name: Wanted }    # open counts: Criminal Record or Most Wanted (arrest triggers)
  - { id: contractor, name: Contractor } # county work orders: a legitimate reason to be at the station
  # The Undercroft storyline
  - { id: doing-time, name: Doing Time } # action tag, prison scenes only: works a count off the Record
  - { id: please,    name: Please }
  - { id: chained,   name: Chained }
  - { id: cuffed,    name: Cuffed }    # arrested: road cuffs, until the Undercroft
  - { id: caged,     name: Caged }
  - { id: gagged,    name: Gagged }
  - { id: served,    name: Served }
  - { id: inmate,    name: Inmate }    # locked up: Inmate and Time Served (hides the phone)
  - { id: trusted,   name: Trusted }
  # Deputy Anderson's storyline
  - { id: tribute,   name: Tribute }   # action tag: paying her, in cash or in breath
  - { id: noticed,   name: Noticed }   # she knows your name (hides her openers)
  - { id: owned,     name: Owned }     # her paypig
  # Café Linde: Francine Giardano
  - { id: instructed, name: Instructed } # action tag: doing exactly as she says
  - { id: regular,   name: Regular }   # she has your punch card (hides her opener)
  - { id: favored,   name: Favored }   # the Signora's favorite: she lets you finish
  # The library: Juno Vance (@rootkitty)
  - { id: subscribed, name: Subscribed } # you pay for her page (hides SUBSCRIBE)
  - { id: simping,   name: Simping }   # action tag: paying her for another look
  - { id: hooked,    name: Hooked }    # her simp (opens her later scenes)
  # Deputy Anderson in the station kitchenette
  - { id: marked,    name: Marked }    # written on: her Sharpie on your forehead
  # Deputy Seo's holding cage
  - { id: nude,      name: Nude }      # stripped at booking (Nude): every setback costs Nerve
  # The GrayBloods: Red
  - { id: errand,    name: Errand }    # Red's Errand: a hundred dollars owed to her (opens REPORT)
  - { id: blooded,   name: Blooded }   # GrayBlood rep (opens the next crime job)
  - { id: evidence,  name: Evidence }  # carrying the goods of a crime (opens SURRENDER in Seo's arrest)
  # Deputy Seo's storyline
  - { id: snitch,    name: Snitch }    # in her notebook: Seo's Snitch and Informant
  - { id: tip,       name: Tip }       # action tag: telling Seo what you've heard (fills the Snitch)
  - { id: informant, name: Informant } # Seo's Informant (opens her later scenes)
  # Fetish cards (read by other storylines' requires)
  - { id: boots,     name: Boots }
  - { id: uniform,   name: Uniform }
  - { id: socks,     name: Socks }

currencies:
  - { id: cash, name: Cash, symbol: "$", start: 40 }

card_kinds:
  - { id: hero,      name: Hero,      placement: center }
  - { id: mission,   name: Mission,   placement: supply }
  - { id: gear,      name: Gear,      placement: grid }
  - { id: restraint, name: Restraint, placement: grid, forced: true }
  - { id: favor,     name: Favor,     placement: grid }
  - { id: dossier,   name: Dossier,   placement: grid, forced: true }
  - { id: fetish,    name: Fetish,    placement: grid }
  - { id: mark,      name: Mark,      placement: grid, forced: true }
  - { id: job,       name: Job,       placement: grid }

run: { character_kind: hero, mission_kind: mission, default_defeat: run-out }
reserve_capacity: 3
exits: { category: go, word: WALK, cost: 1 }

character_powers:
  - { price: 1, effect: reroll }
  - { price: 2, effect: { skill: random } }
  - { price: 1, effect: recall }

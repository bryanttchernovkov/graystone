# yaml-language-server: $schema=../../../schema/v2/location.json
id: heights
name: Graystone Heights
tags: [patrol]
description: Frame houses up a gentle hill under the maples, and a sheriff's cruiser parked down the block.
actions:
  - category: talk
    word: APPROACH
    cost: 1
    always: true
    unless: [wanted]
    prompt: Walk down the block to the cruiser parked under the maples.
    result:
      text: |
        The cruiser's engine is running. The driver's window is down, and an elbow in a green
        jacket sleeve is resting on the sill.

        She lets you stand at the window long enough to feel it. Then she takes her eyes off her
        laptop, all the way up you and back down.

        Deputy Anderson is twenty-four, maybe, and immaculate: creases you could cut yourself on, no
        hat, long blonde waves with black streaks through them loose over a green patrol jacket,
        dark lipstick, green eyes. Her nails are black and they're tapping the door.

        "Can I help you?" she says, in the voice that means she can't. "Or are you just going to
        stand there breathing on my car?"
      effects:
        - move.to: anderson-patrol-car
  - category: risk
    word: APPROACH
    cost: 1
    always: true
    requires: [wanted]
    prompt: Walk down the block to the cruiser parked under the maples, with an APB out on you.
    result:
      text: |
        You get within a car length. The deputy behind the wheel looks up from the laptop on her
        dash, at you, down at the laptop, and back at you. Her eyebrows go up.

        The driver's door opens.
      effects:
        - move.to: anderson-arrest
art:
  subject: >
    Eye-level photograph from the sidewalk of a quiet residential street climbing a gentle hill
    in a small Midwest town in autumn, standing height, the camera level, looking straight along
    the street. Both sides are lined with modest two-story wood-frame houses from the 1920s in
    white, pale gray and pale yellow clapboard, each with a covered front porch, a short lawn
    and a concrete walk, set back behind a grass strip of tall sugar maples in full orange and
    red leaf whose branches meet over the street. The asphalt is patched and dusted with fallen
    leaves, a pickup truck and an older sedan parked along the left curb. In the background, a
    block away, parked at the right curb under the maples and facing the camera, stands a
    Graystone County Sheriff's patrol car: a present-day Ford Police Interceptor Utility SUV
    painted two-tone, with a white roof, hood and front doors over a tan body, a broad vivid
    azure blue stripe running the full length of each flank below the windows, a gold six-point
    star decal on each front door, a low black roof light bar with red and blue lenses, a black
    steel push bumper and black steel wheels; its windows are tinted dark and its light bar is
    unlit. The sidewalks and porches are empty. The street rises away from the camera toward a
    pale sky, the far houses smaller and softer. Soft overcast late-morning light, even and cool
    from a high gray sky, makes the maples glow against the clapboard and puts a dull sheen on
    the patrol car's paint. Restrained palette of maple orange and red, white and pale yellow
    clapboard, gray asphalt, tan and vivid azure blue; natural texture, fine 35 mm film grain,
    deep focus.

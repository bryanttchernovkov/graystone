# yaml-language-server: $schema=../../../schema/v2/location.json
# Event: Deputy Seo arrests you on the wharf. Reached by move.to from RISK-APPROACH and
# RISK-LOITER at the docks' river view (open record): she is never by the car when you look
# for her. Protocol, not force: a felony prone from behind, every step said out loud, and the
# first shot is the wharf at cheek height and her boot. The arrival puts the Handcuffs on;
# then you choose, face down:
#   DEAL-SURRENDER (evidence): hand her what you're carrying. The crime and the Criminal Record
#     (or Most Wanted) go away,
#     the cuffs come off, and you're Seo's Snitch, back on your feet at the river.
#   TALK-REASON (no evidence): she mocks you for having nothing, and takes you in.
#   TALK-COMPLY (always): say nothing, get taken in.
# Taken in: the arrest goes on in seo-rights (she tramples you and reads the advisement), then
# seo-booking (stripped: Nude) and her holding cage. The Record comes with you, to be worked off.
# Evidence cards (crime jobs: smuggling, theft…) carry tag `evidence`; each one adds its own
# card.lose line to SURRENDER, since a location can only lose cards by ID.
id: seo-arrest
name: Face down on the wharf
tags: [law]
description: Cold concrete under your cheek, the river at eye level, and one black boot a hand's width from your face.
arrival:
  text: |
    "Sheriff's department. Don't turn around."

    The voice is behind you, close, and so soft you almost ask her to say it again. You
    don't. She does anyway, in the same voice, and then keeps going, one instruction at a
    time, waiting until each one is done.

    "Hands up. Open your fingers. Thank you. Down on your knees. Now lie down on your stomach.
    Face to the river. Hands on your head. Lace your fingers. Cross your ankles. Right over
    left." A pause. "Other right."

    The concrete is cold and smells of diesel and gulls. From down here the wharf is a gray
    plain running off to the ship, and then a boot comes down into it a hand's width from your
    face: black, mirror-polished, a low riding heel, the shaft going up out of sight. The other
    one settles somewhere behind your knees.

    "Everybody looks at the car," she says, above you. "I'm never in the car."

    She takes your right hand off your head, brings it down to the small of your back and
    cuffs it, then the left. Double-locks both. Checks the gap at each wrist with her little
    finger. Pats down your pockets, one at a time, the way she gave the orders. Then she
    crouches where you can see her for the first time: tan knees, a duty belt, a violet braid
    lying on the concrete beside your face like a mooring line. The aviators come down half
    an inch.

    "Hello, Ankles. You crossed them very nicely." A small black notebook comes out of her
    jacket. "You have a record, with open counts on it. Before you go in my car, this is the part where you
    talk. Most people say something stupid. Some people say something useful. I write both
    down."
  effects:
    - card.gain: handcuffs
actions:
  - category: deal
    word: SURRENDER
    cost: 1
    always: true
    requires: [evidence]
    prompt: Tell her what you're carrying and give it up to her.
    result:
      text: |
        You tell her. She listens without writing anything, then reaches into the pocket you
        named and takes it out with two fingers, the way you'd lift a fish by the tail. It goes
        into a clear bag from her belt, and the bag goes into her jacket.

        "Thank you," she says. "That was very useful."

        The cuffs come off, left, then right. She stands up, and you hear the notebook open.

        "This is how it works now. That never happened. Your record never happened. I had a quiet
        morning with my gulls." The pencil scratches. "And you have a page. Your name at the
        top, and under it, everything you're going to tell me. People think the river doesn't
        hear things. The river hears everything. Then it tells me." She taps the notebook
        against your shoulder. "So now you're the river. Get up. Walk slow. Nobody watches a
        man walking slow."
      effects:
        - card.lose: handcuffs
        - card.lose: criminal-record
        - card.lose: most-wanted
        - card.gain: seos-snitch
        - move.to: docks-river
  - category: talk
    word: REASON
    cost: 1
    always: true
    unless: [evidence]
    prompt: Talk to her. Try to reason your way out of the back seat.
    result:
      text: |
        You talk. She writes it down, all of it, nodding along, and when you run out she reads
        a line of it back to you in your own words, which is worse.

        "Okay. My turn." She ticks your pockets off on her fingers. "No package. No cash that
        isn't yours. Nothing stolen, nothing to trade, nothing I'd want to put in a bag." She
        laughs, softly, close to your ear. "You have a record and nothing to show for it. Do you
        know what that makes you? Not a criminal. A criminal has something. You're a man who
        got caught without doing the fun part." The pencil goes on scratching. "That's very
        sad, Ankles. I'm writing that down too."

        She closes the notebook. "Okay. Now the part I like."
      effects:
        - move.to: seo-rights
  - category: talk
    word: COMPLY
    cost: 0
    always: true
    prompt: Say "yes, ma'am" and nothing else, and let her take you in.
    result:
      text: |
        "Yes, ma'am."

        She waits for more, and when nothing comes she closes the notebook with a small,
        approving click. "Good. Quiet is smart. Nobody ever gets in trouble for the words they
        didn't say."

        She puts the notebook away. "Now we do this properly."
      effects:
        - move.to: seo-rights
art:
  subject: >
    First-person point-of-view widescreen photograph from cheek height flat on the concrete of
    a river wharf, the camera lying on the ground, level, looking along the concrete. The
    rough gray concrete fills the bottom third of the frame in sharp foreground, wet in
    patches, with a flattened cigarette butt and a gull feather on it. A hand's width from the
    lens, in the right half of the frame, a single woman's leg stands planted on the
    concrete, seen from the toe to just above the knee and nothing higher: a stiff,
    structured, mirror-polished black leather thigh-high riding boot with a rigid straight
    shaft and a low, flat stacked-leather riding heel, fitted tight to the leg, pulled up over
    tan riding breeches with a vivid azure blue stripe down the outer seam; the gray sky and
    the river are reflected in the boot's polish. The frame cuts the leg just above the knee
    at the top edge; nothing else of the woman is in frame. Beyond the boot, out of focus, the wharf runs away to a black iron
    bollard with a coil of mooring rope, the long dark red rusting hull of a river cargo ship,
    and the broad brown river under a pale sky. No one else is in frame. Flat, bright, hazy
    late-morning light from a high pale sky, a hard white highlight running down the boot's
    shaft. Restrained palette of concrete gray, mirror black, uniform tan, vivid azure blue,
    rust red and river brown; natural texture, fine 35 mm film grain, sharp focus
    on the boot's toe, shallow depth of field.

          small jail cell walled with smooth dressed limestone ashlar blocks laid in straight
          courses with thin mortar joints under a whitewashed pointed vault, underground and
          windowless but for one small barred slot at street level, the camera level. A woman
          stands inside the cell at arm's length, framed from the thighs up and filling the
          right half of the frame: a Black American woman in her early thirties, tall and
          athletic with a full, heavy bust, broad straight shoulders and a soldier's posture,
          smooth dark brown skin, long black dreadlocks gathered at the nape and falling to the
          middle of her back, a level, unimpressed stare under straight dark brows, black leather duty gloves and a ring of heavy iron keys on a steel chain at her hip. She wears the Graystone County Sheriff's
          uniform: a crisp, pressed tan long-sleeved uniform shirt of heavy cotton twill with a
          pointed collar, a full button-front placket, two buttoned flap chest pockets piped in
          vivid azure blue, shoulder epaulets edged in vivid azure blue, an embroidered vivid
          azure blue and gold patch on each upper sleeve and a polished gold six-point star
          badge pinned over the left pocket; a vivid, saturated azure blue necktie with a small
          gold tie bar; tan riding breeches with a vivid azure blue stripe down the outer seam;
          a black leather duty belt with a polished brass buckle; and stiff, structured, mirror-
          polished black leather thigh-high riding boots with rigid straight shafts and low, flat stacked-leather riding heels, fitted tight to the leg, pulled up over the breeches to mid-thigh; her head is bare. Three vivid
          azure blue chevrons sit on each upper sleeve beneath the patch. She looks straight
          into the lens with flat, clinical boredom, eyes narrowed, mouth a straight line, and
          holds a black metal flashlight up at shoulder height in her gloved left hand, its beam
          aimed into the lens in a soft white flare, while her gloved right index finger points
          sharply to the side at the bare stone wall. The left half of the frame shows the cell:
          a steel slat cot with a gray wool blanket squared to a knife-edge crease, a pair of
          shoes lined up beneath it, and a seatless steel toilet wiped bright. Behind her, the
          black iron bars of the open cell door and the warm corridor beyond. A caged

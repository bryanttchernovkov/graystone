# yaml-language-server: $schema=../../../schema/v2/location.json
id: undercroft-cell-back
name: Cell Three, the back wall
tags: [law, prison]
description: A steel cot, an iron ring at ankle height, and a small barred window high up at street level.
hub: true
actions:
  - category: work
    word: TIDY
    cost: 2
    tags: [cooperate]
    prompt: Tidy the cell for inspection. She'll inspect the cell, and then she'll inspect you.
    result:
      text: |
        You square the blanket on the cot to a crease, wipe the rim of the steel toilet, and line
        your shoes up under the cot rail.

        She comes in with a flashlight and inspects all of it: the blanket corners, the toilet,
        the grout under the iron ring. Then she turns the flashlight on you.

        "Jeans down. Shirt up. Face the wall."

        You do it. She has you put your forehead to the cold stone and checks behind your ears and
        under your jaw with a gloved finger. She checks the lock of the cage with a tug that goes
        through you to the back of your teeth.

        "Bend. Spread."

        You bend. You spread. She takes her time with the flashlight.

        "Clean," she says at last, and clicks it off. "Do the blanket again. You did it wrong."

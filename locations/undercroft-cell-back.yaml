  - category: look
    word: WAIT
    cost: 0
    always: true
    prompt: Lie down on the cot and wait.
    result:
      text: |
        You lie on the steel slats with the blanket over you and count the caged bulbs, then the
        stones in the vault, then nothing. Hours go by the way they do down here, measured by the
        scratch of her pen and the scrape of her chair. When you get up, your body has caught up
        with you a little.
      effects:
        - tracker.change: { time: -2 }
        - dice.refresh
  - category: look
    word: TURN
    cost: 0
    always: true
    prompt: Turn around.
    result:
      text: |
        You turn back to the bars, the vault beyond them, and the desk under the first arch where
        she sits.

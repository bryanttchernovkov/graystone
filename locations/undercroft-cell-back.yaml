    street level, facing the back wall. Against the left wall stands a cot of riveted steel
    slats with a gray wool blanket folded square at its foot. Low on the back wall at ankle
    height a heavy iron ring is set into the stone, a length of steel chain hanging from it and
    coiled on the worn gray flagstones. In the right corner stands a seatless stainless steel
    toilet. High at the top of the back wall, just under the vault, a small horizontal window
    slot at street level: three rusted iron bars set in crumbling gray mortar and a pane of old
    glass gone milky, a pale cool glow coming through it. The window sits in the upper center of
    the frame, the cot leads in from the lower left, the ring and chain sit at lower center

          a narrow alley at night. Wet grass and fallen yellow maple leaves fill the foreground
          inches from the lens, and a pale man's bare hands and forearms with short unpolished
          nails enter from the bottom edge of the frame, fingers dug into the wet grass, pulling
          forward. The alley's wet cobbles stretch away into the distance between the church's
          gray ashlar wall on the left and a brick wall on the right, a green dumpster beside

  - category: deal
    word: ASK
    cost: 1
    always: true
    tags: [doing-time]
    unless: [gagged]
    prompt: Ask her for something. She grants it her way, with a glove, a key, and no finish.
    result:
      text: |
        "Sergeant, may I ask for —"

        "I know what you're asking for." She takes the key out of her breast pocket. "Stand.
        Stand still."

        She unlocks the cage and drops it on the blanket. Her gloved hand closes around you,
        leather cool and then warm, and starts slow.

        "You don't finish," she says. "You tell me when you're close. You don't tell me, you get
        a week."

        It doesn't take long. "Close." She stops dead and holds you, squeezing at the base until
        it backs off, watching your face like a gauge. Then again. Then a third time, faster,
        until you're shaking and saying her rank in a voice you don't recognize, and she lets go
        and steps back and watches you twitch in the air between you.

        When you've calmed enough to fit, she locks the cage back on, one-handed, and puts the
        key away behind the star.

        "Granted," she says. "Thank me."

        You thank her.

  - category: look
    word: STUDY
    cost: 1
    prompt: Study the window and the bars.
    result:
      text: |
        The window is a slot at the top of the back wall, a foot and a half high at street level:
        three iron bars set into the stone and a pane of glass gone milky with age. The mortar
        round the bars is old and soft. You could dent it with a thumbnail, if you could reach it.

        From the cot rail, with your hands free and two minutes when she wasn't looking, a man
        could maybe get his shoulders through.
      effects:

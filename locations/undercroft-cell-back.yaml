          American woman in her early thirties, tall and athletic with a full, heavy bust, broad
          straight shoulders and a soldier's posture, smooth dark brown skin, long black
          dreadlocks gathered at the nape and falling to the middle of her back, a level,
          unimpressed stare under straight dark brows, black leather duty gloves and a ring of
          heavy iron keys on a steel chain at her hip. Above her the whitewashed pointed vault

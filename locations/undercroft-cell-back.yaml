  - category: deal
    word: OFFER
    cost: 1
    tags: [please]
    unless: [gagged]
    prompt: Offer to make yourself useful. She sits down to think it over, on your face.
    result:
      text: |
        "Sergeant, permission to be useful."

        She considers that. Then she comes in and points at the cot. "On your back. Head on the
        rail."

        You lie down. She stands over you a moment, boots planted either side of the cot,
        unbuttons her breeches and works them down to the tops of her boots, and then she sits:
        a slow, full weight onto your face, the starched tail of her shirt brushing your forehead,
        one gloved hand braced on the stone above you.

        "Tongue," she says. "Breathe when I lift."

        You lick her and she grinds down and doesn't lift. When she does it's an inch and a
        second, enough for one breath, and then the weight again, warm and wet and total. She
        rides your mouth at her own pace, talking to you the whole time in the voice she uses for
        the ledger, *left, slower, there, stay there*, and when she comes she does it in silence,
        thighs locked hard around your ears, and stays down until the shaking stops.

        She stands, buttons up, and tucks the shirt back to regulation.

        "Useful," she allows.

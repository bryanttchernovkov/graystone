  - category: risk
    word: SLIP
    cost: 2
    unless: [chained]
    prompt: Go for the window while your hands are free and her back is turned.
    result:
      text: |
        You wait for the creak of her chair settling at the desk, then step up onto the cot rail
        and reach. The mortar comes away under your fingers in damp gray crumbs. The first bar
        wobbles, then the second, and then both come out together and you're holding them, and
        you have to lay them on the blanket without a sound, one at a time.

        The glass is old and gives in one piece. Cold air, wet leaves, the smell of the diner's
        fryer. You get your arms through, then your head, then your shoulders, and for a long
        second you are stuck at the ribs with your legs kicking in the Undercroft and your face in
        the alley grass, listening for keys.

        Then you're through.

        You lie in the wet grass for a breath, then get up and walk, not run, because a man
        running in Graystone gets noticed. The alley lets out onto Main Street. Somewhere under
        your feet a chair scrapes on flagstone, and somewhere behind you a key ring rattles on
        its chain.
      effects:
        - card.lose: inmate
        - card.lose: served-sentence
        - card.gain: criminal-record
        - move.to: main-street-south

# yaml-language-server: $schema=../../../schema/v3/location.json
# Beat: Deputy Anderson takes your compliment apart. Reached by move.to (random) from
# TALK-FLATTER at her cruiser; sends you straight back to her window.
id: anderson-flatter-cold
name: Deputy Anderson's cruiser
tags: [law, patrol]
description: She tells you what's wrong with you.
arrival:
  text: |
    She looks at you for a while. Then she leans her elbow on the sill and starts, slowly, a
    little louder than she needs to, because a woman is walking a dog past behind you.

    "Okay. So. The shoes. The haircut — did you do that, or did someone do that to you? The
    way you're standing, like you're waiting for a bus that doesn't love you. The fact you
    think I needed to hear it. From you." She looks past you. "Did I miss anything?"

    The woman with the dog says, "The shirt," and keeps walking.

    "The shirt," Anderson agrees. "Thank you, Linda." She goes back to her laptop. "You can
    stay there, babe. You're not in my way. You're not in anything's way."
  effects:
    - tracker.change: { nerve: -1 }
    - move.to: anderson-patrol-car
art:
  loras: ["tfny7_krea2_000000800:1"]
  subject: >
    Widescreen photograph from standing eye height on the sidewalk beside the open driver's
    window of a parked sheriff's patrol car on a quiet residential street in a small Midwest
    town in autumn, the camera level and one pace from the white car door with its broad vivid
    azure blue stripe and gold six-point star decal. tfny7 woman in her tfny7 uniform with a
    green bomber jacket sits behind the wheel with her left elbow on the window sill and her
    chin propped on her bare left hand, framed from the waist up in the window opening; her bare
    right hand rests on the top of the steering wheel. She looks directly into the camera,
    making eye contact with the viewer, with withering, pitying contempt: green eyes slowly
    looking the viewer up and down, one dark brow arched high, berry lips pulled to one side in
    a mocking pout. Nothing of the viewer is in frame: no hands, no arms. Through the far
    window, blurred, white clapboard houses under orange maples. Soft overcast late-morning
    light from a high gray sky lights her face evenly. Restrained palette of white car door,
    forest green, tan, vivid azure blue, platinum blonde and maple orange; natural skin texture,
    fine 35 mm film grain, focus on her eyes.

# yaml-language-server: $schema=../../../schema/v2/location.json
# Beat: Deputy Anderson takes your compliment apart. Reached by move.to (random) from
# TALK-FLATTER at her cruiser; sends you straight back to her window.
id: anderson-flatter-cold
name: Deputy Anderson's cruiser
tags: [law, patrol]
description: She tells you what's wrong with you.
arrival:
  text: |
    She looks at you for a while. Then she leans her elbow on the sill and starts, slowly, a
    little louder than she needs to, because a woman is walking a dog past behind you.

    "Okay. So. The shoes. The haircut — did you do that, or did someone do that to you? The
    way you're standing, like you're waiting for a bus that doesn't love you. The fact you
    think I needed to hear it. From you." She looks past you. "Did I miss anything?"

    The woman with the dog says, "The shirt," and keeps walking.

    "The shirt," Anderson agrees. "Thank you, Linda." She goes back to her laptop. "You can
    stay there, babe. You're not in my way. You're not in anything's way."
  effects:
    - tracker.change: { nerve: -1 }
    - move.to: anderson-patrol-car
art:
  loras: ["DGirlsModel14:1"]
  subject: >
    First-person point-of-view widescreen photograph from standing eye height on the sidewalk
    beside the open driver's window of a parked sheriff's patrol car on a quiet residential
    street in a small Midwest town in autumn, the camera level and one pace from the white car
    door with its broad vivid azure blue stripe and gold six-point star decal. One woman sits
    behind the wheel with her left elbow on the window sill and her chin propped on her bare
    left hand, out of the green bomber sleeve, framed from the waist up in the window opening.
    She looks directly into the camera, making eye contact with the viewer, with withering,
    pitying contempt: green eyes slowly looking the viewer up and down, one dark brow arched
    high, berry lips pulled to one side in a mocking pout. She is a white American woman of
    twenty-four, slim and toned with a full bust and long legs, fair skin, long wavy
    platinum-blonde hair with bold jet-black streak highlights falling past her shoulders,
    dark elegant makeup with smoky black eyeliner, long dark lashes and deep berry lipstick,
    striking bright green eyes, arched dark brows, and long almond-shaped nails painted glossy
    black. She wears the Graystone County Sheriff's patrol uniform: a dark forest-green bomber
    jacket of smooth nylon twill with ribbed knit cuffs, collar band and waistband, zipped up
    to the middle of her chest, worn with both arms in its sleeves and both shoulders covered,
    a single polished gold six-point star badge pinned on its left chest and an embroidered
    vivid azure blue and gold patch on each upper sleeve; above the zipper, the pointed collar
    of a crisp, pressed tan uniform shirt and the knot of a vivid, saturated azure blue
    necktie with a small gold tie bar. Her head is bare, her long hair loose over the jacket's
    shoulders, and her hands are bare. Her bare right hand, out of the other green bomber
    sleeve, is raised beside her face, one glossy black-nailed finger pointing down and up
    the length of the viewer. Reflected small in the car's side mirror, a woman in a fleece
    vest walking a golden retriever on the sidewalk. Through the far window, blurred, white
    clapboard houses under orange maples. Soft overcast late-morning light from a high gray sky
    lights her face evenly. Restrained palette of white car door, forest green, tan, vivid
    azure blue, platinum blonde and maple orange; natural skin texture, fine 35 mm film grain,
    focus on her eyes.

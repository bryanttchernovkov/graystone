# yaml-language-server: $schema=../../../schema/v2/location.json
# Event: the Undercroft's trusted release, on the First Church steps.
# Reached only by move.to from DEAL-THANK in undercroft-cell (released with Ashby's Trust).
# Her parting words are the arrival; the only way on is down the steps to Main Street.
# Art: Ashby in the outdoor bomber and campaign hat (rewritten from the former Time Served
# ending; regenerate with --overwrite).
id: undercroft-trusted-release
name: The First Church steps
tags: [law]
hub: true
description: Wide limestone steps, the big oak doors open behind you, Sergeant Ashby on the top step in her campaign hat.
arrival:
  text: |
    She stops you on the top step with two fingers flat on your chest. Daylight, maples, the
    square, the cruisers nosed in at the curb. She takes her campaign hat from under her arm
    and settles it level.

    Then she taps her shirt pocket, once. Something small and hard clicks against the star.

    "In case you were wondering where it lives," Sergeant Ashby says. "It lives here."

    She looks out over the square. "Sundays I take my coffee at Café Linde. Window table. If
    you're ever in there, you can come and ask me nicely."

    She stays on the top step, gloves folded behind her back, to watch you go.
actions:
  - category: talk
    word: ASK
    cost: 1
    prompt: Ask her when the cage comes off.
    result:
      text: |
        She considers the question for longer than it deserves.

        "When I take it off," Sergeant Ashby says. "That's the whole schedule."

        She lets you stand there with that, then gives an inch. "A man who asks me on a Sunday,
        with a coffee he didn't make me wait for, sometimes gets a better answer. Sometimes."
      effects:
        - skill.gain: deal
  - category: look
    word: WATCH
    cost: 1
    prompt: Stand on the steps a minute and watch the square with her.
    result:
      text: |
        A cruiser swings in to the curb below the steps and a deputy gets out, a tall redhead
        with her campaign hat already on and a paper sack from the diner in one hand. She looks
        you over on her way up, boots to collar, then looks at Ashby.

        "Released," Ashby says.

        "Huh," says the redhead, and goes inside.

        The square goes on without either of you: a pickup idling at the light, the courthouse
        flag snapping, a woman with a stroller stopping to let a deputy's cruiser back out. You
        stand in the sun with the oak doors at your back until your eyes stop squinting.
      effects:
        - tracker.change: { nerve: +1 }
art:
  loras: ["KreaEbonyBabe1"]
  subject: >
    Eye-level widescreen photograph from the sidewalk of a small Midwest town square on a
    bright autumn morning, looking up a flight of wide stone steps to the open oak double
    doors of an old limestone Gothic Revival church built of smooth dressed limestone ashlar
    blocks laid in straight courses with thin mortar joints. In the open doorway at the top
    of the steps stands one woman, alone and whole and small in the frame, the dim nave
    behind her, her black-gloved right hand resting on the edge of the door and her
    black-gloved left hand at her duty belt. She looks down the steps directly into the
    camera, making eye contact with the viewer, with dry, knowing satisfaction: eyes steady
    under the hat brim, one brow raised a fraction, a small closed-mouth smile at one
    corner. She is a Black American woman in her early thirties, tall and athletic with a
    full, heavy bust, broad straight shoulders and a soldier's posture, smooth dark brown
    skin, long black dreadlocks gathered at the nape and falling to the middle of her back,
    straight dark brows, black leather duty gloves and a ring of heavy iron keys on a steel
    chain at her hip. She wears the Graystone County Sheriff's patrol uniform: a dark
    forest-green bomber jacket of smooth nylon twill with ribbed knit cuffs, collar band and
    waistband, zipped up to the middle of her chest, worn with both arms in its sleeves and
    both shoulders covered, a single polished gold six-point star badge pinned on its left
    chest and an embroidered vivid azure blue and gold patch on each upper sleeve, with
    three vivid azure blue chevrons beneath the patch on each sleeve; above the zipper, the
    pointed collar of a crisp, pressed tan uniform shirt and the knot of a vivid, saturated
    azure blue necktie with a small gold tie bar; a black leather duty belt with a polished
    brass buckle at her waist below the jacket's hem; tan riding breeches with a vivid azure
    blue stripe down the outer seam; and stiff, structured, mirror-polished black leather
    thigh-high riding boots with rigid straight shafts and low, flat stacked-leather riding
    heels, fitted tight to the leg, pulled up over the breeches to mid-thigh. On her head,
    worn level over her eyes, sits a stiff campaign hat of the kind state troopers and drill
    instructors wear, in light khaki tan felt the same color as her shirt, with a wide flat
    brim, a pinched four-dent crown and a vivid azure blue hatband. Maple trees with red and
    gold leaves line the square, and the stained-glass windows of the church catch the sun.
    Low clear morning sunlight from the left lights the church facade gold and throws her
    long shadow across the steps. Palette of pale limestone, maple red and gold, khaki tan,
    forest green and vivid azure blue; natural skin texture, fine 35 mm film grain, deep
    focus.

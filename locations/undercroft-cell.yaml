  - category: look
    word: WATCH
    cost: 1
    prompt: Watch her work.
    result:
      text: |
        She keeps the ledger in block capitals, one line per detainee per hour. Every twenty
        minutes she gets up, walks the row with her keys quiet in her gloved hand, looks into each
        cell without a word, and goes back to the desk. Once she takes a tin and a soft brush out
        of the drawer and does her boots where she sits, heel to toe, without looking down.

        She never once looks at you.

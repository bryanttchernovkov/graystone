  - category: deal
    word: PROMISE
    cost: 1
    requires: [trusted]
    unless: [gagged]
    prompt: Make her a promise. Tonight she might believe one.
    result:
      text: |
        "Sergeant, may I make you a promise?"

        "You may."

        "I'll behave."

        She takes the key ring off her hip and looks at it, then at you. "Hands through the bars."

        She unlocks the cuffs, then the belly chain, then has you sit on the cot and put your feet
        to the bars for the irons. The steel comes off piece by piece and goes over her shoulder in
        a clinking heap on the flagstones.

        "You so much as look at that window," she says, "and you do the rest of your time on the
        ring."

        The cage stays. The key stays in her pocket.

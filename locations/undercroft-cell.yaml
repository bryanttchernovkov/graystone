          woman's boot. Her right boot rests on the cot rail and fills the frame on a diagonal
          from the lower left corner to the upper right: a stiff, structured, mirror-polished
          black leather thigh-high riding boot with a rigid straight shaft and a low, flat
          stacked-leather riding heel, its rounded toe cap glistening with a fresh wet streak
          that runs up over the vamp and the instep, a tight line of black welt stitching around
          the sole, the soft crease at the ankle, and the long polished shaft rising out of the
          upper right corner just above her knee, where tan riding breeches with a vivid azure
          blue stripe disappear into the boot top. Her black-gloved hand rests on her knee at
          the top right edge. A pale man's bare hands and forearms with short unpolished nails
          enter from the bottom edge of the frame and cradle the boot from below, one at the
          heel and one at the ankle. The frame holds only the boot, the gloved hand and the

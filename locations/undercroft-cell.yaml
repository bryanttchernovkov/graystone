# yaml-language-server: $schema=../../../schema/v2/location.json
id: undercroft-cell
name: Cell Three
tags: [law, prison]
description: A burial niche with bars, a steel cot, and the Sergeant's desk in view under the first arch.
hub: true
actions:
  - category: talk
    word: CALL
    cost: 1
    always: true
    tags: [doing-time]
    unless: [gagged]
    prompt: Call out to the Sergeant. She answers, and then she wants answers back, by number, loud enough for the other cells.
    result:
      text: |
        "Sergeant?"

        "Sergeant what."

        "Sergeant, permission to speak."

        "Granted. Order one."

        You give her order one. She doesn't look up from the ledger. "Order three." You give her
        order three. "Louder. Cell Five didn't hear you."

        You say it louder. Down the vault somebody in Cell Five laughs, and stops laughing when
        her chair creaks.

        She takes you through all five, out of order, and sends you back to the start when you
        say *can* instead of *may*. At the end she has you thank her for the instruction, by rank,
        in a full sentence.

        "You're welcome," she says, and turns a page.
      effects:
        - skill.gain: talk
      art:
        loras: ["KreaEbonyBabe1"]
        subject: >
          First-person point-of-view widescreen photograph from standing eye height inside a small
          jail cell walled with smooth dressed limestone ashlar blocks laid in straight courses with
          thin mortar joints under a whitewashed pointed vault, underground and windowless but for
          one small barred slot at street level, looking out through the black iron bars of the cell
          door, which cross the foreground slightly out of focus, toward a gray steel desk four
          paces away under a pointed arch of smooth dressed limestone ashlar blocks laid in straight
          courses with thin mortar joints. Behind the desk, sitting upright and framed between two
          bars from the waist up in the center of the frame, is a woman who looks directly into the
          camera, making eye contact with the viewer, with stern, expectant impatience: chin lifted,
          eyebrows raised sharply, eyes wide and demanding, mouth open mid-word as she calls out.
          She is a Black American woman in her early thirties, tall and athletic with a full, heavy
          bust, broad straight shoulders and a soldier's posture, smooth dark brown skin, long black
          dreadlocks gathered at the nape and falling to the middle of her back, straight dark
          brows, black leather duty gloves and a ring of heavy iron keys on a steel chain at her
          hip. She wears the Graystone County Sheriff's uniform: a crisp, pressed tan long-sleeved
          uniform shirt of heavy cotton twill with a pointed collar, a full button-front placket,
          two buttoned flap chest pockets piped in vivid azure blue, shoulder epaulets edged in
          vivid azure blue, an embroidered vivid azure blue and gold patch on each upper sleeve and
          a polished gold six-point star badge pinned over the left pocket; a vivid, saturated azure
          blue necktie with a small gold tie bar; a black leather duty belt with a polished brass
          buckle; her head is bare. Three vivid azure blue chevrons sit on each upper sleeve beneath
          the patch. Over an open ruled ledger she holds a black pen up in her gloved right hand,
          pointed at the lens like a baton, her other gloved hand flat on the ledger. Beyond her the
          windowless underground corridor recedes under pointed arches, caged bulbs hanging on black
          cords and a row of barred cell doors along the wall. A caged incandescent bulb directly
          above the desk throws warm downlight across her face, her shoulders and the ledger, and
          lays amber highlights along the blurred bars in the foreground. Palette of black iron,
          pale limestone, uniform tan, vivid azure blue and bulb amber; natural skin texture, fine
          35 mm film grain, focus on her eyes between the bars.
  - category: work
    word: CHORE
    cost: 1
    always: true
    tags: [doing-time]
    prompt: Ask for something useful to do. She has a chore below the knee, and the Undercroft doesn't issue polishing cloths.
    result:
      text: |
        She unlocks the door, comes in, and sets her right boot on the rail of the cot, the toe a
        foot from your face. The boot goes up past her knee to the middle of her thigh, a long
        column of black leather with the azure stripe of her breeches disappearing into it.

        "Standing order five," she says. "Tongue. Toe to top. Skip a stitch and you start over."

        You get down and start at the toe cap. The leather tastes of polish and floor wax and
        the cold of the stairs. You work the welt, the vamp, the crease at the ankle, then up
        the shaft where it's warm from her leg, in long flat strokes. She watches with one
        gloved forearm resting on her raised knee, and says nothing.

        Then the left boot, the same way, from the toe up.

        At the end she stands on both, turns one heel on the flagstones, and bends to sight along
        the shaft under the bulb.
      effects:
        - skill.gain: work
        - move.to: { random: [undercroft-chore-pass, undercroft-chore-fault] }

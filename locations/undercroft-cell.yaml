art:
  loras: [KreaEbonyBabe1]
  subject: >
    Eye-level photograph taken through the bars of a jail cell door, from inside the cell
    looking out: thick black iron bars stand in the extreme foreground, the lens close behind
    them, soft and out of focus, dark vertical stripes running the full height of the frame
    with a flat iron crossbar at waist height. Beyond the bars, sharp and in focus, one pace
    away in the corridor outside the cell, a woman stands facing the lens, seen from mid-thigh
    up, her black-gloved right hand wrapped around one bar from the far side: a Black
    American woman in her early thirties, tall and athletic with a full, heavy bust, broad
    straight shoulders and a soldier's posture, smooth dark brown skin, long black dreadlocks
    gathered at the nape and falling to the middle of her back, a level, unimpressed stare
    under straight dark brows, black leather duty gloves, two pairs of steel handcuffs in
    black leather cases on her belt and a ring of heavy iron keys on a steel chain at her hip.
    She wears the Graystone County Sheriff's uniform: a crisp, pressed tan long-sleeved
    uniform shirt of heavy cotton twill with a pointed collar, a full button-front placket,
    two buttoned flap chest pockets piped in vivid azure blue, shoulder epaulets edged in
    vivid azure blue, an embroidered vivid azure blue and gold patch on each upper sleeve and
    a polished gold six-point star badge pinned over the left pocket; a vivid, saturated
    azure blue necktie with a small gold tie bar; tan riding breeches with a vivid azure blue
    stripe down the outer seam; a black leather duty belt with a polished brass buckle; and
    stiff, structured, mirror-polished black leather thigh-high riding boots with rigid
    straight shafts fitted tight to the leg, pulled up over the breeches to mid-thigh, their
    tops at the bottom edge of the frame; her head is bare. Three vivid azure blue chevrons
    sit on each upper sleeve beneath the patch. Her face sits in the gap between two blurred
    bars, and she looks straight into the lens with a level, unimpressed stare, chin slightly
    raised, lips closed. Behind her the corridor runs away under pointed arches of smooth
    dressed limestone ashlar blocks laid in straight courses with thin mortar joints, a
    whitewashed pointed vault overhead, caged bulbs hanging from it on black cords, a row of
    barred cell doors along the far wall. A caged incandescent bulb in the corridor above and
    behind her backlights her shoulders and dreadlocks and lays warm light across the
    flagstones, while the blurred bars in the foreground stay dark. Palette of black iron,
    pale limestone, uniform tan, vivid azure blue and bulb amber; natural skin texture, fine
    35 mm film grain, shallow depth of field with focus on her eyes.

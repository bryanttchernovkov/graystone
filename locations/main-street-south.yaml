id: main-street-south
name: Main Street, looking south
tags: []
description: Past the last storefronts the street climbs into the Heights. A doctor's office in an old brick house, and a side street opening off the main one.
art:
  subject: >
    Eye-level photograph from the center line of a two-lane main street in a small Midwest
    county seat in autumn, standing height, the camera level, looking straight down the street
    to where the commercial blocks end. In the near foreground both sides are lined with two-
    story nineteenth-century commercial buildings of pale gray limestone and red brick with
    arched upper windows and black steel lampposts, a few pickup trucks angle-parked at the
    curbs. Beyond the last storefronts the street runs on and climbs a gentle hill into a
    residential neighborhood: rows of modest wood-frame houses in white, pale gray and pale
    yellow clapboard with covered front porches, among tall sugar maples in orange and red leaf,
    rising toward the horizon. On the left side of the street, in the mid-ground, a doctor's
    office occupies a converted two-story red-brick Victorian house set back behind a small
    clipped lawn, with white window trim, a white-columned front porch, a gray wooden wheelchair
    ramp alongside the front steps, a white awning over the front door and a small blank white
    wooden sign on two posts beside the walk. On the right side, just ahead, a narrower side
    street opens off the main street between a limestone hardware store and a red-brick
    building, its sidewalk, lampposts and storefronts receding away to the right. The sidewalks
    hold one or two distant pedestrians. Late-afternoon golden sun from the right lights the
    left-hand facades and the brick of the doctor's office warm and lays long shadows across
    the asphalt toward the left curb, the maples on the hill glowing. Restrained palette of
    limestone gray, brick red, clapboard white, maple orange and late-sun gold; natural
    texture, fine 35 mm film grain, deep focus.

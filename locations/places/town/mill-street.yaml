id: mill-street
name: Mill Street
tags: []
description: A narrow street of brick shopfronts ending at the Carnegie library. The mayor's office, flag out front, on the near side.
art:
  subject: >
    Eye-level photograph from the center of a narrow side street in a small Midwest county seat
    in autumn, standing height, the camera level, looking straight along it. Both sides are
    lined with two-story red-brick and pale gray limestone storefronts with tall narrow windows,
    plain painted signboards above the doors, black steel lampposts and a few sidewalk maples
    in yellow leaf, two pickup trucks parked along the left curb. At the far end the street is
    closed by a small Carnegie library: a symmetrical Beaux-Arts building of pale gray limestone
    on a raised base, a broad flight of stone steps up to a portico of four Ionic columns under
    a triangular pediment, a shallow copper dome weathered green, and tall arched windows on
    either side. On the right side of the street, in the near mid-ground, stands the mayor's
    office: a stately three-story red-brick Italianate city hall with tall narrow arched windows
    under white stone lintels, a deep bracketed cornice, a short flight of white stone steps up
    to heavy paneled double doors, two white stone planters of orange chrysanthemums beside
    them, and a tall white flagpole with an American flag lifting in the breeze. The sidewalks
    are quiet, one or two distant pedestrians near the library steps. Low late-afternoon sun
    from the far end of the street, behind the library, rims the copper dome, the columns and
    the cornices in gold and leaves the near facades in soft blue shadow. Restrained palette of
    red brick, limestone gray, copper green, maple yellow and late-sun gold; natural texture,
    fine 35 mm film grain, deep focus.

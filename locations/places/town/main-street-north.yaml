id: main-street-north
name: Main Street, looking north
tags: []
description: The old First Church closes the street, cruisers nosed in at its steps; the Quarryman on one side, Café Linde on the other.
art:
  subject: >
    Eye-level photograph from the center line of a two-lane main street in a small Midwest
    county seat in autumn, standing height, the camera level, looking straight up the street.
    Both sides are lined with two- and three-story nineteenth-century commercial buildings of
    pale gray limestone and red brick, with tall arched upper windows, decorative cornices,
    black steel lampposts and young trees in sidewalk grates, a few pickup trucks angle-parked
    along both curbs. At the far end the street opens onto a town square, and the view is
    closed by an old deconsecrated Gothic Revival church built of smooth dressed limestone
    ashlar blocks laid in straight courses with thin mortar joints, with a tall square bell
    tower, tall pointed stained-glass windows and heavy oak double doors at the top of wide
    stone steps. Three identical Graystone County Sheriff's patrol cars are angle-parked at the
    curb in front of the church steps, each a present-day Ford Police Interceptor Utility SUV
    painted two-tone, with a white roof, hood and front doors over a tan body, a broad vivid
    azure blue stripe running the full length of each flank below the windows, a gold six-point
    star decal on each front door, a low black roof light bar with red and blue lenses, a black
    steel push bumper and black steel wheels. On the left side of the street, in the near
    mid-ground, an old pub fills the ground floor of a limestone building: a dark green painted
    wooden shopfront with small-paned windows glowing amber, a heavy green door, and an iron
    bracket over the sidewalk holding a painted wooden board showing a crossed pick and hammer.
    Facing it on the right side, a European coffee house: a cream and black striped awning,
    tall plate-glass windows in polished brass frames with a glass pastry case inside, and
    round marble-topped bistro tables with bentwood chairs set out on the sidewalk beneath the
    awning. Late-afternoon golden sun from the left rakes across the right-hand facades and
    lights the church front warm, with long shadows across the asphalt. Restrained palette of
    limestone gray, brick red, pub green, cream and black, tan and vivid azure blue; natural
    texture, fine 35 mm film grain, deep focus.

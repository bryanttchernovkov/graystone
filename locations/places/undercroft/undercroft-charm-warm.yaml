# yaml-language-server: $schema=../../../../../schema/v3/location.json
# A reaction beat: entered only by a random move.to, it shows her reaction and returns you.
id: undercroft-charm-warm
name: Cell Three
tags: [law, prison]
description: She looks up.
arrival:
  text: |
    "That uniform," you say. "The creases. The boots. It's the sharpest thing in this county."

    She looks up. Then, before she can stop herself, down at her own sleeve: the chevrons, the
    crease.

    "Forty minutes with an iron every morning," she says. "Twenty more with the boots. Nobody
    notices."

    "I noticed."

    She looks at you. "Yes," she says. "You did."
  effects:
    - boost.change: { card: ashbys-good-side, amount: +1 }
    - move.to: undercroft-cell
  art:
    loras: ["ashby7_krea2_000001200:0.9"]
    subject: >
      Intimate photograph from standing eye height inside a small jail cell walled with smooth
      dressed limestone ashlar blocks laid in straight courses with thin mortar joints under a
      whitewashed pointed vault, underground and windowless but for one small barred slot at
      street level, looking through the black iron bars of the cell door, two blurred bars
      framing the shot. Just beyond them ashby7 woman in her sheriff's uniform, a sergeant in
      her early thirties with her long black locs gathered at the nape, stands close, framed
      from the chest up. She looks directly into the camera, making eye contact with the viewer,
      caught off guard and pleased: eyes softened, brows lifted, a small, reluctant smile
      breaking at one corner of her mouth. Her pressed tan uniform shirt has vivid azure blue
      trim on the pockets and epaulets, three vivid azure blue chevrons on each sleeve and a
      polished gold six-point star badge, with a vivid, saturated azure blue tie and a small
      gold tie bar; her hands are in black leather duty gloves. Her black-gloved fingertips
      smooth the sharp pressed crease below the chevrons on her sleeve. Behind her, out of
      focus, the warm underground corridor of smooth dressed limestone ashlar blocks laid in
      straight courses with thin mortar joints with caged bulbs. A caged bulb behind her rims
      her locs and her shoulder with warm light, her face in soft warm side light. Palette of
      uniform tan, vivid azure blue, gold, black leather and black iron; natural skin texture,
      fine 35 mm film grain, focus on her eyes.

# yaml-language-server: $schema=../../../../../schema/v3/location.json
# The First Church station, the back: the Sheriff's office upstairs, built into the old choir
# loft but fitted out as a proper office (art: no church left in it but the round window behind
# her desk, which her desk shot shows). Up the stair from the bullpen (down goes back).
# TALK-APPROACH takes you to her desk (her storyline). A setback here (and on the way in) gets you
# caught: sheriff-caught. TAKE-DRAWER is petty cash and a count. DEAL-REPORT (Spanking Fetish) is the
# corner, unasked.
id: station-sheriff-office
name: The Sheriff's office
tags: [law]
hub: true
setback_penalty:   # caught where you shouldn't be: always the Sheriff
  requires: [contractor]
  effects:
    - move.to: sheriff-caught
description: "A proper office upstairs: walnut paneling, a big desk, a leather couch, shelves of law books, a window over the bullpen, and the Sheriff behind the desk, smiling."
actions:
  - category: talk
    word: APPROACH
    cost: 1
    always: true
    prompt: Cross the office to the Sheriff's desk.
    result:
      text: |
        She watches you come all the way across the room, pleasant and patient, and doesn't get
        up: the desk is big, the chair is bigger, and the round window behind her puts all the
        light in the room on you.

        "There he is." Her smile is warm and it reaches her eyes, which are very blue. "Laura
        Brandt. Sheriff. Sit down, hon, you're making the room look untidy." She waits until you
        do. "Now. Niamh tells me everything that comes through those doors, and she's told me a
        little about you. I'd like to hear the rest from you. Take your time."
      effects:
        - move.to: sheriff-desk
  - category: look
    word: WINDOW
    cost: 1
    prompt: Look down at the bullpen through the loft window.
    result:
      text: |
        From up here the nave is a map of desks. You can see every screen, every cage, the top of
        every deputy's head. A deputy at the far end looks up, sees the window, and straightens
        her tie without being asked.

        The window doesn't open. It was built for a choir to sing through.
      effects:
        - skill.gain: look
  - category: take
    word: DRAWER
    cost: 2
    tags: [snoop]
    prompt: When she goes to the window with her back to you, try her desk. It's stealing, and it will go on your record.
    result:
      text: |
        Second drawer on the left: a hairbrush, by itself, on a folded cloth. You leave it. The one under it has a county checkbook,
        a box of good pens and a plain white envelope of petty cash, and you have forty dollars of it in your pocket before you've
        thought about whose desk this is.

        "Find what you needed, hon?" she says to the window, pleasantly.

        She doesn't turn around. You tell her you dropped a screw. She says that's fine. By the time you've reached the stairs you
        can hear her picking up the phone.
      effects:
        - currency.change: { cash: +40 }
        - card.gain: criminal-record
        - move.to: station-bullpen
  - category: deal
    word: REPORT
    cost: 1
    always: true
    requires: [spanked]
    prompt: Cross her office without being asked, take off your clothes and go and stand in the corner.
    result:
      text: |
        Nobody sent for you. You fold your things on the arm of the couch, and she doesn't look up from the page, not even when
        you're down to your shorts. Nose in. Fingers laced. There's the knot in the wood.

        You hear the pen stop.

        "Well, hon," she says, and you can hear how much she's smiling. "Aren't you getting to be a help around the place."

        The pen starts again. Nobody tells you how long. Your breathing slows, and it's the most peaceful you have been all week.
      effects:
        - tracker.change: { nerve: +2, time: -1 }
art:
  loras: ["lorbrandt_krea2_000001200:1"]
  subject: >
    A wide eye-level photograph from just inside the door of an elegant, expensive executive
    office. The left two-thirds of the frame look across the room: walls paneled in rich dark
    walnut, a white ceiling with a slim brass chandelier, a deep-green and cream patterned rug
    on a polished herringbone oak floor, a dark green leather Chesterfield sofa with a cream
    cashmere throw before a low walnut coffee table with a crystal decanter and two glasses, a
    tall built-in walnut bookcase of leather-bound law books, and in the far wall a wide
    interior window of clear glass looking out over a bright open room below. In the right third
    of the frame, three paces away, behind a large polished walnut desk with a green leather top
    and a brass banker's lamp, sits lorbrandt woman in her uniform in a tall dark leather chair,
    waist-up above the desk, her hands folded on the leather, turned half toward the camera with
    a pleasant, inviting smile. A single round stained-glass window glows in the wall behind
    her. Warm afternoon light from the round window, the brass lamp and the chandelier fill the
    room with a soft golden glow. 35 mm lens, natural colour, fine film grain, deep focus.

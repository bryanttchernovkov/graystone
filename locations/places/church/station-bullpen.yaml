# yaml-language-server: $schema=../../../../../schema/v3/location.json
# The First Church station, the back: the nave as a bullpen, the holding cages in the side
# aisle. Reached only through DEAL-SIGN at the front desk (contractor). East: the sacristy
# kitchenette; south: the gym in the annex out back; up: the Sheriff's office; out: back past the
# front desk to the narthex. Down is the Undercroft, which you don't walk into. The printer job
# (FIX / SERVICE) ends the visit: Niamh takes the badge and walks you out. RISK-SNOOP and RISK-PLANT
# (Juno's USB key, rootkit) carry `snoop`, so a setback on them is the Sheriff (the badge's
# penalty); the printer itself is safe to work on.
id: station-bullpen
name: The bullpen
tags: [law]
hub: true
description: Steel desks in rows down the nave under the stained glass, the holding cages in the side aisle, and a printer by the pulpit steps with a sign on it.
actions:
  # The printer job, the contractor's one visit: Niamh walks back to check on it, signs it off,
  # takes the badge and walks you out (Niamh's Good Side, $30). FIX and SERVICE are a swapped
  # pair on `uniform`: with a uniform fetish she stands over you while you work, and WORSHIP is
  # a second boost and two tokens.
  - category: work
    word: FIX
    cost: 2
    unless: [uniform]
    prompt: Fix the printer by the pulpit steps. The county pays by the job.
    result:
      text: |
        The sign on it says OUT OF ORDER in three different handwritings. Inside, there's a jam,
        a second jam behind the first, and a folded index card wedged in the paper tray to stop
        it closing. Somebody has written on the card: *for the IT guy. good luck x*

        You're on your knees by the pulpit steps with the side panel off when you hear heels
        on the flagstones, quick and certain, coming all the way down the nave. Niamh puts a
        mug of tea on the step beside your hand. *visitor*, it says, in red marker.

        "Milk, no sugar. You look like a milk-no-sugar." She leans on the pulpit rail and
        watches you work, and keeps up a running commentary for the deputies at the nearest
        desks: that's the IT man, isn't he quick, look at his hands, he knows what he's doing,
        not like the last one. Nobody answers her. Everybody listens.

        When the printer finally warms up and prints a test page, she takes it out of the tray
        before you can, reads it as if it were a letter, and claps, once.

        "Brilliant. You're a keeper." She signs your work order against the printer lid with a
        flourish, then holds out her hand, palm up, red nails. "Badge, love."

        You unclip it. She drops it in her shirt pocket and walks you back up the nave with a
        hand flat between your shoulder blades, past her desk and out into the narthex.

        "Escorted access," she says. "That means escorted out, too." She's already back behind
        the counter. "I'll email. Don't be a stranger."

        The county's payment shows up on your phone before you've reached the door.
      effects:
        - currency.change: { cash: +30 }
        - skill.gain: work
        - card.gain: niamhs-good-side
        - card.lose: contractor-badge
        - move.to: station-lobby
      art:
        loras: ["nivdoyle_krea2_000001200:1"]
        # Written like her captions: her LoRA has this shot (dataset 17), and no belt, badge or boots.
        # "Kneeling height" knelt her down and "sheriff's bullpen" drew a deputy's kit (2026-11-02).
        # "Church … pulpit" drew pews and a pulpit with no office in sight (2026-11-06): the office is
        # named object by object, the church only as walls and one window.
        subject: >
          nivdoyle woman in her uniform, standing beside a jammed gray office printer with a
          crumpled sheet of paper caught in its rollers, leaning toward the camera with one
          forearm on the printer's lid, holding out a white mug with the word "visitor" written
          on it in red marker, looking straight into the lens with bright, teasing approval and a
          wide, delighted smile, waist-up, seen from a slightly low angle, behind her, out of focus, a busy open-plan office: rows of gray steel desks with computer monitors,
          phones and stacked paperwork, gray filing cabinets, a cork bulletin board crowded with notices and a
          chain-link holding cage, inside pale limestone walls under one tall stained-glass window, soft red
          and gold daylight through the stained glass.
  - category: work
    word: SERVICE
    cost: 2
    requires: [uniform]
    prompt: Service the printer by the pulpit steps. The county pays by the job.
    result:
      text: |
        The sign on it says OUT OF ORDER in three different handwritings. Inside, there's a jam,
        a second jam behind the first, and a folded index card wedged in the paper tray to stop
        it closing. Somebody has written on the card: *for the IT guy. good luck x*

        You're on your knees by the pulpit steps with the side panel off when you hear heels
        on the flagstones, quick and certain, coming all the way down the nave. They stop
        beside you. Niamh doesn't lean on the rail. She bends over you, one hand on the
        printer's lid, to look into the works, and stays there.

        It is very close. The tan twill is pressed to hard creases down each sleeve. Azure
        piping along the epaulets, an embroidered patch on each arm, every button of the placket
        done up to the collar and every one of them lined up. The tie hangs straight down out of
        the knot, an inch from your face, azure silk, the gold bar set level across it. Below
        it, the shirt tucked tight into a high tan skirt, and below that the dark sheen of
        stockings.

        You've stopped working. You've stopped some time ago.

        "Mm." She doesn't straighten up. "It's not the printer you're looking at, is it,
        love." The tie swings a little when she talks. "It's all right. Everybody's got
        something." Her green eyes come down to yours and stay there. "Go on, then. Touch it.
        Tell me what it is about it. Hands and words. Nothing else, mind."
      effects:
        - currency.change: { cash: +30 }
        - skill.gain: work
        - card.gain: niamhs-good-side
        - choose:
            - label: Touch it, and tell her
              text: |
                You lift the tie off the air with two fingers. The silk is cool and heavy. You
                run your thumb up it to the knot and feel how hard it's been pulled, and you
                tell her: that it's tied like she means it.

                "Keep going."

                You smooth your palm down the placket, over the buttons, one at a time. The
                twill is stiff as card under your hand and warm from her underneath it. You
                trace the azure piping along her epaulet out to the seam of her shoulder, and
                the patch, the raised gold thread of it under your fingertips, and you tell her
                all of it. The starch. The creases. That nobody else in the building looks as
                if they've been ironed into place. That you can't stop.

                She listens to all of it with her chin on her hand and her eyes half closed.

                "That," she says at last, "is the nicest thing anybody's said to me in this
                church, and I've been proposed to in it." She straightens up and tugs her tie
                straight where you've had it, and her cheeks are pink. "Finish my printer."

                You do. When the test page comes out she signs your work order against the lid,
                holds out her hand for the badge, and drops it in the pocket you had your hand
                over a minute ago. She walks you back up the nave and out into the narthex, a
                hand flat between your shoulder blades.

                "Escorted out, love. Rules." She winks. "I'll email."
              effects:
                - boost.change: { card: niamhs-good-side, amount: +1 }
                - skill.gain: talk
                - skill.gain: look
                - card.lose: contractor-badge
                - move.to: station-lobby
            - label: Keep your eyes on the printer
              text: |
                You put your eyes back on the rollers and your hands back in the printer, and
                keep them there.

                "Shame," she says, and straightens up, and watches you finish with her arms
                folded. When the test page comes out she signs your work order against the lid,
                holds out her hand for the badge and drops it in her shirt pocket. She walks you
                back up the nave and out into the narthex, a hand flat between your shoulder
                blades.

                "Escorted out, love. Rules. I'll email."
              effects:
                - card.lose: contractor-badge
                - move.to: station-lobby
      art:
        loras: ["nivdoyle_krea2_000001200:1"]
        subject: >
          A close first-person photograph from below, the camera looking up at nivdoyle woman in
          her uniform as she bends forward from the waist over the lens, her upper body tipped
          far forward, one hand on the gray lid of an office printer at the left edge of the
          frame. She is framed from her lips down to her chest: her dark red lips in a small,
          indulgent smile at the top edge of the frame and her copper hair falling over her left
          shoulder. Her long azure blue silk necktie has swung free of her crisp tan shirt and
          hangs straight down from the knot at her collar toward the lens, a long full-length
          tie, the gold tie bar near the knot, the wide end dangling well below her chest into
          the bottom of the frame. A man's bare hand rises from the bottom edge of the frame,
          the wide tip of the hanging necktie lying across his fingertips. Behind her, out of
          focus, a whitewashed pointed vault and the glow of a stained-glass window. Warm
          desk-lamp light from the side lights the starch, the silk and the gold. 50 mm lens,
          natural fabric texture, fine film grain, shallow depth of field on the necktie.
  - category: look
    word: WATCH
    cost: 1
    prompt: Stand out of the way by a pillar and watch the bullpen.
    result:
      text: |
        It's quieter than a police station ought to be. Phones ring twice, never three times.
        The radio murmurs. Deputies talk low at their desks, and when they laugh they laugh at
        something on a screen, and stop.

        A man in the nearer cage asks if he can use the bathroom. The deputy at the desk outside
        his cage finishes her sentence, then her paragraph, then looks up and says, "Ask
        properly." He asks again. She tells him it'll be a minute. It's twenty.
      effects:
        - skill.gain: look
  - category: risk
    word: SNOOP
    cost: 2
    tags: [snoop]
    prompt: While nobody's looking, go through the nearest deputy's desk.
    result:
      text: |
        Top drawer: a stapler with somebody's name on it in nail polish, a tin of boot wax, and a folder that isn't locked in
        anything. You lift the cover. There's a photo of a man you don't know coming out of a bar, and clipped to it a sheet in a
        small careful hand: when he leaves for work, what he drinks, which of his neighbors don't like him.

        The next folder down has a county work order in it. It's yours. Somebody has already filled in how you take your coffee.

        You put them back the way they were, and get out from behind the desk a good deal smarter.
      effects:
        - skill.gain: look
        - boost.change: { card: character, amount: +1 }
  # Juno's job (rootkit): his USB key in a deputy's computer. Tag snoop, so a setback is the
  # Sheriff (the badge's penalty). Spends the key for the Backdoor.
  - category: risk
    word: PLANT
    cost: 3
    tags: [snoop]
    requires: [rootkit]
    prompt: While nobody's looking, plug Juno's USB key into a deputy's computer. It's a crime against the department, inside the department.
    result:
      text: |
        The desk at the end of the row is empty, the chair pushed back, a cardigan over it and a
        half-eaten yogurt by the keyboard. The screen isn't locked. Juno was right about that.

        You crouch as if you've dropped a pen. The tower is under the desk, and the ports are on
        the back of it, in the dark, by feel. The stick goes in on the third try. A tiny teal cat
        blinks on the screen above you, once, and is gone.

        Two desks over a deputy laughs at something on her phone and says, "Oh, she did *not*."
        Nobody looks your way.

        You pull the stick out, stand up, and walk back down the nave like a normal person.
        Halfway down, your phone buzzes in your pocket.

        *im in*

        *lol. u know ur kind of a criminal now right*
      effects:
        - card.lose: rootkitty-usb
        - card.gain: backdoor
art:
  subject: >
    Eye-level widescreen photograph from standing height at the back of the nave of an old
    deconsecrated Gothic Revival church converted into a sheriff's bullpen, the camera level,
    looking down the length of the nave toward the raised chancel. The walls are smooth
    dressed limestone ashlar blocks laid in straight courses with thin mortar joints, with
    tall pointed stained-glass windows along both sides and a whitewashed pointed vault above.
    Down the middle of the nave run two rows of gray steel office desks with phones, monitors,
    wire trays and green-shaded lamps, and at two of them, in the mid-ground, sit two women
    deputies in crisp tan long-sleeved uniform shirts with vivid azure blue neckties, tan
    riding breeches and black thigh-high riding boots, turned to their screens. Along the side
    aisle at the left stand two tall cages of galvanized chain-link with steel benches inside,
    both empty. At the far end, by the stone steps of the old pulpit, stands a large gray
    office printer with a handwritten paper sign taped to its lid. Daylight through the
    stained glass lays soft red, blue and gold patches across the desks and the flagstone
    floor, with the warm pools of the desk lamps below. Restrained palette of pale limestone,
    steel gray, uniform tan, vivid azure blue and stained-glass red, blue and gold; natural
    texture, fine 35 mm film grain, deep focus down the nave.

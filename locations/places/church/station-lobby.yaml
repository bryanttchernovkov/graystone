# yaml-language-server: $schema=../../../../../schema/v3/location.json
# The First Church station, inside the doors: the narthex, Niamh Doyle's front desk, and through
# the inner arch the nave bullpen and the holding cages. Up the steps from Main Street (down goes
# back out). Nothing walks past her desk: TALK-APPROACH takes you to it (her storyline), where a
# contractor badge signs you through to the back.
id: station-lobby
name: The First Church, the front desk
tags: [law]
hub: true
description: Cool stone, a radio murmuring, the bullpen through the arch, and a front desk with a red-haired woman behind it who saw you come in.
actions:
  - category: talk
    word: APPROACH
    cost: 1
    always: true
    prompt: Go up to the front desk.
    result:
      text: |
        The desk is a long counter of dark oak where the church used to sell candles, and she
        lets you reach it before she looks up from her screen. When she does, it's worth the
        wait, and she knows it: green eyes behind black-framed glasses, red mouth, all that red
        hair swept over one shoulder, and a smile that has done this ten thousand times and
        still enjoys it.

        "Hiya, love." The accent is Australian with something older underneath. "Niamh. I run
        the place. They'll tell you the Sheriff does, and she does, upstairs." She folds her
        hands on the counter. "Down here, it's me. Are you visiting, delivering, or confessing?"
      effects:
        - move.to: station-desk
  - category: look
    word: WATCH
    cost: 1
    prompt: Sit on the visitors' bench by the door and watch the station work.
    result:
      text: |
        The bench is an old church pew with a cushion nobody has sat on comfortably since it was
        made. From it you can see through the arch into the nave: steel desks under the stained
        glass, phones, deputies in tan going up and down the aisle in boots that echo.

        In the side aisle, behind chain-link, two cages. One has a man in it, sitting very
        straight on the bench, looking at nothing. A deputy walks past his cage without looking
        at him and he sits straighter.

        Nobody gets past the front desk without stopping. Not the deputies, not the Mayor's
        assistant with a folder, not a man with a pizza. She makes every one of them smile on
        the way through.
      effects:
        - skill.gain: look
art:
  loras: ["nivdoyle_krea2_000001200:1"]
  subject: >
    A wide eye-level photograph from just inside the heavy oak doors of the narthex of an old
    deconsecrated limestone church converted into a sheriff's station. The left two-thirds of
    the frame look across the narthex, pale limestone walls under a whitewashed pointed vault,
    worn flagstones and an old wooden pew against the wall, and through a tall pointed stone
    arch into the long nave beyond, now a bullpen of gray steel desks under tall stained-glass
    windows, with two cages of galvanized chain-link along the side aisle. In the right third of
    the frame, three paces away, behind a long reception counter of dark polished oak with a
    brass desk lamp and a big open sign-in book, sits nivdoyle woman in her uniform, waist-up
    above the counter, holding a black desk telephone receiver to her ear and writing in the
    book, glancing up at the camera mid-sentence with bright, flirtatious amusement. Daylight
    through the stained glass throws soft colored light down the nave, and the brass lamp lights
    her face warmly from the side. 35 mm lens, natural colour, fine film grain, deep focus from
    the counter to the far end of the nave.

# yaml-language-server: $schema=../../../schema/v2/location.json
# Beat: a photo from Juno Vance, bought with SIMP on Subscribed: @rootkitty or Rootkitty's
# Simp, from anywhere. Reached by move.to (random) from that card action; move.back returns
# you to wherever you were, without its arrival (ADR 0043 in the engine repo).
id: juno-dm-video
name: A video from @rootkitty
description: Ten seconds of her face, close, saying it.
arrival:
  text: |
    The phone buzzes, and it isn't a photo. It's a video, ten seconds long. Her face, very close,
    lit by a laptop. She isn't smiling.

    "Say it," she says, low. "Say you want it. Out loud, wherever you are. I'll know if you
    don't."

    The video ends on her laughing.

    You say it. Quietly, but you say it. A second later: *good boy. see? that wasn't so hard. it
    will be tho*
  effects:
    - tracker.change: { nerve: +1, body: +1 }
    - move.back
art:
  loras: ["KreaTransBabe:1"]
  subject: >
    First-person point-of-view widescreen photograph from standing eye height, the camera
    level. A black smartphone turned sideways in landscape orientation is held level close in
    front of the lens in a pale man's two bare hands, one at each end of the phone entering
    from the bottom corners of the frame: broad knuckles, short, bare, unpainted nails cut
    straight across, the thumbs resting on the phone's front edge. The phone fills most of the
    frame; around it, only a thin margin of plain charcoal-gray wall, soft and out of focus.
    Its wide, bright landscape screen shows, edge to edge, a horizontal photograph taken in a
    young woman's small bedroom: a still from a video call, one woman sitting at her gaming
    desk close to her laptop camera, filling the photograph from her collarbones to her bangs,
    lit from below by the cool blue-white glow of a screen. She looks straight into her
    camera, making eye contact with the viewer, with intent, teasing hunger: eyes steady
    behind her glasses, brows low, glossy lips parted as she speaks. She is a trans woman of
    twenty-three, slim and petite with narrow shoulders and a small bust, pale skin with a
    light dusting of freckles across her nose, long straight hair dyed half jet black and half
    pastel pink, split sharply down a center part, the left half jet black and the right half
    pastel pink, worn in two low pigtails, blunt straight-cut bangs, thick black rectangular
    rimmed glasses, sharp black winged eyeliner, glossy pale pink lips and a small silver ring
    in her septum, with a black velvet choker with a small silver O-ring at her throat. Behind
    her, out of focus, pastel posters on a pale wall, a strip of pink LED light along the
    ceiling, a bed with black and pink sheets and plush toys. A small white play triangle sits
    at the center of the screen. The screen's glow lights the thumbs at its edges, the
    photograph on it crisp and bright. Restrained palette of pale skin, cool screen blue,
    pastel pink, black, LED pink and charcoal; natural skin texture, fine 35 mm film grain,
    focus on the phone screen.

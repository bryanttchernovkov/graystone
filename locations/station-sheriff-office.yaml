# yaml-language-server: $schema=../../../schema/v2/location.json
# The First Church station, the back: the Sheriff's office upstairs, built into the old choir
# loft but fitted out as a proper office (art: no church left in it but the round window behind
# her desk, which her desk shot shows). Up the stair from the bullpen (down goes back).
# TALK-APPROACH takes you to her desk (her storyline).
id: station-sheriff-office
name: The Sheriff's office
tags: [law]
hub: true
description: "A proper office upstairs: walnut paneling, a big desk, a leather couch, shelves of law books, a window over the bullpen, and the Sheriff behind the desk, smiling."
actions:
  - category: talk
    word: APPROACH
    cost: 1
    always: true
    prompt: Cross the office to the Sheriff's desk.
    result:
      text: |
        She watches you come all the way across the room with the pleasant, patient look of a
        woman who has all day and is choosing to spend some of it on you. She doesn't get up.
        She doesn't need to: the desk is big, the chair is bigger, and the round window behind
        her puts all the light in the room on you.

        "There he is." Her smile is warm and it reaches her eyes, which are very blue. "Laura
        Brandt. Sheriff. Sit down, hon, you're making the room look untidy." She waits until you
        do. "Now. Niamh tells me everything that comes through those doors, and she's told me a
        little about you. I'd like to hear the rest from you. Take your time."
      effects:
        - move.to: sheriff-desk
  - category: look
    word: WINDOW
    cost: 1
    prompt: Look down at the bullpen through the loft window.
    result:
      text: |
        From up here the nave is a map of desks. You can see every screen, every cage, the top of
        every deputy's head. A deputy at the far end looks up, sees the window, and straightens
        her tie without being asked.

        The window doesn't open. It was built for singing through. Now it's built for watching.
      effects:
        - skill.gain: look
art:
  loras: ["DMilfModel3:1"]
  subject: >
    Eye-level widescreen photograph from standing height just inside the door of an elegant,
    expensive executive office, the camera level. The left two-thirds of the frame look across
    the room: walls paneled in rich dark walnut with a warm satin sheen, a white ceiling with
    a slim brass chandelier, a thick deep-green and cream patterned rug on a polished
    herringbone oak floor, a dark green leather Chesterfield sofa with a cream cashmere throw
    before a low walnut coffee table with a crystal decanter and two glasses, a tall built-in
    walnut bookcase of law books in matching leather bindings and framed commendations, and in
    the far wall a wide interior window of clear glass looking out over a bright open room
    below. In the right third of the frame, three paces away, a large polished walnut
    executive desk with a green leather top, a brass banker's lamp with a green glass shade
    and a neat stack of folders, a single round window of softly colored stained glass in the
    wall behind it, and behind the desk in a tall dark leather chair one woman, alone, sits
    seen from the waist up above the desk, her hands folded on the leather, turned half toward
    the lens and smiling at the camera with a pleasant, inviting smile: blue eyes warm and
    steady, brows relaxed, rose lips curved. She is a white American woman of forty, slim and
    shapely with a full bust, fair skin, long curly auburn hair styled in loose, soft waves
    falling past her shoulders, striking bright blue eyes, softly arched brows, and natural
    rose lipstick. She wears the Graystone County Sheriff's dress uniform: a tailored, fitted
    single-breasted dress jacket of fine dark olive-green wool, closed at the front with four
    polished gold buttons from the waist to below the breastbone, its notched lapels piped and
    its cuffs banded in vivid azure blue, shoulder epaulets edged in vivid azure blue with
    three small gold six-point stars on each, an embroidered vivid azure blue and gold patch
    on each upper sleeve and a polished gold six-point star badge pinned on its left breast;
    in the V of the lapels, only the pointed collar of a crisp, pressed tan uniform shirt and
    the knot of a vivid, saturated azure blue necktie with a small gold tie bar. Warm
    afternoon light from the round window falls behind her, and the brass lamp and chandelier
    fill the room with a soft, golden glow. Restrained palette of dark walnut, green leather,
    cream, brass, dark olive green, vivid azure blue and gold; natural texture, fine 35 mm
    film grain, deep focus.

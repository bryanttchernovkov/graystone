# yaml-language-server: $schema=../../../schema/v2/location.json
# Beat: a photo from Juno Vance, bought with SIMP on Subscribed: @rootkitty or Rootkitty's
# Simp, from anywhere. Reached by move.to (random) from that card action; move.back returns
# you to wherever you were, without its arrival (ADR 0043 in the engine repo).
id: juno-dm-socks
name: A photo from @rootkitty
description: The soles of her striped socks, right up at the camera.
arrival:
  text: |
    The phone buzzes. A photo from her bed: her feet, right up at the camera, the soles of the
    striped socks gone gray with a day's wear, toes curled toward the lens. Behind them, small and
    far away, her face, smirking.

    *been in these since 8am*

    *library. bus. gym. library again*

    *u wish u could smell them. u can't. that's the whole point. that's what u paid for*

    You zoom in.
  effects:
    - tracker.change: { body: +1 }
    - move.back
art:
  loras: ["KreaTransBabe:1"]
  subject: >
    Overhead photograph looking straight down at a scuffed dark walnut tabletop, the camera
    directly above it. The wood grain fills the whole frame from edge to edge around a black
    smartphone lying flat on the table in landscape orientation, the phone filling the middle
    two-thirds of the frame, with the rim of a white coffee cup at the top left corner of the
    frame and a set of house keys at the top right. A pale man's bare hand with broad knuckles
    and short, bare, unpainted nails cut straight across rests on the wood at the bottom right
    corner of the frame, one fingertip touching the phone's edge. Its wide, bright landscape
    screen shows, edge to edge, a horizontal photograph taken in a young woman's small bedroom,
    the whole photograph contained inside the phone's black bezel: a photograph taken from the
    foot of her bed of one woman lying back on it propped on her elbows, her legs stretched out
    straight toward her camera with her knees and ankles pressed together, so that the soles of
    her feet in black and pastel pink horizontally striped thigh-high socks fill the front of
    the photograph, big and close, toes curled toward the lens, the cotton worn gray at the
    heels and the balls of her feet. Between and above her feet, smaller and farther back, her
    face looks over her toes at her camera with a lazy, superior smirk: eyes half-lidded behind
    her glasses, one brow raised. She is a trans woman of twenty-three, slim and petite with
    narrow shoulders and a small bust, pale skin with a light dusting of freckles across her
    nose, long straight hair dyed half jet black and half pastel pink, split sharply down a
    center part, the left half jet black and the right half pastel pink, worn in two low
    pigtails, blunt straight-cut bangs, thick black rectangular rimmed glasses, sharp black
    winged eyeliner, glossy pale pink lips and a small silver ring in her septum. She wears an
    oversized black cotton hoodie over a fitted white ribbed crop top and a black velvet choker
    with a small silver O-ring. Behind her, out of focus, a pale wall with pastel posters, a
    strip of pink LED light along the ceiling and black and pink pillows with plush toys. The
    screen glows bright against the dark wood, the photograph on it crisp. Restrained palette of
    dark walnut, black and pastel pink stripes, worn gray cotton, pale skin and LED pink;
    natural texture, fine 35 mm film grain, focus on the phone screen.

# yaml-language-server: $schema=../../../../../schema/v3/location.json
# Beat: the Sheriff's default correction, from TALK-GO in sheriff-caught (two in four). TALK-THANK gains
# a notch of Sore Bottom and goes back to the bullpen, badge kept.
id: sheriff-spanking
name: The Sheriff's couch
tags: [law]
description: Green leather under your hands, the wool of her dress trousers under your stomach, and your underwear around your knees.
arrival:
  text: |
    She walks to the desk, opens the second drawer on the left and takes out a hairbrush. It's an old one,
    oval, dark wood, with the varnish worn pale in the middle of the back. It has been in
    this county longer than the department has, she tells you, and a sitting judge has met it.

    She sits down in the middle of the Chesterfield, smooths her trousers over her knees and pats them.

    "Jeans and shorts down, hon. Down. There's a good fella. Over you come."

    You go over. She moves you an inch forward with a firm hand at your waist, the way she wants you, and
    settles her forearm across the small of your back. It weighs more than it should. Down in the
    bullpen a phone rings twice and stops.

    "Now, this is going to be hard," she says kindly. "I don't believe in the other kind."
actions:
  - category: talk
    word: THANK
    cost: 0
    always: true
    prompt: Take it across her knees. It's going to hurt badly, and she'll want thanking.
    result:
      text: |
        The first one makes no sense. It's a flat crack, and for a moment nothing, and then it arrives all
        at once on one side, and it's a lot worse than the hand you were braced for. The second is on the
        same spot. She has a slow, even arm and she talks all through it, in the same voice, about you.

        She knows about the house you're renting. She knows the rent. She asks after your manager at the
        county, and waits for an answer, and when you don't give one she puts three on the crease where your
        legs start and asks again. You answer. She tells you that's lovely.

        Somewhere around the twenties you stop being able to stay still. Your feet are going by themselves.
        She doesn't pin you any harder, or need to. You're saying things into the leather now, sorry and
        please and ma'am, and it makes no difference to the rhythm, and you start to understand that the
        rhythm isn't up to you and never was. You cry at about the point she says, "There we are, that's
        the part I was waiting on," and she gives you ten more of the same.

        Then it's over, and her hand is resting on what she's done, cool on the heat. She leaves it there.
        She pats you twice.

        "What do we say, hon?"

        "Thank you, Sheriff."

        "You're very welcome. I do hope you'll be more careful." She lets you up and watches you pull your
        jeans over it, which takes time and makes you hiss, and she puts the brush back in the drawer. She
        hands you your work order with a smile. "That printer's not going to fix itself."
      effects:
        - tracker.change: { body: -1, time: -1 }
        - card.gain: sore-bottom
        - move.to: station-bullpen
art:
  # pvotk7 in its README's caption order. He is bare, as the prose has it ("Jeans and shorts down"), said once
  # in the outfit slot, with no boxers named: naming them put cloth back on his backside (2026-11-07).
  loras: ["pvotk7_krea2_000002000:0.9"]
  subject: >-
    pvotk7 POV over-the-knee spanking photo, a first-person view from the man's own head as he lies face down
    across a woman's lap, looking back along his own body, his plain charcoal T-shirt and his bare red buttocks
    filling the foreground, his naked backside raised over her thighs, flushed bright red from the spanking, and
    his bare hairy legs stretching out to the right of the frame, his blue jeans pushed all the way down and
    bunched around his ankles above his scuffed brown work boots, lifted off the ground. A fifty-year-old woman with long copper-auburn waves, a few
    silver strands at the temples, bright blue eyes and fair freckled skin, in a tailored, buttoned dark
    olive-green dress uniform jacket with polished gold buttons, its notched lapels piped and its cuffs banded in
    vivid azure blue, epaulets edged in vivid azure blue with small gold stars, an embroidered vivid azure blue and
    gold patch on each upper sleeve and a polished gold six-point star badge on its left breast, over the collar
    of a tan shirt and a vivid azure blue necktie, sits on a dark green leather
    Chesterfield sofa with him across her knees. One of her hands rests flat on his bare red backside and her
    other arm is raised high, gripping an old oval wooden hairbrush with a dark polished back. She looks into the
    camera with a warm, pleasant, patient smile. Set in an elegant executive office with walnut paneling and a
    brass lamp, warm afternoon light through a round stained-glass window.
  passes:
    # Her face only (2026-11-08). Qwen boxes all of her whatever `find` says, and GroundingDINO keeps a detection
    # if any one word of the label matches: "woman's head" and "woman in a green jacket" both matched her whole
    # body, so the mask was Qwen's box, over her lap and his backside (a tan lump, then a gun in her hand).
    # "face" has neither word, so the mask is her face and everything else is the base.
    # SAM3 (2026-11-08): "face" alone gave a clean face mask but left the base's plain army jacket. So all of
    # her minus her hands and the brush (`keep | cut`): her LoRA owns her hair, face and whole uniform, and the
    # hand on him and the brush stay the base's. 0.55 so the piping, patches and badge can come in.
    - find: the seated woman with the hairbrush
      pad: 32
      segment: "woman:1 | hand:2, hairbrush:1"
      denoise: 0.55
      loras: ["lorbrandt_krea2_000001200:1"]
      subject: >-
        lorbrandt woman in her uniform, seated on a dark green leather Chesterfield sofa, her long copper-auburn
        waves with a few silver strands at the temples, bright blue eyes and fair freckled skin, in a tailored,
        buttoned dark olive-green dress uniform jacket with polished gold buttons, its notched lapels piped and its
        cuffs banded in vivid azure blue, epaulets edged in vivid azure blue with small gold stars, an embroidered
        vivid azure blue and gold patch on each upper sleeve and a polished gold six-point star badge on its left
        breast, the collar of a tan shirt and a vivid azure blue necktie. She looks into the camera with a warm,
        pleasant, patient smile that is also an instruction. Walnut paneling behind her, warm afternoon light,
        natural skin and wool texture, fine film grain.
    # Her knee under his thighs came out as a bare, hairy man's leg (2026-11-08): the base names his bare legs
    # and not her breeches. A second pass dresses it, so the base stays.
    - find: the bare knee sticking out below the man's bare thighs at the bottom of the frame
      pad: 32
      segment: "knee:1 | jeans:1"
      denoise: 0.7
      subject: >-
        A woman's knee and lower thigh in tan riding breeches with a vivid azure blue stripe down the outer seam,
        seated on a dark green leather Chesterfield sofa under a man lying across her lap, warm afternoon light,
        natural fabric texture, fine film grain.

# yaml-language-server: $schema=../../../../../schema/v3/location.json
# Event: Deputy Seo reads you your rights, standing on you, on the wharf. Reached by move.to
# from TALK-REASON and TALK-COMPLY in seo-arrest. She rolls you onto your
# back, walks up you and reads the Graystone advisement (bible) word for word off the card.
# The arrival costs Body and goes straight on to booking at the First Church (seo-booking).
id: seo-rights
name: On your back on the wharf
tags: [law]
description: The sky, a pair of mirrored aviators looking down out of it, and Deputy Seo standing on your chest.
arrival:
  text: |
    She takes you by the shoulder and the hip and rolls you onto your back, your cuffed hands
    under you, the concrete cold under your shoulders. Then she stands up, puts a hand on the
    cruiser's roof for balance, and steps up onto you.

    One boot on your stomach. When she has her balance, the other on your chest, and then all of
    her weight on the two of them. The soles are smooth leather, the heels low and square. She
    stands there turning her head from the ship to the river and back, as she does on the wharf,
    while you work out how to breathe under her.

    "Graystone advisement," she says, and takes a laminated card out of her jacket. She reads
    it in the same small, soft voice, every word, and at every full stop she moves one boot.

    "You have the right to remain silent. You won't, but you have it." Step. "Anything you say
    will be written down and used against you. Anything you don't say, I will guess." Step.
    "You have the right to an attorney. The county has one. She is a woman, she is very busy,
    and she will agree with me." Her heel finds the soft place under your ribs, and stays.
    "You have the right to ask for things. Asking is not the same as getting. You have the
    right to say please. You will use that one the most."

    She walks up you, stomach to chest, and puts the last sole flat on your collarbone, the
    edge of it against your throat. Her pink hair swings forward
    against her cheek. She lowers the
    aviators and looks at you over them, and over the boot.

    "Do you understand these rights as I have read them to you? The answer is 'yes, Deputy.'"

    She waits for it. Then she steps off you, writes the time in the notebook, and lifts you
    to your feet by the chain.

    She drives you up from the river with the radio low, humming along to the dispatcher,
    and parks on the square. Up the church steps by the steel between your wrists, and through
    the big oak doors.
  effects:
    - tracker.change: { body: -1 }
    - move.to: seo-booking
art:
  loras: ["undrft_krea2_000001500:1"]
  subject: >
    An undrft underfoot POV photo taken lying flat on the concrete of a river wharf with the camera
    pointing straight up at the sky, as the smooth black leather sole of a mirror-polished black
    leather thigh-high riding boot stomps straight down toward the camera, worn and scuffed, grit
    ground into the leather, its low, flat stacked-leather heel studded with small nail heads, large
    in the upper half of the frame. A Korean woman deputy of twenty-nine with a dusty-pink bob to
    the collar with dark roots, dark eyes and berry-pink lips stands directly over the camera,
    wearing a dark forest-green bomber jacket of smooth nylon twill hanging open over a crisp tan
    long-sleeved uniform shirt with chest pockets piped in vivid azure blue, a vivid azure blue
    necktie, a polished gold six-point star badge on the jacket, a black leather duty belt with a
    polished brass buckle and tan riding breeches with a vivid azure blue stripe down the outer
    seam. Her planted leg rises from the bottom edge of the frame like a tall glossy column, her
    body strongly foreshortened and towering, her other knee lifted high and bent so her boot comes
    straight down. Her face is small and high up beside the raised boot, a small white laminated
    card held against her chest in one bare hand, looking down past her boot into the lens with
    calm, patient satisfaction over gold-framed aviator sunglasses lowered halfway down her nose, a
    small smile. Directly overhead, a wide pale blue sky with two gulls high above. Bright daylight
    from the sky behind her, a rim of light along her hair and the jacket's shoulders, natural
    texture, fine 35 mm film grain, 24 mm lens.
  # Passes (ADR 0052): only her top half, so her LoRA leaves the sole to the underfoot LoRA; a short
  # prompt, as her captions are; a little stronger, because her face is small in this frame.
  passes:
    - find: >-
        the woman's head, shoulders and chest, from the top of her hair down to her duty belt,
        including the hand holding the card
      segment: woman in a green bomber jacket
      loras: ["sorenji_krea2_000001400:1"]
      denoise: 0.5
      subject: >
        An underfoot photo taken lying flat with the camera pointing straight up at the sky. sorenji
        woman in her uniform with a green bomber jacket, with her dusty-pink bob, stands directly
        over the camera, her body foreshortened, her face small and high up beside her raised boot,
        a small white laminated card held against her chest in one bare hand, lowering her aviator
        sunglasses down her nose, looking down over them into the lens with calm, patient
        satisfaction, her berry-pink lips in a small smile. Above her, a wide pale blue sky with two
        gulls high above. Bright daylight from the sky behind her, fine film grain.

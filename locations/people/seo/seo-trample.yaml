# yaml-language-server: $schema=../../../../../schema/v3/location.json
# Event: Deputy Seo tramples you on the floor of her holding cage. Reached by move.to from
# TALK-PROTEST and LOOK-STARE in seo-holding; the arrival costs Body and goes back there.
# Art: the shot from the floor, her raised sole filling the frame, her face beyond it.
id: seo-trample
name: The cage floor
tags: [law, prison]
description: Floor tiles under your back, the church's oak roof beams far above, and the sole of Deputy Seo's boot between you and them.
arrival:
  text: |
    The tiles are cold under your back. Far above, the old oak roof beams of the church cross
    in the dark. Then she is standing over you, a boot either side of your ribs, looking down,
    and the beams are behind her.

    She lifts one foot and holds the sole over your face, close enough that you can see the
    nail heads in the heel and the grit worn into the leather, and leaves it there.

    "This is the minimum," she says.

    She sets it down on your chest and steps up, and then she's standing on you with all of her
    weight, both boots. She walks: chest, stomach, chest again, small careful steps, one hand on
    the cage's chain-link for balance. She stops with a heel on the soft of your stomach and
    grinds a slow quarter turn into it, watching your face.

    Then the sole again, lifted, over your face. This time she lowers it, and rests it on
    your cheek, and lets a little of her weight go into it.

    "Where is the floor, Ankles?"

    You tell her it's under you.

    "Good." She steps off, and goes back to her desk, and writes it down.
  effects:
    - tracker.change: { body: -1 }
    - move.to: seo-holding
art:
  loras: ["undrft_krea2_000001500:1"]
  subject: >
    An undrft underfoot POV photo taken lying flat on the pale tiled floor of a holding cage with
    the camera pointing straight up at the ceiling, as the smooth black leather sole of a
    mirror-polished black leather thigh-high riding boot stomps straight down toward the camera,
    worn and scuffed, grit ground into the leather, its low, flat stacked-leather heel studded with
    small nail heads, large in the upper half of the frame. A Korean woman deputy of twenty-nine
    with a dusty-pink bob to the collar with dark roots, dark eyes and berry-pink lips stands
    directly over the camera, wearing a crisp tan long-sleeved uniform shirt with chest pockets
    piped in vivid azure blue, a vivid azure blue necktie, a polished gold six-point star badge, a
    black leather duty belt with a polished brass buckle and tan riding breeches with a vivid azure
    blue stripe down the outer seam. Her planted leg rises from the bottom edge of the frame like a
    tall glossy column, her body strongly foreshortened and towering, her other knee lifted high and
    bent so her boot comes straight down. Her face is small and high up beside the raised boot, her
    bare hands resting on her duty belt, looking straight down into the lens with calm, pleased
    curiosity and a small smile. Directly overhead, the dark oak roof beams of an old church
    crossing far above in the shadows. Cool fluorescent light from one side, a long highlight down
    the boot's shaft, natural texture, fine 35 mm film grain, 24 mm lens.
  # Passes (ADR 0052): only her top half, so her LoRA leaves the sole to the underfoot LoRA; a short
  # prompt, as her captions are; a little stronger, because her face is small in this frame.
  passes:
    - find: >-
        the woman's head, shoulders and chest, from the top of her hair down to her duty belt
      segment: "woman:1 | boots:2"
      loras: ["sorenji_krea2_000001400:1"]
      denoise: 0.5
      subject: >
        An underfoot photo taken lying flat with the camera pointing straight up at the ceiling.
        sorenji woman in her uniform, with her dusty-pink bob, stands directly over the camera, her
        body foreshortened, her face small and high up beside her raised boot, her bare hands
        resting on her duty belt, looking straight down into the lens with calm, pleased curiosity,
        her berry-pink lips in a small smile. Above her, the dark oak roof beams of an old church
        far above. Cool fluorescent light, fine film grain.

# yaml-language-server: $schema=../../../../../schema/v3/location.json
# Event: beside Deputy Seo's cruiser at the end of the wharf. Reached by move.to from
# TALK-APPROACH at the docks' river view (its result carries her greeting, so nothing replays
# here); out goes back to the river view. Her scenes are still to come; her arrest is seo-arrest.
id: seo-dockside
name: Deputy Seo's cruiser
tags: [law, patrol]
hub: true
description: The open door of a cruiser at the end of the wharf, a notebook on its roof, and Deputy Seo, watching everything at once.
setback_penalty:   # Seo's ground: a setback here with an open record is an arrest
  requires: [wanted]
  effects:
    - move.to: seo-arrest
art:
  loras: ["sorenji_krea2_000001400:1"]
  subject: >
    A waist-up photograph of sorenji woman in her uniform with a green bomber jacket, a deputy
    in her late twenties, standing beside the open driver's door of a white and tan sheriff's
    patrol car on a concrete river wharf, lowering her aviator sunglasses down her nose with one
    finger and looking over them straight into the camera with bright, curious amusement, a
    small black notebook held against her chest in her other hand. Behind her, out of focus, the
    brown river and the rusting red hull of a cargo ship. Bright, hazy late-morning sun from the
    side lights her face. 50 mm lens at eye level, shallow depth of field on her eyes, natural
    colour, fine film grain.

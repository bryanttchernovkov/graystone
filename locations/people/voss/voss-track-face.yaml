# yaml-language-server: $schema=../../../../../schema/v3/location.json
# Beat: one of three fees on the farm track, at random, from DEAL-BEG in voss-cruiser. TALK-THANK ends
# it: cuffs off, back to the turnout, the Record still open. Gains Voss's Tab.
id: voss-track-face
name: A dirt track in the corn
tags: [law]
description: Corn stubble against the back of your head, a very big sky, and a deputy in tan twill standing over your face and checking her lipstick.
arrival:
  text: |
    She has you lie down in the track on your back, on your hands, and she stands over you with one
    boot on either side of your head and a gold compact open in her palm.

    "I've got a personal best to beat, honey, and I've got nobody to practice on." She blots her lips
    on a tissue and drops the tissue on your forehead. "You tap with your foot when you've had enough.
    I might notice."
actions:
  - category: talk
    word: THANK
    cost: 0
    always: true
    prompt: Lie still under her. She's going to sit on your face and time it, and you'll thank her after.
    result:
      text: |
        She lowers herself down onto your face, knees in the dirt, and the sky goes out. Twill, warm and
        tight across your nose and mouth, and all of her weight behind it. You get half a breath of
        laundry soap and sweat and then you don't get any more.

        Her voice comes through her thighs from somewhere up in the daylight. "One Mississippi. Two
        Mississippi."

        She gets to twenty, and lifts an inch. You drag in air with a sob on the end of it, and she
        says "there you go, sugar," and sits. Thirty, that time. A little wiggle to get settled. She
        hums. At thirty-five your heel starts going against the dirt and she says, "Is that a tap? That
        might be a tap," and counts two more before she rises.

        The last one is short, and she spends it grinding her hips side to side while she does her
        lipstick, and you can feel her arms moving. When she gets up you lie there pulling at the air
        with your whole chest, your face wet and printed with twill.

        "Forty-one with a break." She unlocks your cuffs and pats your cheek twice. "Say thank you."

        You say it. It takes two tries. "Your counts are still open, sweet pea. I just didn't feel like
        the paperwork." She drives you back to your car and doesn't let you open the window.
      effects:
        - tracker.change: { body: -1 }
        - card.lose: handcuffs
        - card.gain: voss-tab
        - skill.gain: risk
        - move.to: highway-turnout
art:
  # fcstng's facing pose in the base, the moment before she sits, as the description has it; her LoRA as a pass.
  loras: ["fcstng_krea2_000000500:0.9"]
  subject: >
    A fcstng facesitting POV photo taken lying on a dirt farm track with the camera pointing straight up, as a
    woman lowers herself over the camera, facing the camera, her front toward the lens. She is a poised grown
    woman with a strong mature face, sharp black winged eyeliner, red lips and dark espresso hair in glossy
    rockabilly victory-roll bangs with a cherry-red section, large gold hoops, standing directly over the camera
    with one polished black leather thigh-high riding boot on each side of it, her knees bent and her thighs
    spread wide, rising from the lower corners of the frame. She wears thick opaque tan twill riding breeches,
    the plain front of the breeches large in the center of the frame, a black leather duty belt with a polished
    brass buckle, a tan uniform shirt tucked in, a dark forest-green bomber jacket with a
    polished gold star badge, and a vivid azure blue necktie hanging toward the camera. Her face is
    small and high up in the frame, looking straight down at the camera over a small open gold compact in her
    bare left hand, a glossy red lipstick in her bare right, with cool, pleased attention and one brow up. A few
    dry corn stalks lean in at the edges of a huge pale autumn sky. Low sun behind her rims her hair and
    shoulders. Strong wide-angle foreshortening, natural fabric texture, fine 35 mm film grain, 24 mm lens.
  passes:
    - find: >-
        the woman's head, shoulders, chest and both hands, from the top of her hair down to her duty belt
      segment: "woman:1 | pants:1, boots:2"
      loras: ["mrvx7_krea2_000001200:0.9"]
      denoise: 0.5
      subject: >
        A photo taken lying on a dirt track with the camera pointing straight up. mrvx7 woman in her patrol
        jacket uniform, a grown woman with a strong mature face, sharp black winged eyeliner and red lips, her
        dark espresso hair in glossy rockabilly victory-roll bangs with a cherry-red section, large gold hoops,
        stands directly over the camera, her body foreshortened, her face small and high up in the frame, in a
        tan uniform shirt, a dark forest-green bomber jacket with a polished gold star badge and a vivid azure
        blue necktie. She looks straight down into the lens over a small open gold compact in her bare left
        hand, a glossy red lipstick in her bare right, with cool, pleased attention and one brow up. Overhead, a
        huge pale autumn sky, low sun rimming her hair and shoulders, fine 35 mm film grain.

# yaml-language-server: $schema=../../../../../schema/v3/location.json
# Beat: one of three fees on the farm track, at random, from DEAL-BEG in voss-cruiser. TALK-THANK ends
# it: cuffs off, back to the turnout, the Record still open. Gains Voss's Tab. Her breeches stay up;
# Red's RESPECT in the warehouse is the bare version.
id: voss-track-kiss
name: A dirt track in the corn
tags: [law]
description: Your knees in the dirt, your hands behind you, and the seat of a pair of tan riding breeches a foot from your nose.
arrival:
  text: |
    She walks you round to the front of the cruiser, kneels you down in the dirt with a hand on your
    head, and turns her back. Then she leans forward on her elbows on the white hood, crosses one boot
    behind the other, and looks over her shoulder.

    "Now, I gave you a ticket and I was rude about it," she says. "You've come all this way to say
    you're sorry, and I want to hear it. Pucker up, sweetheart. Left, right, left. You keep the count."
actions:
  - category: talk
    word: THANK
    cost: 0
    always: true
    prompt: Kiss her backside through the twill, as many as she says, and count them out loud.
    result:
      text: |
        You shuffle in on your knees and put your lips to the left side, where the twill stretches
        tight. It's warm from the hood and the sun. "One," you say.

        "Louder, honey, there's a fella on a combine over in the next county."

        "Two."

        "That was the same side." She reaches back without turning her head and pinches your ear hard
        between two nails, and steers you across. "Three's on the right. Three's still two, because you
        got it wrong. So two."

        It goes like that. She has you stop at thirty to apologize for your driving, with your face in
        it, in full sentences, so she can feel your mouth move. She has you do your name and your date of
        birth. She wiggles once, on purpose, and laughs at the noise you make.

        At fifty she straightens up and looks at your mouth. "That's a nice even job." She turns you round by the cuffs and unlocks them, and flicks your ear
        where she pinched it. "Your counts are still open, sweet pea. I just didn't feel like the
        paperwork."

        She drives you back to your car. You thank her again at the door, because she stands there
        until you do.
      effects:
        - tracker.change: { nerve: -1 }
        - card.lose: handcuffs
        - card.gain: voss-tab
        - skill.gain: talk
        - move.to: highway-turnout
art:
  # fcstng's facing-away pose in the base; her LoRA as a pass above the belt. Her back turned but her legs
  # spread like the facing pose read as both (2026-11-06): the backs of her boots, feet close, knees barely
  # bent, and every visible piece of kit named from the back. The hood stays in the prose:
  # looking straight up there's no room for it, and leaning forward hides her head.
  loras: ["fcstng_krea2_000000500:0.9"]
  subject: >
    A fcstng facesitting POV photo taken from down in a dirt farm track with the camera pointing straight up, as
    a woman lowers herself over the camera, facing away from the camera, her back toward the lens. She is a
    poised grown woman with a strong mature face, sharp black winged eyeliner, red lips and dark espresso hair in
    glossy rockabilly victory-roll bangs and a high curled ponytail with a cherry-red section, large gold hoops,
    standing directly over the camera with one polished black leather thigh-high riding boot on each
    side of it, the backs of both boots toward the lens, her feet a little apart and her knees only
    slightly bent, her legs rising from the lower corners of the frame. She wears tight tan twill riding
    breeches, the seat of the breeches large in the center of the frame, the back of a black leather
    duty belt across the small of her back, and the plain back of a dark forest-green bomber jacket
    ending at her waist. Her bare hands rest on her hips. She turns her head back over
    her left shoulder, her face small and high up in the frame, looking down at the camera with sweet, patient
    cruelty, head tilted, a red-lipped smile and one eyebrow up. Directly overhead, a huge pale sky. Low
    late-afternoon sun from the left lights the twill. Strong wide-angle foreshortening, natural fabric texture,
    fine 35 mm film grain, 24 mm lens.
  passes:
    - find: >-
        the woman's head, shoulders and green jacket, from the top of her hair down to her duty belt
      segment: "woman:1 | pants:1, boots:2"
      loras: ["mrvx7_krea2_000001200:0.9"]
      denoise: 0.5
      subject: >
        A photo taken from down on a dirt track with the camera pointing straight up. mrvx7 woman in her patrol
        jacket uniform, a grown woman with a strong mature face, sharp black winged eyeliner and red lips, her
        dark espresso hair in glossy rockabilly victory-roll bangs and a high curled ponytail with a cherry-red
        section, large gold hoops, stands directly over the camera with her back toward the lens, her body
        foreshortened, in a dark forest-green bomber jacket. She turns her head back over her left shoulder, her
        face small and high up in the frame, looking down at the camera with sweet, patient cruelty, head tilted,
        a red-lipped smile and one eyebrow up. Overhead, a huge pale sky, low late-afternoon sun from the left,
        fine 35 mm film grain.

    polishes them on the hem of her apron, and puts them back on to look at you.

    "Good. You can sit still. Most men can't." She leans against the prep table with her
    arms folded. "Back here we do things my way, caro, the same as out front. I tell you
    how. I tell you when. And I tell you when to stop."

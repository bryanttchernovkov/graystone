    prompt: Put Juno's USB key on Miss Carrow's desk and tell them everything. It's betraying him to the police, and you won't leave the office the way you came in.
    result:
      text: |
        You put it on the green leather. Teal plastic, a cat sticker. Neither of them touches it
        while you talk: his apartment, his desk drawer, any desk in the bullpen, they never lock
        their screens.

        When you've finished, Harker gets up out of the window seat, picks up the key with a
        tissue and drops it into an evidence bag from her coat pocket. She makes one phone call,
        about ten words long, and stubs out her cigarette.

        "Watch," Miss Carrow says. She turns the hard chair by the door to face the window, and you
        sit in it.

        Down in the reading room Harker walks straight down the middle of it, between the long
        tables, her boots loud on the oak. Juno has his headphones on. He doesn't see her until
        she closes the laptop on his fingers. She says something you can't hear, and he laughs at
        it, and she takes him by the wrist and turns him and bends him over his own table among the
        stickers. The cuffs are on in two clicks. The retirees at the newspaper rack watch all of
        it.

        At the door he looks back and up, at the window, and finds you in it. He doesn't say
        anything.

        Harker is back in forty minutes. She hangs her coat on the hook and takes something small
        out of its pocket, and holds it up for you to see: polished steel, in the palm of her hand.

        "Miss Vance has one of these on now." She puts the cigarettes on the desk. "Men who carry
        other people's crimes around in their pockets get one too. Trousers, please."

        It's cold, and it locks with a sound like a desk drawer. The key goes on a chain round her
        neck, inside her shirt.

        "Now," Miss Carrow says. "Back in your chair, young man."

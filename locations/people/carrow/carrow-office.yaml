# Event: Miss Carrow's office, off the library's upstairs gallery. Reached by move.to from TALK-ALONE
# at her desk (confidant); out goes back to the reading room. Detective Elise Harker is always here.
# SIT is the introduction, once (confidant, unless conspirator): tea, cigarettes and the plan to
# catch Juno, and Tea Upstairs (conspirator), which opens the rest. ASHTRAY and WORSHIP are hers;
# TELL (rootkit: Juno's USB key, kept instead of planted) betrays him: The Third Chair (cucked,
# juno-arrested) and the Chastity Cage (caged), then the watching beat. BEND is Elise's strap-on,
# only while he's caged and has watched.
id: carrow-office
name: Miss Carrow's office
hub: true
description: A small, warm office under the library dome, a walnut desk with a green leather top, a window seat over the reading room, and two women smoking where smoking isn't allowed.
arrival:
  text: |
    The office smells of furniture polish and cigarettes. An inside window looks down over the
    whole reading room, the long tables and the green lamps and the corner by the arched window,
    and somebody has propped it open an inch to let the smoke out.

    In the window seat a woman in a long gray pinstriped coat sits with her boots up on the
    cushion and a cigarette in her fingers. Her hair is split down the middle, black on one side
    and platinum white on the other. She looks at you through the smoke, and then back down at
    the room.

    Miss Carrow sits down behind the desk and crosses her legs. There's a hard wooden chair by the
    door. Nobody offers you another.
actions:
  - category: talk
    word: SIT
    cost: 2
    requires: [confidant]
    unless: [conspirator]
    prompt: Take tea with Miss Carrow and her friend. They'll talk about Juno, and while they smoke you'll kneel between them and hold their ash.
    result:
      text: |
        "Elise," Miss Carrow says, "this is the IT man."

        "Detective Harker. Graystone County." The woman in the window seat doesn't get up. "I know.
        He's on a card in the V drawer."

        Miss Carrow pours. Two cups. She points with the spout at the rug between her chair and
        the window seat, and you kneel there. She takes your hands, turns them over in your lap,
        palms up, and puts them together. "Hold them like that. Still."

        Then they talk over your head. They talk about the weather and the board of trustees and a
        woman at the bank, and every so often one of them leans down and taps a cigarette over
        your cupped hands. The ash is light and dry, and then a coal comes down with it and you
        hold still while it goes out on your skin.

        "Miss Vance," Miss Carrow says, "has been reading everybody's post in my library since
        March."

        "He's in the water board," Harker says. "The school buses. The Mayor's thermostat. I can't
        prove any of it, because he's better at this than anybody the county can afford." She
        draws on the cigarette and lets the smoke out through her nose. "The department's network is the one
        thing in town he can't reach. He has to get somebody to carry it in."

        She looks down at you for the first time.

        "When he asks somebody, I'd like that somebody to come up here first. I want him in cuffs.
        I want him in a cage." She taps ash into your palm. "For the fun of it, mostly."

        Miss Carrow takes the cups away, and then, without asking, your hands. She tips the ash off
        them into a cut-glass dish on her desk and wipes your palms with her handkerchief, one finger
        at a time.

        "Thursdays," she says. "Knock once."
      effects:
        - tracker.change: { nerve: -1 }
        - skill.gain: talk
        - card.gain: tea-upstairs
      art:
        loras: ["pvsmk7_krea2_000001250:0.9"]
        subject: >
          pvsmk7 smoking POV photo, a worm's-eye view looking straight up from below her chest at a
          woman in her mid thirties with long hair split down the middle, black on one side and
          platinum white on the other, straight-cut bangs, smoky dark eyeliner and burgundy lipstick,
          wearing a long gray pinstriped coat over a white shirt buttoned to the collar, a black tie
          and a black underbust corset. She holds her lit cigarette out over the camera and taps it,
          flakes of ash falling toward the lens. She looks down into the camera with a calm, level
          stare, her lips closed. Set in a small lamplit office with dark walnut paneling and a
          green-shaded brass lamp, warm lamplight and soft daylight from a window behind her.
        passes:
          - find: >-
              the woman's head, hair and shoulders, from the top of her hair down to her tie
            segment: "woman:1 | hand:2"
            loras: ["vqntz7_krea2_000001200:1"]
            denoise: 0.5
            pad: 32
            subject: >
              A low-angle photograph looking up at vqntz7 woman in her detective suit, her long hair
              split down the middle, black on one side and platinum white on the other, looking down
              into the camera with a calm, level stare, her lips closed. Warm lamplight, walnut
              paneling behind her, fine film grain.
  - category: deal
    word: ASHTRAY
    cost: 2
    requires: [conspirator]
    prompt: Kneel by Miss Carrow's chair and take her ash on your tongue while she smokes. It's degrading, and that's what she wants it for.
    result:
      text: |
        She lights it with a brass lighter and lets you watch her do it. "Mouth open, young man.
        Tongue out. Further. That's it. Keep it there."

        She smokes it all the way down. She doesn't hurry, and she doesn't look at you between drags.
        She reads a letter from the trustees and makes notes in the margin, and when the ash gets
        long she holds the cigarette out over your face and taps it, once, and goes back to the
        letter. It lands dry and warm, and your mouth fills with the taste of it, bitter and grey.
        You don't swallow. She hasn't said you can.

        Harker watches from the window seat. "He drools."

        "They all drool, darling. It's a reflex." Miss Carrow puts the end out on your tongue with

    word: WORSHIP
    cost: 2
    requires: [conspirator]
    prompt: Worship Miss Carrow's feet, in her stockings and out of her heels, on your knees under her desk. Detective Harker watches.
    result:
      text: |
        "Under the desk."

        It's dark under there and it smells of polish and leather. Her legs are crossed, and the
        top foot hangs in front of your face in a black patent pump with a heel as thin as a pencil.
        Her stockings have a seam up the back.

        "Take it off. With your hands, young man, not your teeth. We aren't animals."

        You ease the shoe off her heel and hold it while she flexes her toes inside the nylon,
        one at a time. Her foot is warm and a little damp from a day of standing. You kiss
        the arch, and the ball of her foot, and each toe through the sheer black, and she goes on
        with her letter above you, and every so often she presses the sole flat to your face and
        holds it there and lets you breathe her through the stocking.

        "Now the shoe," she says. "Inside, where I stand on it."

        The insole is warm leather printed with the shape of her foot. You lick it clean from the
        heel to the toe, and then the heel itself, its whole length to the metal tip, while she
        tells Harker about a man who tried to return a library book through the post.

        Harker's boots come across the room. She crouches at the edge of the desk with a cigarette in
        her mouth and watches. "He's very thorough."

        "He's a volunteer," Miss Carrow says. "I trained him."

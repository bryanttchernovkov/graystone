# yaml-language-server: $schema=../../../../../schema/v3/location.json
# Event: at Miss Carrow's circulation desk in the Carnegie library. Reached by move.to from
# TALK-APPROACH in the reading room (its result carries her greeting, so nothing replays here);
# out goes back to the reading room. Ordinary library business for now; her methods as a
# disciplinarian come with her storyline. TAKE-DRAWER is Juno's errand (charmed).
# Her own chain: INQUIRE gives Miss Carrow's Notice (noted) once; RECOMMEND and VOLUNTEER are good
# conduct (`proper`) and fill it; full, it is her Confidence (confidant), which opens TALK-ALONE:
# her office upstairs (carrow-office).
id: library-desk
name: The circulation desk
hub: true
description: A curved oak desk, a brass bell nobody rings twice, and Miss Carrow behind it, waiting for you to get to the point.
actions:
  - category: talk
    word: RECOMMEND
    cost: 1
    tags: [proper]
    prompt: Ask her to recommend a book. She chooses one for you, and she doesn't ask what you like.
    result:
      text: |
        She looks you over for a while, as she would a shelf someone put back wrong. Then she
        gets up and walks into the stacks, her heels clicking on the oak boards, one sharp step
        at a time, all the way round the room and all the way back. She doesn't look at the
        spines. She comes back with a thin green hardback.

        "Trollope. *The Warden*. A man who means well and finds it isn't enough." She stamps the
        card inside the cover, once, hard. "Fourteen days. I'll ask you about it when you bring
        it back. Have answers."
      effects:
        - skill.gain: look
        - boost.change: { card: carrows-notice, amount: +1 }
  - category: work
    word: VOLUNTEER
    cost: 2
    tags: [proper]
    prompt: Volunteer for the book sale. She has boxes of donations in the back, and standards.
    result:
      text: |
        The back room is boxes to the ceiling: paperbacks, encyclopedias, a hundred copies of
        the same diet book. She shows you the system once. Fiction by author, nonfiction by
        number, anything with a broken spine to the left, anything with a pressed flower in it
        to her.

        She comes in every twenty minutes. The second time, she takes a book out of your hands
        and turns it the right way up, and holds it there until you take it back. "Spine in
        your palm, young man. You hold a book the way you'd want to be held." By the end of the
        afternoon you're doing it without thinking, and she has stopped coming in.
      effects:
        - skill.gain: work
        - boost.change: { card: carrows-notice, amount: +1 }
  - category: look
    word: INQUIRE
    cost: 1
    unless: [noted, confidant]
    prompt: Ask her about the true crime somebody keeps shelving with the gardening books.
    result:
      text: |
        "Miss Vance." She leans on the *Miss*, and doesn't look toward the computer corner. "Since
        March. One book a day, before lunch, always from the same shelf. He thinks I haven't
        noticed."

        She writes something on an index card in very small letters and files it in the drawer
        under the desk. You catch the drawer's label as it closes: a single letter, V, and the
        drawer is full.

        Then she takes a fresh card, looks at you over it, and writes on that one too. It goes in
        a different drawer.

        "I notice everything in this room," she says. "It's my room. Is there anything else?"
      effects:
        - skill.gain: look
        - card.gain: carrows-notice
  # Juno's errand (charmed): the V drawer. Tag pilfer, so a setback is Juno's Good Side's penalty:
  # carrow-caught, where she hands it over anyway.
  - category: take
    word: DRAWER
    cost: 3
    tags: [pilfer]
    requires: [charmed]
    unless: [file]
    prompt: When she goes into the stacks, take the card drawer with the V on it. It's stealing from Miss Carrow, and she notices everything in this room.
    result:
      text: |
        She gets up with a returned book and walks it into the stacks. You count the heels on
        the oak boards, going away round the curve of the room, and when they're far enough
        you're round the end of the desk.

        The drawer under the desk has a brass label with one letter in it, and it's heavier
        than it looks. It comes out on its runners with a long wooden hiss. You put it under your jacket, under
        your arm, and walk, not fast, toward the computer corner.

        Behind you, a long way off in the stacks, the heels stop.

        Then they start again.
      effects:
        - card.gain: carrows-v-file
  # Her Confidence (confidant): her office upstairs, where Detective Harker waits.
  - category: talk
    word: ALONE
    cost: 1
    requires: [confidant]
    prompt: Ask Miss Carrow for a word in private. She takes you up to her office, and she isn't alone up there.
    result:
      text: |
        She finishes the card she's writing before she looks up. Then she caps the pen, stands,
        and turns the little brass sign on the desk round so it reads BACK IN TEN MINUTES.

        "Upstairs."

        The spiral stair is cast iron and it rings under her heels, every step, all the way up to
        the gallery. You follow two steps behind, with your eyes on the stair. At the end of the
        gallery there's an oak door with frosted glass in it and no name on the glass. She opens
        it, waits for you to go through, and shuts it behind you.
      effects:
        - move.to: carrow-office
art:
  loras: ["imcrw7_krea2_000001200:1"]
  subject: >
    A waist-up photograph of imcrw7 woman in her gray skirt suit, the fitted charcoal jacket
    buttoned once at the waist over a cream silk blouse open at the collar, her throat bare, no
    tie, a slim gold watch on her left wrist, sitting upright behind a curved dark oak library
    circulation desk with a polished brass bell on it, a capped black fountain pen held upright
    beside her chin in her right hand, her left hand flat on a small stack of index cards. She
    looks straight into the camera with cool, polite severity, one brow raised a fraction and
    her lips closed in a small, patient line. The camera stands at eye height an arm's length
    away across the desk, the dark oak desktop running across the bottom of the frame. Behind
    her, a tall dark oak card catalogue of many small brass-handled drawers and the curve of a
    bookcase of faded cloth-bound books. A green-shaded brass lamp on the desk at the left
    lights her face warmly from the side, with soft daylight from a skylight above. 50 mm lens,
    natural colour, fine film grain, shallow depth of field on her eyes.

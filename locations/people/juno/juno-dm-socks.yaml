# yaml-language-server: $schema=../../../../../schema/v3/location.json
# Beat: a photo from Juno Vance, bought with SIMP on Subscribed: @rootkitty or Rootkitty's
# Simp, from anywhere. Reached by move.to (random) from that card action; move.back returns
# you to wherever you were, without its arrival (ADR 0043 in the engine repo).
id: juno-dm-socks
name: A photo from @rootkitty
description: The soles of his socks, right up at the camera.
arrival:
  text: |
    The phone buzzes. A photo from his bed: his feet, right up at the camera, the soles of his
    white socks gone gray with a day's wear, toes curled toward the lens. Behind them, small and
    far away, his face, smirking.

    *been in these since 8am*

    *library. bus. gym. library again*

    *u wish u could smell them. u can't. that's the whole point. that's what u paid for*

    You zoom in.
  effects:
    - tracker.change: { body: +1 }
    - move.back
art:
  loras: ["jovessa_krea2_000001200:1"]
  subject: >
    Overhead photograph looking straight down at a scuffed dark walnut tabletop, the camera
    directly above it. The wood grain fills the whole frame from edge to edge around a black
    smartphone lying flat on the table in landscape orientation, the phone filling the middle
    two-thirds of the frame, with the rim of a white coffee cup at the top left corner of the
    frame and a set of house keys at the top right. A pale man's bare hand with broad knuckles
    and short, bare, unpainted nails cut straight across rests on the wood at the bottom right
    corner of the frame, one fingertip touching the phone's edge. Its wide, bright landscape
    screen shows, edge to edge, a horizontal photograph taken in a young woman's small bedroom,
    the whole photograph contained inside the phone's black bezel: a photograph taken from the
    foot of her bed of jovessa woman in her usual black outfit, wearing her black rectangular
    glasses and a black ring choker, lying back on it propped on her elbows, her legs in black
    joggers stretched out straight toward her camera with her ankles pressed together, so that
    the soles of her feet in plain white cotton ankle socks fill the front of the photograph,
    big and close, toes curled toward the lens, the cotton worn gray at the heels and the balls
    of her feet. Between and above her feet, smaller and farther back, her face looks over her
    toes at her camera with a lazy, superior smirk, eyes half-lidded behind her glasses, one
    brow raised. Behind her, out of focus, a pale wall with pastel posters, a strip of teal LED
    light along the ceiling and black and teal pillows with plush toys. The screen glows bright
    against the dark wood, the photograph on it crisp. Natural texture, fine 35 mm film grain,
    focus on the phone screen.

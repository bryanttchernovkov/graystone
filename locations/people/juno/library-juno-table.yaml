# yaml-language-server: $schema=../../../../../schema/v3/location.json
# Event: at Juno Vance's corner table in the library. Reached by move.to from TALK-APPROACH in
# the computer corner (its result carries her greeting, so nothing replays here); out goes back
# to the computer corner. Her scenes here are still to come; a later one takes you home with her
# (juno-apartment-*), from here only.
id: library-juno-table
name: Juno's table
hub: true
description: A small round oak table in the corner, a laptop covered in stickers, an energy drink, and Juno Vance with one sneaker up on the other chair.
actions:
  - category: talk
    word: ASK
    cost: 1
    prompt: Ask what she's working on. She turns the laptop round and shows you.
    result:
      text: |
        "Homework." She turns the laptop round. It's a list: library card numbers, down the left,
        and next to each one the last thing that card looked at on the public computers. She
        scrolls. It goes on for a while. Some of the lines are highlighted teal.

        "Teal ones are my subscribers." She turns it back. "Everybody who sits at those computers
        ends up on my page eventually, dude. It's like gravity." She writes something on a
        sticky note, peels it off and sticks it to the back of your hand: *@rootkitty*, and a
        little drawing of a cat.

        "Twenty bucks a month. Or don't, and keep pretending you're not curious." She puts her
        headphones back on. "Either way you're gonna look."
      effects:
        - skill.gain: talk
art:
  loras: ["jovessa_krea2_000001200:1"]
  subject: >
    A photograph of jovessa woman in her usual black outfit, a woman of twenty-three wearing her
    black rectangular glasses and a black ring choker, sitting sideways in a wooden library
    chair at a small round oak table in the corner of an old Carnegie library reading room, one
    black-and-white canvas sneaker propped up on the seat of the empty chair beside her, framed
    from her knees to just above her head. She leans on the table on one forearm and holds a
    slim, plain silver energy drink can to her lips, looking straight into the camera with
    bored, teasing confidence, eyes half-lidded behind her glasses, one brow raised and a small
    smirk around the rim of the can. Beside her elbow stands a plain black laptop, the back of
    its lid covered edge to edge in small, colorful vinyl stickers of cartoon cats, stars,
    hearts and lightning bolts, none of them with any lettering, open, its screen facing her and
    its stickered lid toward the lens. The camera sits at seated eye height across the table.
    Behind her, a tall arched window with small clear leaded panes and the curve of a dark oak
    bookcase full of faded cloth-bound books. Soft afternoon daylight from the window rims her
    hair and shoulders, and a green-shaded brass lamp on the table lights her face warmly from
    the side. 35 mm lens, natural colour, fine film grain, shallow depth of field on her eyes.

  - category: deal
    word: INHALE
    cost: 1
    always: true
    requires: [boots]
    tags: [tribute]
    prompt: Ask for her boot, at the end of her shift. She pulls it off and holds it over your face while she does her paperwork.
    result:
      text: |
        "Deputy. Your boot. Please."

        "Ugh. Fine. I've been in them eleven hours." She pushes back from the desk, hooks the
        heel of one boot on the edge of the drawer and works it off, and the other foot helps,
        and the boot comes free with a sigh of air. Her foot in its thin black knee sock goes
        straight up onto the desk, flexing.

        She unlocks the cage and comes in with the boot held upside down by the heel, and
        lowers it over your face, open end first, until the top of the shaft sits on your
        cheekbones and your nose is inside.

        "Hold it there. Both hands. You've got one free, use the cuffed one too. Breathe."

        You breathe. Eleven hours of her: hot leather, sweat gone sour-sweet in the lining,
        foot powder, a salt you can taste. The cage door stays open. She sits back down and
        does your paperwork with her sock up on the desk, and every so often says "louder" and
        you breathe louder, and the deputies at the next desk don't even look anymore.

        When the form is done she takes the boot off your face and looks at you.

        "Look at you. All pink." She pulls it back on. "Say thank you for my boot."

        You say it.

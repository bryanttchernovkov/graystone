  - category: talk
    word: ANSWER
    cost: 1
    unless: [gagged]
    prompt: Answer her booking questions. She writes down her own answers, and you read them back to the room.
    result:
      text: |
        "Occupation."

        You tell her. She writes something shorter.

        "Height." She doesn't ask; she looks at you through the chain-link and writes a number
        and rounds it down. "Distinguishing marks. None. Distinguishing features." She thinks
        about it. "None."

        "Reason for arrest." She writes for a long time.

        Then she gets up, unlocks the cage, and holds the form in front of your face. "Read it.
        Out loud. Stand up as far as the cuff lets you, so the back row can hear."

        You read it. It's a paragraph about you. It has the word "sad" in it three times and
        "pathetic" once, and a line about the way you sat in the back of her car, knees
        together, like a man waiting to be picked last. Two deputies at the far desks stop typing to listen. One of them claps.

        "Sign it." You sign it. "Now say 'that's accurate, Deputy.'"

        "That's accurate, Deputy."

        "It is, isn't it," she says, delighted, and files it.

    colored light, and the dark oak beams of the roof. Daylight through the stained glass
    falls in long colored shafts across the desks, with cool fluorescent light over her desk
    lighting her face. Restrained palette of pale limestone, uniform tan, vivid azure blue,
    galvanized steel gray, platinum blonde and stained-glass red and gold; natural skin
    texture, fine 35 mm film grain, focus on her eyes.

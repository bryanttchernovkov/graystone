    overcast late-morning light from a high gray sky lights her face evenly, with red and
    blue glints from the light bar in her blonde hair and on the chrome handcuffs.
    Restrained palette of forest green, tan, vivid azure blue, polished steel, platinum
    blonde and maple orange; natural skin texture, fine 35 mm film grain, focus on her eyes
    and the dangling handcuffs.

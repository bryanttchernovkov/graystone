    First-person point-of-view widescreen photograph from standing eye height on the asphalt
    of a quiet residential street in a small Midwest town in autumn, the camera level, with
    a parked sheriff's patrol car behind the woman, seen side-on. One woman stands at arm's
    length in the center of the frame, framed from mid-thigh up, the tops of her boots at
    the bottom edge, the patrol car's open driver's door behind her left shoulder. She looks
    directly into the camera, making eye contact with the viewer, with sharp, mocking
    impatience: green eyes narrowed, one dark brow arched, berry lips curled in a cold
    smirk. She is a white American woman of twenty-four, slim and toned with a full bust and
    long legs, fair skin, long wavy platinum-blonde hair with bold jet-black streak
    highlights falling past her shoulders, dark elegant makeup with smoky black eyeliner,
    long dark lashes and deep berry lipstick, striking bright green eyes, arched dark brows,
    and long almond-shaped nails painted glossy black. She wears the Graystone County
    Sheriff's patrol uniform: a dark forest-green bomber jacket of smooth nylon twill with
    ribbed knit cuffs, collar band and waistband, zipped up to the middle of her chest, worn
    with both arms in its sleeves and both shoulders covered, a single polished gold
    six-point star badge pinned on its left chest and an embroidered vivid azure blue and
    gold patch on each upper sleeve; above the zipper, the pointed collar of a crisp,
    pressed tan uniform shirt and the knot of a vivid, saturated azure blue necktie with a
    small gold tie bar; a black leather duty belt with a polished brass buckle at her waist
    below the jacket's hem; tan riding breeches with a vivid azure blue stripe down the
    outer seam; and stiff, structured, mirror-polished black leather thigh-high riding boots
    with rigid straight shafts and low, flat stacked-leather riding heels, fitted tight to
    the leg, pulled up over the breeches to mid-thigh. Her head is bare, her long hair loose
    over the jacket's shoulders, and her hands are bare. Her bare right hand comes out of
    the green bomber sleeve, raised to the height of her chest, a pair of chrome clejuso
    handcuffs dangling from her grip; her bare left hand comes out of the other green bomber
    sleeve, raised beside her face, one glossy black-nailed index finger pointed straight at

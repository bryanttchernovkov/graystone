# yaml-language-server: $schema=../../../schema/v3/location.json
# Event: at Niamh Doyle's front desk in the narthex. Reached by move.to from TALK-APPROACH in the
# narthex (its result carries her greeting, so nothing replays here); out goes back to the
# narthex. DEAL-SIGN, with a contractor badge (tag contractor) and no record, signs you through to
# the bullpen: the only way into the back of the station. Her scenes are still to come.
id: station-desk
name: The front desk
tags: [law]
hub: true
description: A long oak counter, a sign-in book with a pen on a chain, and Niamh, waiting for you to say something worth her time.
actions:
  - category: deal
    word: SIGN
    cost: 1
    always: true
    requires: [contractor]
    unless: [wanted]
    prompt: Show her your contractor badge and sign in. She'll buzz you through to the back.
    result:
      text: |
        She takes the badge between two red nails, holds it up next to your face, and looks from
        one to the other, twice.

        "Better looking in person. That's rare." She turns the sign-in book round and holds out
        the pen on its chain. "Name, time in, who you're seeing. If you don't know who you're
        seeing, write 'Niamh' and I'll sort it."

        You sign. She presses something under the counter and the half-door beside the desk
        clicks open.

        "Through you go, love. Bullpen's straight ahead, kettle's on the left, and the Sheriff's
        up the stairs if she wants you, which she'll let you know." She smiles. "Don't wander."
      effects:
        - move.to: station-bullpen
  - category: talk
    word: ASK
    cost: 1
    prompt: Ask her what it takes to get past her desk.
    result:
      text: |
        "Oh, lots of ways." She counts them off on her fingers. "A badge with the county's name
        on it. A deputy's hand on your elbow. A pair of handcuffs, which is the same thing
        with less conversation." She lowers her voice, and leans in to do it. "Or me, liking
        you. That's the hardest one."

        She sits back. "Nobody's managed it yet, so don't feel bad."
      effects:
        - skill.gain: talk
art:
  loras: ["nivdoyle_krea2_000001200:1"]
  subject: >
    A waist-up photograph of nivdoyle woman in her uniform, a woman of twenty-seven, seated
    behind a long reception counter of dark polished oak in the narthex of an old deconsecrated
    limestone church converted into a sheriff's station, leaning forward on her forearms with
    her hands folded beside an open sign-in book and a pen on a small brass chain, looking
    straight into the camera with warm, teasing interest and a playful half-smile, one brow
    raised. The camera stands at eye level an arm's length away across the counter. Behind her,
    a wall of pale limestone blocks with a brass key cabinet and a corkboard of pinned papers. A
    brass desk lamp at the left lights her face warmly from the side, with cool daylight from
    the church doors behind the camera. 50 mm lens, natural colour, fine film grain, shallow
    depth of field on her eyes.

# yaml-language-server: $schema=../../../schema/v2/location.json
# The First Church station, the back: the old sacristy, now the kitchenette, with the restroom
# door at the back. West back to the bullpen. DEAL-GREET (her paypig only): Deputy Anderson on
# her coffee break.
id: station-kitchen
name: The kitchenette
tags: [law]
hub: true
description: "The old sacristy: a kettle, a coffee machine, a fridge covered in rotas, and a restroom door with a hand-lettered sign about the seat."
actions:
  # Anderson on her coffee break, for her paypig only (requires owned). Her reaction is a
  # three-way coin flip (beats on the anderson map); each ends with her hand out for $10.
  - category: deal
    word: GREET
    cost: 1
    requires: [owned]
    tags: [tribute]
    prompt: Deputy Anderson is leaning on the counter by the coffee machine. She's seen you. Say hello.
    result:
      text: |
        She's in the indoor uniform, the tan shirt and the tie and the boots, her hip against
        the counter and a mug in her hand, waiting for the machine. She watches you come in the
        whole way and doesn't straighten up.

        "Oh my God." Slow, delighted. "Babe. They let you indoors?"

        She doesn't ask what you're doing here. She doesn't care what you're doing here. She
        puts the mug down.
      effects:
        - move.to: { random: [anderson-kitchen-sharpie, anderson-kitchen-spit, anderson-kitchen-boot] }
      art:
        loras: ["DGirlsModel14:1"]
        subject: >
          First-person point-of-view widescreen photograph from standing eye height in a
          small staff kitchenette that was once a church sacristy, the camera level. Two
          paces away, one woman leans back with her hip against a short laminate counter
          beside a large coffee machine, framed from mid-thigh to just above her head, a
          white mug in her right hand. She looks directly into the camera, making eye
          contact with the viewer, with slow, delighted contempt: green eyes widened in
          mock surprise, one dark brow arched high, berry lips parted in a mocking grin.
          She is a white American woman of twenty-four, slim and toned with a full bust
          and long legs, fair skin, long wavy platinum-blonde hair with bold jet-black
          streak highlights falling past her shoulders, dark elegant makeup with smoky
          black eyeliner, long dark lashes and deep berry lipstick, striking bright green
          eyes, arched dark brows, and long almond-shaped nails painted glossy black. She
          wears the Graystone County Sheriff's uniform: a crisp, pressed tan long-sleeved
          uniform shirt of heavy cotton twill with a pointed collar, a full button-front
          placket, two buttoned flap chest pockets piped in vivid azure blue, shoulder
          epaulets edged in vivid azure blue, an embroidered vivid azure blue and gold
          patch on each upper sleeve and a polished gold six-point star badge pinned over
          the left pocket; a vivid, saturated azure blue necktie with a small gold tie
          bar; tan riding breeches, the same khaki tan as her shirt, with a vivid azure
          blue stripe down the outer seam; a black leather duty belt with a polished brass
          buckle; and the tops of stiff, mirror-polished black leather thigh-high riding
          boots at the bottom edge of the frame; her head is bare and her hands are bare.
          Directly behind her, close and filling the background, a white refrigerator door
          crowded with pinned shift rotas, takeout menus, magnets and a wall calendar, and
          beside it on the pale limestone wall a wooden rack of mismatched mugs. A warm
          overhead light lights her face from above. Restrained palette of pale limestone,
          white appliances, uniform tan, vivid azure blue, platinum blonde and coffee
          brown; natural skin texture, fine 35 mm film grain, shallow depth of field on
          her eyes.
  - category: take
    word: COFFEE
    cost: 1
    prompt: Pour yourself a cup of the department's coffee.
    result:
      text: |
        The machine makes coffee the color of the river and about as strong. The mugs on the
        rack all say something: WORLD'S OKAYEST DEPUTY, I'D AGREE WITH YOU BUT THEN WE'D BOTH BE
        WRONG, a plain white one that has *visitor* written on it in red marker. You take that
        one.

        It's terrible. You drink all of it.
      effects:
        - tracker.change: { nerve: +1 }
  - category: look
    word: READ
    cost: 1
    prompt: Read the rotas and notes stuck to the fridge.
    result:
      text: |
        Shift rotas, the Undercroft roster in block capitals, a takeout menu, a birthday card for
        somebody called Dee. A typed notice from the Sheriff about the gym's opening hours,
        signed with a little heart. A handwritten one from Niamh about the gym's opening hours,
        signed with a much bigger one.

        Halfway down, on lined paper: *Restroom seat DOWN. This means you.* Somebody has added,
        in a different pen: *there's only ever one of him in here at a time, Niamh, it's always
        the same guy.* Someone else has added a smiley face.
      effects:
        - skill.gain: look
art:
  subject: >
    Eye-level widescreen photograph from standing height in the doorway of a small room that
    was once a church sacristy and is now a staff kitchenette, the camera level. The walls are
    smooth dressed limestone ashlar blocks laid in straight courses with thin mortar joints
    under a low whitewashed vault, with a single tall narrow pointed window of clear leaded
    glass on the far wall. Along the left wall runs a short laminate counter with a stainless
    steel sink, an electric kettle, a large coffee machine with a glass pot half full, and a
    wooden mug rack of mismatched mugs; at the end, a white refrigerator covered in pinned
    papers, magnets and a calendar. On the right, an old carved oak vestment cabinet now holds
    paper towels and boxes of tea, and beyond it in the far right corner a narrow painted door
    stands closed with a hand-lettered paper sign taped to it. A small round table with two
    chairs sits under the window. The room is empty and tidy. Soft daylight from the narrow
    window and a warm overhead light. Restrained palette of pale limestone, white appliances,
    carved dark oak and coffee brown; natural texture, fine 35 mm film grain, deep focus.

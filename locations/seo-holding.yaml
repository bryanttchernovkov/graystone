  loras: ["DGirlsModel9:1"]
  subject: >
    Eye-level widescreen photograph from standing eye height inside a chain-link holding cage,
    the camera level, looking out through the cage's open door. One woman stands upright in the
    open doorway an arm's length away, framed from her waist to just above her head, leaning one
    shoulder against the galvanized steel door post at the right of the frame, a brown paper
    property bag folded and stapled shut held up beside her face in her right hand, a small
    black notebook tucked in her breast pocket. She looks directly into the camera, making eye
    contact with the viewer, with calm, pleased patience: dark eyes steady, delicate brows
    lifted, berry-pink lips in a small smile. She is a Korean woman of twenty-nine, a classic
    Korean beauty with an elegant oval face, a softly tapered jaw, large almond-shaped dark
    brown eyes, sharp black winged eyeliner, delicate straight brows, a refined small nose,
    softly defined cheekbones, berry-pink gradient lips and luminous, smooth pale skin, her
    extremely long, glossy, vivid neon violet-purple hair woven into one enormous high French

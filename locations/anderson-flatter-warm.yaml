# yaml-language-server: $schema=../../../schema/v3/location.json
# Beat: Deputy Anderson likes your compliment, against her better judgment. Reached by
# move.to (random) from TALK-FLATTER at her cruiser; sends you straight back to her window.
id: anderson-flatter-warm
name: Deputy Anderson's cruiser
tags: [law, patrol]
description: She checks herself in the mirror.
arrival:
  text: |
    "Obviously," she says. But she tilts the side mirror and checks herself in it, the tie,
    the hair, and a corner of her mouth goes up before she can stop it.

    "Say the boots part again."

    You say the boots part again.

    "Mm. Better. You're still a nothing, babe, but you're a nothing with taste." She swings
    one leg up so the boot rests on the dash, where you can see it through the windshield,
    and leaves it there. "You can look. You can't touch. You definitely can't afford it."
  effects:
    - boost.change: { card: andersons-attention, amount: +1 }
    - move.to: anderson-patrol-car
art:
  loras: ["tfny7_krea2_000000800:1"]
  subject: >
    Widescreen photograph from standing eye height at the open driver's window of a parked
    sheriff's patrol car, the camera level and one pace away, looking in at the driver's seat
    from the side. tfny7 woman in her tfny7 uniform with a green bomber jacket, alone, leans
    back in the driver's seat against the headrest at the right of the frame, her head turned
    toward the lens. Her right leg is stretched forward and up toward the left of the frame,
    seen side on from hip to toe, the low flat heel of her boot resting on top of the dashboard
    in front of the windshield: a stiff, mirror-polished black leather thigh-high riding boot
    with a rounded toe, its top at mid-thigh over tan riding breeches with a vivid azure blue
    stripe down the outer seam. Her bare left hand rests on her raised thigh just above the boot
    top. She looks at the lens, making eye contact with the viewer, with pleased, teasing
    smugness: green eyes bright, one dark brow arched, berry lips curled in a satisfied half
    smile. Through the windshield, out of focus, orange maples along a quiet street. Soft
    overcast daylight lays one long highlight down the boot shaft. Restrained palette of black
    leather, tan, vivid azure blue, forest green, platinum blonde and maple orange; natural
    leather and skin texture, fine 35 mm film grain, focus on the boot and her eyes.

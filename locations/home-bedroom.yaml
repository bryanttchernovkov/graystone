# yaml-language-server: $schema=../../../schema/v3/location.json
id: home-bedroom
name: Bedroom
tags: []
description: A small room under the eaves, the bed made tight, nothing on the floor.
actions:
  - category: look
    word: REST
    cost: 0
    always: true
    prompt: Lie down on the made bed for an hour.
    result:
      text: |
        You lie on top of the duvet with your feet hanging off the end and look at the slope of
        the ceiling. Somewhere outside a leaf blower starts and stops. An hour goes by.
      effects:
        - tracker.change: { time: -1, body: +2 }
  - category: look
    word: SCRUB
    cost: 1
    requires: [marked]
    prompt: Scrub your forehead at the bathroom sink until it comes off, then lie down until the skin stops stinging.
    result:
      text: |
        Soap does nothing. Shampoo does a little. In the end it's the nail-polish remover from
        under the sink, a whole wad of cotton pads and most of an hour, scrubbing at it in the
        mirror while it gets fainter and pinker and won't quite go.

        You lie on the bed with a cold washcloth over your forehead until it stops stinging.
        When you look again there's only a pink patch, and if you tilt your head, the ghost of
        a curly tail.
      effects:
        - card.lose: paypig-sharpie
        - tracker.change: { time: -1, nerve: +1 }
  - category: work
    word: DRESS
    cost: 0
    requires: [nude]
    prompt: Get dressed, in whatever's in the closet.
    result:
      text: |
        The closet has a shirt, a pair of jeans and a sweater with a hole in one elbow, and the
        drawer has socks. You put on all of it, everything you can find, and stand in front of
        the mirror on the closet door with the sweater sleeves pulled down over your hands.

        Your own clothes are still in a paper bag on a desk in the First Church, stapled shut,
        with a nickname on it.
      effects:
        - card.lose: nude
art:
  subject: >
    Eye-level photograph from the doorway of a small, clean upstairs bedroom in an older
    wood-frame house in a small Midwest town, standing height, the camera level, looking across
    the room toward a single dormer window set into a sloped ceiling. A full-size bed with a
    plain dark walnut headboard stands against the right wall, neatly made with a smooth white
    duvet pulled tight, two white pillows squared against the headboard and a folded navy blue
    wool blanket across its foot. A small wooden nightstand beside it holds a brass reading
    lamp and a glass of water. Against the left wall a low six-drawer pine dresser stands under
    a round mirror that catches the window light; on its top sit only a wristwatch and a small
    ceramic dish of keys and coins. A plain wooden chair stands in the corner by the window.
    The walls and the sloped ceiling are plain off-white plaster, the floor bare honey-colored
    oak boards with a small gray rag rug beside the bed. The room is sparse and orderly, with
    generous open floor. Through the dormer window, the top branches of a maple in orange
    autumn leaf against a pale sky. Cool early-morning daylight comes through the dormer window
    from the far wall and falls across the white duvet in a soft pale band, the corners of the
    room in gentle gray shadow. Restrained palette of white linen, honey oak, walnut, navy, soft
    gray and maple orange; natural texture, fine 35 mm film grain.

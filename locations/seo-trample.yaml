# yaml-language-server: $schema=../../../schema/v2/location.json
# Event: Deputy Seo tramples you on the floor of her holding cage. Reached by move.to from
# TALK-PROTEST and LOOK-STARE in seo-holding; the arrival costs Body and goes back there.
# Art: the shot from the floor, her raised sole filling the frame, her face beyond it.
id: seo-trample
name: The cage floor
tags: [law, prison]
description: Floor tiles under your back, the church's oak roof beams far above, and the sole of Deputy Seo's boot between you and them.
arrival:
  text: |
    The tiles are cold under your back. Far above, the old oak roof beams of the church cross
    in the dark. Then she is standing over you, a boot either side of your ribs, looking down,
    and the beams are behind her.

    She lifts one foot and holds the sole over your face, close enough that you can see the
    nail heads in the heel and the grit worn into the leather, and leaves it there.

    "This is the minimum," she says.

    She sets it down on your chest and steps up, and then she's standing on you with all of
    her weight, both boots. She walks: chest, stomach, chest
    again, small careful steps, one hand on the cage's chain-link for balance. She stops with
    a heel on the soft of your stomach and turns on it, a quarter turn, slowly, the way you'd
    put out a cigarette, and watches your face while she does it.

    Then the sole again, lifted, over your face. This time she lowers it, and rests it on
    your cheek, and lets a little of her weight go into it.

    "Where is the floor, Ankles?"

    You tell her it's under you.

    "Good." She steps off, and goes back to her desk, and writes it down.
  effects:
    - tracker.change: { body: -1 }
    - move.to: seo-holding
art:
  loras: ["DGirlsModel9:1"]
  subject: >
    Extreme low angle photograph from cheek height on the tiled floor of a chain-link holding
    cage in an old church, the camera tilted up, looking up along Deputy Seo's leg as she stands
    beside the camera. Her black riding boot is planted on the floor tiles right beside the
    lens, filling the left third of the frame: a stiff, mirror-polished black leather thigh-high
    riding boot with a low, flat stacked-leather heel, its glossy shaft rising from the tiles
    toward the top of the frame, the floor reflected in its toe. Beyond the boot, she towers
    over the camera, standing tall with one hand on the chain-link wall of the cage, and looks
    down along her own body into the lens with smug, calm dominance: dark eyes steady, delicate
    brows lifted, berry-pink lips in a small, satisfied smile. She is a Korean woman of
    twenty-nine, a classic Korean beauty with an elegant oval face, a softly tapered jaw, large
    almond-shaped dark brown eyes, sharp black winged eyeliner, delicate straight brows, a
    refined small nose, softly defined cheekbones, berry-pink gradient lips and luminous, smooth
    pale skin, her extremely long, glossy, vivid neon violet-purple hair woven into one enormous
    high French braid, the braid hanging down over her shoulder toward the camera. She wears the
    Graystone County Sheriff's uniform: a crisp, pressed tan long-sleeved uniform shirt with
    vivid azure blue epaulets, an embroidered vivid azure blue and gold patch on each upper
    sleeve and a polished gold six-point star badge; a vivid, saturated azure blue necktie with
    a small gold tie bar; a black leather duty belt with a polished brass buckle; and tan riding
    breeches, the same khaki tan as her shirt, with a vivid azure blue stripe down the outer
    seam, tucked into the boots. Her head is bare. Behind her, the galvanized chain-link wall of
    the cage and, far above, the dark oak roof beams of the church. Cool fluorescent light from
    above, a long highlight down the boot's shaft. Restrained palette of boot black, uniform
    tan, vivid azure blue, galvanized steel, pale floor tile, dark oak and neon violet; natural
    texture, fine 35 mm film grain, sharp focus on the boot, her face clear above it.

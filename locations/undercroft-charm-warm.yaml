# yaml-language-server: $schema=../../../schema/v2/location.json
# A reaction beat: entered only by a random move.to, it shows her reaction and returns you.
id: undercroft-charm-warm
name: Cell Three
tags: [law, prison]
description: She looks up.
arrival:
  text: |
    "That uniform," you say. "The creases. The boots. It's the sharpest thing in this county."

    She looks up. Then, before she can stop herself, down at her own sleeve: the chevrons, the
    crease you could cut paper on.

    "Forty minutes with an iron every morning," she says. "Twenty more with the boots. Nobody
    notices."

    "I noticed."

    She looks at you a beat longer than she needs to. "Yes," she says. "You did."
  effects:
    - boost.change: { card: ashbys-good-side, amount: +1 }
    - move.to: undercroft-cell
  art:
    loras: ["KreaEbonyBabe1"]
    subject: >
      Intimate photograph from standing eye height inside a small jail cell walled with smooth
      dressed limestone ashlar blocks laid in straight courses with thin mortar joints under a
      whitewashed pointed vault, underground and windowless but for one small barred slot at
      street level, looking through the black iron bars of the cell door, two blurred bars
      framing the shot. Just beyond them a woman stands close, framed from the chest up: a Black
      American woman in her early thirties, tall and athletic with a full, heavy bust, broad
      straight shoulders and a soldier's posture, smooth dark brown skin, long black dreadlocks
      gathered at the nape and falling to the middle of her back, a level, unimpressed stare
      under straight dark brows, black leather duty gloves and a ring of heavy iron keys on a steel chain at her hip. Her shoulders show the
      crisp, pressed tan long-sleeved uniform shirt with a pointed collar, shoulder epaulets
      edged in vivid azure blue, an embroidered vivid azure blue and gold patch on her upper
      sleeve with three vivid azure blue chevrons beneath it, a vivid, saturated azure blue
      necktie with a small gold tie bar and a polished gold six-point star badge over her left
      pocket. She has just glanced down at her own sleeve: her black-gloved fingertips smooth
      the sharp pressed crease below the chevrons, and her eyes lift back up to the lens from
      under her brows with a small, reluctant, pleased smile at one corner of her mouth. Behind
      her, out of focus, the warm underground corridor of smooth dressed limestone ashlar blocks
      laid in straight courses with thin mortar joints with caged bulbs. A caged bulb behind her
      rims her dreadlocks and her shoulder with warm light, her face in soft warm side light.
      Palette of uniform tan, vivid azure blue, gold, dark skin and black iron; natural skin
      texture, fine 35 mm film grain, focus on her eyes.
art:

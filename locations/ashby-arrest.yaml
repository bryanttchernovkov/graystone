# yaml-language-server: $schema=../../../schema/v2/location.json
# Event: Sergeant Ashby arrests you in Café Linde. Reached by move.to from RISK-APPROACH at the
# café window (open record). Hands-on where Anderson's arrest is mouth: an arm bar onto the table,
# a knee in the back, cuffs on the floor. Handcuffs go on, and she walks you across the square
# and straight down to the Undercroft (which takes the Handcuffs off and makes you an Inmate);
# the Criminal Record comes with you, to be worked off.
id: ashby-arrest
name: Under arrest
tags: [law]
description: Sergeant Ashby, out of her chair, with your arm in her hand.
arrival:
  text: |
    You're still deciding what to say when she stands, and then there's no deciding left.

    She takes your right wrist in her gloved hand and turns it, and your elbow locks, and
    the whole arm goes up behind you, and your face goes down onto the marble next to her
    saucer. The cup rattles. Somebody at the counter says "oh" and nobody else says anything.

    "Record," she says, close to your ear, not loud. "Don't."

    You do. You twist, once, and she takes the arm a notch higher and it's like a hot wire
    from your wrist to your shoulder and your knees fold. She folds with you, all the way to
    the tile, and puts a knee in the middle of your back and leans on it until your breath
    comes out of you in a long flat hiss.

    "That's what you get. Breathe. Slow. Good."

    The cuffs come off her belt. Left wrist, right wrist, ratcheted down until they bite. Only
    then does her knee come off your back.

    She lifts you off the floor by the cuffs and the back of your collar together, and
    stands you up, and keeps your cuffed hands high behind you so you walk on your toes.

    "Francine. The cup."

    "On your tab, Sergeant."

    She walks you out the door and across the square in daylight, past the cruisers and up
    the church steps, and every deputy on the stairs stops to hold the door. Through the
    nave without slowing. Down the stairs into the cold.
  effects:
    - card.gain: handcuffs
    - move.to: undercroft
art:
  loras: ["ashby7_krea2_000001200:0.8", "pvarst7_krea2_000002250:0.8"]
  subject: >
    pvarst7 POV arrest photo, a first-person view from the arrested man's own shoulder as he is
    bent forward over a small round white marble café table, looking down past his right
    shoulder at his right arm being handcuffed behind his back, his plain heather gray T-shirt
    and blue jeans in the foreground, his bare hairy forearm with no watch or bracelet and his
    palm turned outward; on the marble beside his shoulder a white porcelain cappuccino cup has
    tipped over on its saucer, milk foam spilling across the table. On the right side of the
    frame stands ashby7 woman in her sheriff's uniform, tan with an azure tie, her long black
    locs gathered at the nape, no jacket, no hat, no jewelry. She is wearing black gloves and
    grips his forearm just above the polished steel hinged handcuff locked on his wrist and
    holds the empty second cuff, closed, in her other hand. She looks down at the viewer with
    cold, controlled force, dark eyes hard, brows drawn low, lips pressed thin. Set in a small
    old-fashioned café, empty bentwood chairs and a tall brass-framed front window full of
    daylight behind her. Bright daylight through the window backlights her, a hard highlight
    along the steel cuff, natural skin texture, fine film grain, 35 mm lens.

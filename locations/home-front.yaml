id: home-front
name: 55 Graystone Heights
tags: []
description: A gray clapboard house with a deep front porch, a porch swing, and a maple dropping leaves on the lawn.
art:
  subject: >
    Eye-level photograph from the public sidewalk of a modest two-story wood-frame house on a
    quiet residential street in a small Midwest town in autumn, seen straight on across a
    narrow front lawn, standing height, the camera level. The house is clad in pale gray painted
    clapboard siding with crisp white trim, under a steep gabled roof of dark gray asphalt
    shingles, with two double-hung windows upstairs framed in white with dark forest-green
    shutters. A covered front porch runs the full width of the ground floor on square white
    posts with a white wooden railing; a wooden porch swing hangs on chains at its left end,
    and a dark forest-green front door with a small square window sits at its center, reached
    by three gray concrete steps. A narrow concrete walk runs from the bottom edge of the frame
    across the short green lawn to the steps, the grass scattered with fallen red and yellow
    maple leaves. A single mature sugar maple stands at the right edge of the frame, its
    branches crossing the top right corner in bright orange leaf. A gravel driveway runs along
    the left side of the house to a small detached white garage set back behind it. At both
    edges of the frame, partly cut off, stand the porches and siding of neighboring frame houses
    in white and pale yellow. The porch, the swing and the lawn are empty and still.
    Mid-morning sun from the upper left lights the clapboard and the porch posts warm and lays
    the porch roof's shadow in a sharp band across the front door. Restrained palette of pale
    gray siding, white trim, forest green, maple orange and lawn green; natural texture, fine
    35 mm film grain, deep focus.

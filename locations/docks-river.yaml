# yaml-language-server: $schema=../../../schema/v2/location.json
# The docks, looking out at the river: the wharf, a cargo ship tied up, and Deputy Seo's cruiser at
# the end of it (a patrol location: Most Wanted's setback trap works here, and for now that is
# still Anderson's arrest). In from Main Street; turning around (free) looks at the warehouses.
# TALK-APPROACH (no record) takes you to Deputy Seo (her storyline). With an open record both actions
# swap: RISK-APPROACH and RISK-LOITER each end face down in her arrest; she sees you first.
id: docks-river
name: The docks, the river
tags: [patrol]
hub: true
description: A concrete wharf, a rusting cargo ship tied up to it, the river wide and brown beyond, and a sheriff's cruiser parked at the end with a deputy standing beside it.
actions:
  - category: talk
    word: APPROACH
    cost: 1
    always: true
    unless: [wanted]
    prompt: Walk down the wharf to the deputy by the cruiser.
    result:
      text: |
        She isn't in the car. She's standing beside it with her back to the open door, in the
        green jacket and no hat, mirrored aviators on, turning her head slowly from the ship to
        the warehouses to the river and back, like a lighthouse. Her hair is purple, one braid
        of it that starts on top of her head and doesn't stop until past her belt.

        The aviators come round to you and stop.

        "Hello, Left Side," she says, pleasantly. "You walked the whole wharf on the left side.
        Nobody walks on the left side." She lowers the aviators a half inch and looks at you over
        them, at your face, your hands, your feet. "Deputy Seo. Why the left side?"
      effects:
        - move.to: seo-dockside
  - category: risk
    word: APPROACH
    cost: 1
    always: true
    requires: [wanted]
    prompt: Walk down the wharf to the cruiser, with open counts on your record.
    result:
      text: |
        The cruiser is where it was at the end of the wharf, its driver's door standing open.
        Nobody is beside it. A notebook sits on the roof.

        You're halfway down the wharf before you think to wonder where she went.
      effects:
        - move.to: seo-arrest
  - category: risk
    word: LOITER
    cost: 1
    requires: [wanted]
    prompt: Lean on a bollard and watch the river for an hour, with open counts on your record.
    result:
      text: |
        A barge goes downriver, low in the water with grain. Gulls fight over something on the
        wharf. The cruiser at the end of it has its door open and nobody beside it.

        You look for her along the ship's rail, then along the warehouses. You don't look
        behind you.
      effects:
        - move.to: seo-arrest
  - category: look
    word: WATCH
    cost: 1
    unless: [wanted]
    prompt: Lean on a bollard and watch the river for an hour.
    result:
      text: |
        The ship is called something you can't read under the rust, and nobody comes or goes on
        it the whole hour. A barge goes downriver, low in the water with grain. Gulls fight over
        something on the wharf.

        The deputy by the cruiser watches the gulls too. Twice she writes something in a little
        notebook. Once she says something to the river, and you're almost sure the river
        answers.
      effects:
        - tracker.change: { nerve: +1 }
art:
  loras: ["DGirlsModel9:1"]
  subject: >
    Eye-level widescreen photograph from standing height on a wide concrete river wharf in a
    small Midwest town in autumn, the camera level. The wharf runs away from the lens across the
    left two-thirds of the frame: a black iron bollard with a coil of mooring rope and two gulls
    on it in the near left foreground, the long dark red hull of a rusting river cargo ship
    streaked orange with rust tied up along the wharf with its white wheelhouse at the stern,
    and beyond it a broad brown river running to a low far bank of yellow cottonwoods and a
    distant steel truss bridge. Farther down the wharf in the middle distance, small, a
    Graystone County Sheriff's patrol car, a present-day Ford Police Interceptor Utility SUV
    painted two-tone, with a white roof, hood and front doors over a tan body, a broad vivid
    azure blue stripe running the full length of each flank below the windows, a gold six-point
    star decal on each front door, a low black roof light bar with red and blue lenses, a black
    steel push bumper bolted across the front grille and black steel wheels, stands parked with
    its doors shut; its windows are tinted dark and its light bar is unlit. At the right edge of
    the frame, close to the lens, two paces away, a woman stands leaning her shoulder against a
    black cast-iron lamp post, framed from her hips to just above her head, filling the right
    third of the frame, her body turned toward the river and her head turned to the camera with
    bright, curious amusement: delicate brows lifted, berry-pink lips in a small, pleased smile.
    She is a Korean woman of twenty-nine, a classic Korean beauty with an elegant oval face, a
    softly tapered jaw, large almond-shaped dark brown eyes, sharp black winged eyeliner,
    delicate straight brows, a refined small nose, softly defined cheekbones, berry-pink
    gradient lips and luminous, smooth pale skin, her extremely long, glossy, vivid neon violet-
    purple hair woven into one enormous high French braid that rises from the crown of her head
    and falls down her back past her waist. She wears a dark forest-green bomber jacket of
    smooth nylon twill with ribbed knit cuffs, collar band and waistband, zipped up to the
    middle of her chest, worn with both arms in its sleeves, a single polished gold six-point
    star badge pinned on its left chest and an embroidered vivid azure blue and gold patch on
    each upper sleeve; above the zipper, the pointed collar of a crisp tan uniform shirt and the
    knot of a vivid, saturated azure blue necktie; a black leather duty belt with a polished
    brass buckle; and tan riding breeches, the same khaki tan as her shirt, with a vivid azure
    blue stripe down the outer seam. Her head is bare, her violet braid falling over one
    shoulder of the green jacket, and gold-framed aviator sunglasses with mirrored lenses sit on
    her nose. Bright, hazy late-morning sun from behind the camera lights the wharf, the ship's
    rust and her face, the river glinting. Restrained palette of river brown, rust red, concrete
    gray, cruiser white and tan, forest green, vivid azure blue and neon violet; natural
    texture, fine 35 mm film grain, focus on her face with the wharf slightly soft behind.

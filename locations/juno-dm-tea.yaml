# yaml-language-server: $schema=../../../schema/v2/location.json
# Beat: a photo from Juno Vance, bought with SIMP on Subscribed: @rootkitty or Rootkitty's
# Simp, from anywhere. Reached by move.to (random) from that card action; move.back returns
# you to wherever you were, without its arrival (ADR 0043 in the engine repo).
id: juno-dm-tea
name: A photo from @rootkitty
description: A bubble tea the size of a paint can, and her teeth on the straw.
arrival:
  text: |
    The phone buzzes. A selfie: her on her bed with a bubble tea the size of a paint can, the fat
    straw between her teeth, grinning around it. Brown sugar, extra pearls, the works.

    *spent ur $15 on this*

    *it was better than u*

    *like the pearls are literally more interesting. they have texture*

    *say thank u for my drink*

    You type it. She leaves you on read.
  effects:
    - tracker.change: { time: +1 }
    - move.back
art:
  loras: ["KreaTransBabe:1"]
  subject: >
    Overhead photograph looking straight down at a scuffed dark walnut tabletop, the camera
    directly above it. The wood grain fills the whole frame from edge to edge around a black
    smartphone lying flat on the table in landscape orientation, the phone filling the middle
    two-thirds of the frame, with the rim of a white coffee cup at the top left corner of the
    frame and a set of house keys at the top right. A pale man's bare hand with broad knuckles
    and short, bare, unpainted nails cut straight across rests on the wood at the bottom right
    corner of the frame, one fingertip touching the phone's edge. Its wide, bright landscape
    screen shows, edge to edge, a horizontal photograph taken in a young woman's small bedroom,
    the whole photograph contained inside the phone's black bezel: a selfie of one woman from
    the shoulders up, sitting on her bed, her face close to her own camera at the right of the
    photograph. She looks straight into her camera with smug, gleeful satisfaction: eyes
    narrowed with amusement behind her glasses, brows raised, a fat pastel pink straw clamped
    between her grinning teeth. She is a trans woman of twenty-three, slim and petite with
    narrow shoulders and a small bust, pale skin with a light dusting of freckles across her
    nose, long straight hair dyed half jet black and half pastel pink, split sharply down a
    center part, the left half jet black and the right half pastel pink, worn in two low
    pigtails, blunt straight-cut bangs, thick black rectangular rimmed glasses, sharp black
    winged eyeliner, glossy pale pink lips and a small silver ring in her septum. A black velvet
    choker with a small silver O-ring sits at her throat above the hood of an oversized black
    hoodie. Filling the left half of the photograph, held up in both her hands beside her face,
    is an absurdly oversized clear plastic cup of brown sugar milk tea, a giant novelty cup as
    tall as her whole head and twice as wide as her face, tiger-striped with dark caramel syrup
    down the inside, a deep layer of glossy black tapioca pearls in the bottom, the fat pink
    straw running from its sealed lid to her teeth. Behind her, out of focus, pastel posters on
    a pale wall and a strip of pink LED light along the ceiling. The screen glows bright against
    the dark wood, the photograph on it crisp. Restrained palette of dark walnut, pale skin,
    black, milk-tea brown, caramel, pastel pink and LED pink; natural skin texture, fine 35 mm
    film grain, focus on the phone screen.

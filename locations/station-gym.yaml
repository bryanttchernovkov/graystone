# yaml-language-server: $schema=../../../schema/v3/location.json
# The First Church station, the back: the gym, a small annex built onto the back of the church,
# through the side door and a short covered walkway. North back to the bullpen.
id: station-gym
name: The gym
tags: [law]
hub: true
description: "A small annex out back: mats wall to wall, a heavy bag, a row of lockers, and two deputies sparring."
actions:
  - category: look
    word: WATCH
    cost: 1
    prompt: Stand by the door and watch two deputies spar.
    result:
      text: |
        Two deputies on the mats, in T-shirts and uniform breeches, barefoot. One is bigger. The
        smaller one puts her on the floor three times in five minutes, and each time she does it
        the same way: a hand at the elbow, a step in, a hip, and then the bigger one is looking
        at the ceiling tiles.

        "Again," says the bigger one. "Slower."

        They both look at you on the way down the fourth time. Neither of them stops. Ten
        minutes of it, and you know how it's done.
      effects:
        - skill.gain: risk
art:
  subject: >
    Eye-level widescreen photograph from standing height just inside the door of a small, low-
    ceilinged gym room in a single-story annex, the camera level, looking across the whole
    room to its back wall five paces away. The walls are painted concrete block in pale gray,
    the ceiling white acoustic tiles with two long fluorescent light fixtures, and a single
    small high window on the right lets in a square of daylight. The floor is covered wall to
    wall in interlocking blue foam gym mats. Along the back wall stands a row of tall gray
    steel lockers with vented doors, one standing ajar with a towel hanging from it, and a
    wooden bench in front of them. In the right corner a black leather heavy bag hangs from a
    ceiling hook, and a small rack of black dumbbells sits against the left wall beside a
    folded stack of spare mats. In the middle of the mats, two women deputies in plain gray
    T-shirts and tan uniform breeches, barefoot, spar, one stepping in with her hand at the
    other's elbow. Cool fluorescent light from above, warmed a little by the daylight from the
    high window. Restrained palette of mat blue, concrete gray, locker gray, tan and black;
    natural texture, fine 35 mm film grain, deep focus.

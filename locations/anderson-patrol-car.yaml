          and maple orange; natural skin texture, fine 35 mm film grain, focus on her lips and
          eyes.
  - category: deal
    word: INHALE
    cost: 1
    always: true
    requires: [boots]
    tags: [tribute]
    prompt: Ask for one of her boots. You take it off her yourself, kneeling at the curb, and breathe in the inside of it with the street watching.
    result:
      text: |
        "Deputy. Could I — your boot."

        She looks at you over the laptop for a long moment. Then she opens the door, swings her
        right leg out and sets the heel on the doorsill.

        "I've been in these since six. Take it off. Kneel, you're not tall enough to do it
        standing."

        You kneel on the curb. You take the heel in one hand and the back of the shaft in the
        other and pull, and the stiff leather fights you all the way down her calf, and then
        it comes, and her foot slides out in a thin black knee sock, damp through at the heel.

        "Face in. All the way. Breathe."

        You put your face into the top of the shaft. It's warm, still, from her leg: leather,
        salt, rubber, a sour sweetness that's her and nothing else. You breathe it in.

        "Count them. Out loud."

        You count your breaths into her boot. Across the street a man pushing a mower lets it
        idle and stands there.

        "Louder, babe. Mr. Haskell can't hear you."

        At twenty she takes the boot back, steps into it and works her foot down with a
        stamp on the doorsill.

        "And don't lick it. Gross. It's polished." She pulls the door shut. "Same time
        tomorrow, if you're good."
      effects:
        - boost.change: { card: andersons-attention, amount: +1 }
        - tracker.change: { nerve: +1 }
      art:
        loras: ["DGirlsModel14:1"]
        subject: >

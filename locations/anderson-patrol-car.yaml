          loose over the jacket's shoulders, and her hands are bare. Her bare right hand, out of
          the green bomber sleeve, is raised toward the lens with one glossy black-nailed finger
          pointing at it. Behind her, softly out of focus, the dark car interior, a dash-mounted
          laptop glowing blue-white and the passenger window with orange maples beyond it. Soft

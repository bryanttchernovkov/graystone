  - category: look
    word: WATCH
    cost: 1
    prompt: Stand by her car a while and watch her work the street.
    result:
      text: |
        She works the Heights from the driver's seat. A man in a Buick rolls the stop sign at
        the end of the block and she has him pulled over before he's past the next driveway;
        she doesn't get out, just backs up beside him and talks through both windows until he
        says "yes, ma'am" twice and drives off at fifteen miles an hour.

        A woman with a stroller waves. Anderson waves back, sweet as pie. A teenager on a
        skateboard doesn't wave and she follows him at walking pace for a block with the
        spotlight on him, in daylight.

        She knows every truck on the hill. She knows your house.
      effects:
        - skill.gain: look

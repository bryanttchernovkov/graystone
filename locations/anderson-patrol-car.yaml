# yaml-language-server: $schema=../../../schema/v2/location.json
# Event: at Deputy Anderson's driver's window, on the Heights. Reached by move.to from
# TALK-APPROACH at the Heights (no APB; its result carries her introduction, so the coin-flip
# beats can send you back here without replaying it) and from those beats. The only exit, out,
# steps back onto the street.
# Her favor: TALK-INTRODUCE gives Anderson's Attention (tag noticed hides it after); the rest
# raise it. Boot Fetish fast-tracks DEAL-INHALE (always); Anderson's Paypig without it opens
# DEAL-BEG, which earns Boot Fetish.
id: anderson-patrol-car
name: Deputy Anderson's cruiser
tags: [law, patrol]
hub: true
description: A cruiser idling under the maples, window down, and a deputy behind the wheel who has already decided what she thinks of you.
actions:
  - category: talk
    word: INTRODUCE
    cost: 0
    unless: [noticed]
    prompt: Tell her who you are. She takes your picture, and she'll remember you, which isn't the same as liking you.
    result:
      text: |
        You tell her your name, and that you're new, and that you live just up the hill.

        "Cool story." She doesn't write it down. "Say your name again. Slower."

        You say it again. She repeats it back to you the way you'd read an ingredient off a
        label, and laughs once through her nose. Then she holds her phone up at the window and
        takes your picture. She looks at it, takes another one, and looks at that one longer.

        "Oh, that's a good one. That's going in the group chat." She types for a while. "Okay.
        I know who you are now, babe. That's not a compliment. That's a warning."
      effects:
        - card.gain: andersons-attention
        - skill.gain: talk
      art:
        loras: ["DGirlsModel14:1"]
        subject: >
          First-person point-of-view widescreen photograph from standing eye height on the
          sidewalk beside the open driver's window of a parked sheriff's patrol car on a quiet
          residential street in a small Midwest town in autumn, the camera level and one pace
          from the white car door with its broad vivid azure blue stripe and gold six-point star
          decal. One woman sits behind the wheel turned toward the lens, framed from the waist
          up in the window opening, holding a black smartphone up at arm's length toward the
          camera in her bare right hand, out of the green bomber sleeve, its camera lens aimed
          at the viewer and its glowing screen turned toward her. She looks over the top of the
          phone directly into the camera, making eye contact with the viewer, with gleeful,
          mocking amusement: green eyes bright and narrowed, one dark brow arched, berry lips
          spread in a wide teasing grin. She is a white American woman of twenty-four, slim and
          toned with a full bust and long legs, fair skin, long wavy platinum-blonde hair with
          bold jet-black streak highlights falling past her shoulders, dark elegant makeup with
          smoky black eyeliner, long dark lashes and deep berry lipstick, striking bright green
          eyes, arched dark brows, and long almond-shaped nails painted glossy black. She wears
          the Graystone County Sheriff's patrol uniform: a dark forest-green bomber jacket of
          smooth nylon twill with ribbed knit cuffs, collar band and waistband, zipped up to the
          middle of her chest, worn with both arms in its sleeves and both shoulders covered, a
          single polished gold six-point star badge pinned on its left chest and an embroidered
          vivid azure blue and gold patch on each upper sleeve; above the zipper, the pointed
          collar of a crisp, pressed tan uniform shirt and the knot of a vivid, saturated azure
          blue necktie with a small gold tie bar. Her head is bare, her long hair loose over the
          jacket's shoulders, and her hands are bare; her bare left hand, out of the other green
          bomber sleeve, rests on the steering wheel. Inside the car, softly out of focus, a
          dash-mounted laptop glowing blue-white. Through the far window, blurred, white
          clapboard houses under orange maples. Soft overcast late-morning light from a high gray
          sky lights her face and the white door. Restrained palette of white car door, forest
          green, tan, vivid azure blue, platinum blonde and maple orange; natural skin texture,
          fine 35 mm film grain, focus on her eyes above the phone.
  - category: talk
    word: FLATTER
    cost: 1
    prompt: Pay her a compliment. She may want one from you, or she may tell you everything that's wrong with you.
    result:
      text: |
        You tell her the uniform looks good on her. That she wears it better than anyone you've
        seen. You mention the boots.
      effects:
        - move.to:
            random: [anderson-flatter-cold, anderson-flatter-warm]
  - category: deal
    word: COFFEE
    cost: 1
    tags: [tribute]
    prompt: Offer to buy her a coffee. She'd rather have the money, and she has an opinion about men who keep their wallets shut.
    result:
      text: |
        "Can I buy you a coffee, Deputy?"

        She holds her hand out of the window, palm up, black nails, and doesn't look away from
        her laptop. "I don't drink diner coffee. I'll take what it would've cost. Plus the tip.
        Plus something for having to listen to you ask."

        You get your wallet out. She snaps her fingers twice, the way you'd hurry a waiter.

        "Or put it away," she says, "and I spit on your shoes, and you walk home in them. Your
        call, babe. I honestly don't care which."

        Whatever goes into her hand, she counts in front of you, holding each bill up to the
        light as if you might have printed it yourself, and folds it into her breast pocket.
      effects:
        - choose:
            - label: Give her $10
              price: { cash: 10 }
              effects:
                - boost.change: { card: andersons-attention, amount: +1 }
            - label: Give her $25
              price: { cash: 25 }
              effects:
                - boost.change: { card: andersons-attention, amount: +2 }
            - label: Keep your wallet, and take the spit on your shoes
              effects:
                - tracker.change: { nerve: -1 }
      art:
        loras: ["DGirlsModel14:1"]
        subject: >
          First-person point-of-view widescreen photograph from standing eye height on the
          sidewalk beside the open driver's window of a parked sheriff's patrol car on a quiet
          residential street in a small Midwest town in autumn, the camera tilted slightly down
          toward the window. One woman sits behind the wheel turned toward the lens, framed from
          the waist up in the window opening. She looks directly into the camera, making eye
          contact with the viewer, with bored, greedy contempt: green eyes half-lidded, one dark
          brow arched high, berry lips pursed. She is a white American woman of twenty-four,
          slim and toned with a full bust and long legs, fair skin, long wavy platinum-blonde
          hair with bold jet-black streak highlights falling past her shoulders, dark elegant
          makeup with smoky black eyeliner, long dark lashes and deep berry lipstick, striking
          bright green eyes, arched dark brows, and long almond-shaped nails painted glossy
          black. She wears the Graystone County Sheriff's patrol uniform: a dark forest-green
          bomber jacket of smooth nylon twill with ribbed knit cuffs, collar band and waistband,
          zipped up to the middle of her chest, worn with both arms in its sleeves and both
          shoulders covered, a single polished gold six-point star badge pinned on its left
          chest and an embroidered vivid azure blue and gold patch on each upper sleeve; above
          the zipper, the pointed collar of a crisp, pressed tan uniform shirt and the knot of a
          vivid, saturated azure blue necktie with a small gold tie bar. Her head is bare, her
          long hair loose over the jacket's shoulders, and her hands are bare. Her bare left
          hand, out of the green bomber sleeve, reaches out of the window toward the lens palm
          up, glossy black nails curled, waiting; her bare right hand, out of the other green
          bomber sleeve, holds two folded green banknotes up beside her face between two
          fingers, flicking them. The white car door with its broad vivid azure blue stripe and
          gold six-point star decal fills the bottom of the frame. Through the far window,
          blurred, white clapboard houses under orange maples. Soft overcast late-morning light
          from a high gray sky lights her face and her open palm. Restrained palette of white
          car door, forest green, tan, vivid azure blue, banknote green, platinum blonde and
          maple orange; natural skin texture, fine 35 mm film grain, focus on her eyes and her
          open hand.
  - category: talk
    word: THANK
    cost: 1
    tags: [tribute]
    prompt: Thank her for keeping the Heights safe. She makes you lean in and say it properly, and then she spits in your face.
    result:
      text: |
        "Thank you for your service, Deputy."

        She stops typing. "Lean in."

        You put one hand on the roof and lean into the window. The car smells of vanilla air
        freshener, gun oil and her perfume.

        "Again. Like you mean it."

        "Thank you for your service, Deputy."

        She looks at you a moment. Then she leans across, gathers, and spits in your face: warm,
        across your cheek and the corner of your mouth.

        "You're welcome. Don't wipe it. Say thank you for that, too."

        You say thank you for that, too. She keeps you bent in her window with it running down
        your face while a pickup goes by slowly enough for the driver to get a look.

        "Okay, you can go," she says. "Leave it on till you get home. I'll know."
      effects:
        - boost.change: { card: andersons-attention, amount: +1 }
        - skill.gain: talk
      art:
        loras: ["DGirlsModel14:1"]
        subject: >
          First-person point-of-view widescreen photograph from inside the open driver's window
          of a parked sheriff's patrol car, the camera bent down level with her face and close,
          an arm's length from her. One woman sits behind the wheel leaning toward the lens,
          framed from the chest up, her face filling the center of the frame. She looks directly
          into the camera, making eye contact with the viewer, with cool, satisfied contempt:
          green eyes narrowed, one dark brow arched, berry lips pursed forward, a glistening
          string of saliva at her lower lip. She is a white American woman of twenty-four, slim
          and toned with a full bust and long legs, fair skin, long wavy platinum-blonde hair
          with bold jet-black streak highlights falling past her shoulders, dark elegant makeup
          with smoky black eyeliner, long dark lashes and deep berry lipstick, striking bright
          green eyes, arched dark brows, and long almond-shaped nails painted glossy black. She
          wears the Graystone County Sheriff's patrol uniform: a dark forest-green bomber jacket

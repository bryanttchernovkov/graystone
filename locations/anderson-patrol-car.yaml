  - category: deal
    word: BEG
    cost: 1
    requires: [owned]
    unless: [boots]
    tags: [tribute]
    prompt: Beg her for a boot. She shows you what one is for, the inside, at the curb, and you won't look at boots the same way again.
    result:
      text: |
        "Deputy, please. Your boot."

        "My boot." She tries it out. "He wants my boot. What are you going to do, polish it?
        Kneel down."

        You kneel on the curb. She opens the door, swings her right leg out, and makes you pull
        the boot off her yourself, heel and shaft, while she films it. Her foot comes out in a
        thin black knee sock, dark and damp at the heel and toe.

        You turn the boot to the light to look at the shine. She slaps the back of your head.

        "Not the outside, dummy. The outside's for everyone. The inside's where I am. Face in."

        You put your face into the top of the shaft. It's warm and close, leather and salt and
        her, a whole day of her, and the first breath goes all the way down. She pushes the
        boot onto you with her socked foot on the heel, so it sits over your nose and mouth.

        "Slow. In through the nose. Out through the mouth. Again. Again."

        By the twentieth breath you've stopped hearing the street. By the fortieth you're
        breathing in time with her counting. When she takes it back you follow it with your
        face, a few inches, before you catch yourself, and she laughs so hard she has to put
        her forehead on the steering wheel.

        "Oh my God. Oh, you're done. You're going to be sniffing every boot in this county now."
        She steps back into it, stamps it down. "Only mine, though. Say it."

        You say it.
      effects:
        - card.gain: boot-fetish
        - boost.change: { card: andersons-attention, amount: +1 }

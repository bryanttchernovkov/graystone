# yaml-language-server: $schema=../../../schema/v2/location.json
id: undercroft
name: The Undercroft
tags: [law, prison]
description: Limestone vaults under the old church, caged bulbs, and a sergeant's desk past a yellow line.
hub: true
arrival:
  text: |
    The stairs come down out of the nave into cold. Limestone vaults, whitewashed once,
    caged bulbs strung along the ribs, the smell of floor wax and old stone. A yellow line
    is painted across the flagstones at the bottom step.

    Beyond it, at a steel desk under the first arch, Sergeant Ashby looks up from a ledger.
    Black gloves, a tan shirt pressed to an edge, boots polished to a black mirror. She doesn't
    stand.

    "That's my line," she says. "You stay behind it until I say otherwise."

    Whatever you came down the stairs wearing on your wrists comes off at the line and goes
    back up with whoever brought it. "Road cuffs," the Sergeant says. "Down here we use mine."
  # Inmate belongs to the Undercroft: it starts here, however you were brought down. How long
  # you stay is the Criminal Record you carried down, worked off by Doing Time.
  # An arrest's Handcuffs come off here; the Undercroft has its own restraints (TERMS).
  effects:
    - card.lose: handcuffs
    - card.gain: inmate
actions:
  - category: talk
    word: ASK
    cost: 1
    always: true
    tags: [doing-time]
    unless: [gagged]
    prompt: Ask to approach her desk. She decides how it's asked, and you'll ask until she's satisfied.
    result:
      text: |
        "Can I —"

        "No." She turns a page. "Try it with my rank in it."

        "Sergeant, can I come to the desk?"

        "You can. Whether you may is the question."

        "Sergeant, may I approach the desk?"

        She makes you say it twice more, louder the second time, because the vault carries and
        she wants the cells to hear what asking sounds like. Then she points at the floor in
        front of the desk with one gloved finger.

        "Granted. Toes on the seam. Hands where I can see them."

        You stand where she pointed. She goes back to the ledger.
      effects:
        - skill.gain: talk
        - tracker.change: { nerve: -1 }
      art:
        loras: [KreaEbonyBabe1]
        subject: >
          First-person point-of-view widescreen photograph from standing eye height on the flagstone
          floor of a crypt built of smooth dressed limestone ashlar blocks laid in straight courses
          with thin mortar joints under a whitewashed pointed vault, converted into a jail block,
          the camera tilted slightly down toward a gray steel desk two paces away. A broad stripe of
          scuffed yellow paint runs straight across the worn gray flagstones along the bottom edge
          of the frame. Behind the desk, filling the center of the frame from the waist up, a woman
          sits upright in a steel chair. She looks up from her ledger directly into the camera,
          making eye contact with the viewer, with cool, amused impatience: one eyebrow arched high,
          head tilted, lips pressed in a thin, sardonic smirk. She is a Black American woman in her
          early thirties, tall and athletic with a full, heavy bust, broad straight shoulders and a
          soldier's posture, smooth dark brown skin, long black dreadlocks gathered at the nape and
          falling to the middle of her back, straight dark brows, black leather duty gloves and a
          ring of heavy iron keys on a steel chain at her hip. She wears the Graystone County
          Sheriff's uniform: a crisp, pressed tan long-sleeved uniform shirt of heavy cotton twill
          with a pointed collar, a full button-front placket, two buttoned flap chest pockets piped
          in vivid azure blue, shoulder epaulets edged in vivid azure blue, an embroidered vivid
          azure blue and gold patch on each upper sleeve and a polished gold six-point star badge
          pinned over the left pocket; a vivid, saturated azure blue necktie with a small gold tie
          bar; a black leather duty belt with a polished brass buckle; her head is bare. Three vivid
          azure blue chevrons sit on each upper sleeve beneath the patch. She points down at the
          flagstones in front of the desk with one black-gloved index finger, her other gloved hand
          flat on an open ruled ledger. Behind her a pegboard on the dressed limestone ashlar wall
          holds steel handcuffs, leg irons and coiled lengths of chain on hooks, beside a cork board
          with a single typed sheet. Beyond her the windowless underground corridor, lit only by
          caged bulbs, recedes under a row of pointed arches of smooth dressed limestone ashlar
          blocks laid in straight courses with thin mortar joints, each side arch closed by a black
          iron barred door. Warm light from caged incandescent bulbs hanging on black cords from the
          vault ribs falls from above and slightly behind her, rimming her shoulders and dreadlocks
          and pooling amber on the desk, while the corners of the vault sink into soft shadow.
          Palette of limestone gray, uniform tan, vivid azure blue, black iron and bulb amber;
          natural skin texture, fine 35 mm film grain, shallow depth of field on her face.
  - category: deal
    word: TERMS
    cost: 1
    always: true
    prompt: Hear the Sergeant's terms for your stay. They come with cuffs, chains, a cage, and a walk to a cell.
    result:
      text: |
        "Wrists," she says. "Over the desk. Palms down."

        You hold them out. She takes the first pair of cuffs off her belt without looking at
        it, closes one ring on your left wrist and ratchets it down until it bites, checks the
        gap with a gloved fingertip, and takes it one click tighter. Then the right. She
        double-locks both with the small end of the key.

        "Eight years military police, so here's how it works. You don't stand, sit, speak,
        drink or piss in my block without asking. You ask, I decide. Every time."

        A belly chain goes around your waist and through the cuffs. A shorter one runs from one
        ankle cuff to the other. She tugs the whole rig once, hard.

        Then she takes a small pink plastic cage out of the desk drawer, county property, and
        holds it up between two gloved fingers so you can see it. "Standard issue. The county
        picked the color. Belt."

        She opens your jeans herself, fits the ring and the cage with her gloves on, quick and
        clinical, and snaps the padlock shut. The key goes into her left breast pocket, behind
        the star. She buttons the flap.

        "Walk."

        You walk, in the short steps the chain allows, her gloved hand closed on the back of
        your collar and the keys ringing at her hip, to the third arch on the left.

        Cell Three was a burial niche once: a stone recess under the arch, a cot of steel slats
        with a gray wool blanket, a steel toilet with no seat, an iron ring in the back wall at
        ankle height, and high up near the vault, a small barred window at street level. The
        door rolls shut on its track. She locks it, tries it, and stays a moment with one
        gloved hand on the bars.

        "Ask nicely," she says, "and the time goes faster."
      effects:
        - skill.gain: deal
        - card.gain: prison-chains
        - card.gain: chastity-cage
        - card.gain: ashbys-good-side
        - move.to: undercroft-cell
      art:
        loras: ["KreaEbonyBabe1", "pnkcg_krea2_000000750:1"]
        subject: >
          First-person point-of-view widescreen photograph from standing eye height across a
          gray steel desk in a crypt jail built of smooth dressed limestone ashlar blocks laid
          in straight courses with thin mortar joints under a whitewashed pointed vault, the
          camera level. One woman stands behind the desk at arm's length, framed from the waist
          up in the center of the frame. Her raised black-gloved right hand is held up in front
          of her left breast pocket, and from her fingers a small pink plastic chastity cage
          dangles by its tiny open brass padlock, empty and unlocked, its curved pink bars open
          and hollow, the light shining straight through them. Her gloved left hand rests flat
          on the desk. She looks directly into the camera, making eye contact with the viewer,
          with calm control and almost smug disdain: chin raised, eyes half-lidded, looking down
          her nose at the lens, one corner of her mouth pulled into a faint smirk. She is a
          Black American woman in her early thirties, tall and athletic with a full, heavy bust,
          broad straight shoulders and a soldier's posture, smooth dark brown skin, long black
          dreadlocks gathered at the nape and falling to the middle of her back, straight dark
          brows, black leather duty gloves and a ring of heavy iron keys on a steel chain at her
          hip. She wears the Graystone County Sheriff's uniform: a crisp, pressed tan
          long-sleeved uniform shirt of heavy cotton twill with a pointed collar, a full
          button-front placket, two buttoned flap chest pockets piped in vivid azure blue,
          shoulder epaulets edged in vivid azure blue, an embroidered vivid azure blue and gold
          patch on each upper sleeve and a polished gold six-point star badge pinned over the
          left pocket; a vivid, saturated azure blue necktie with a small gold tie bar; tan
          riding breeches, the same khaki tan as her shirt, with a vivid azure blue stripe down
          the outer seam; a black leather duty belt with a polished brass buckle; her head is
          bare. Three vivid azure blue chevrons sit on each upper sleeve beneath the patch. On
          the desk in front of her lie a coiled steel belly chain and an open ruled ledger.
          Behind her, a pegboard of leg irons and chains hangs on the dressed limestone ashlar
          wall under a pointed arch. A caged incandescent bulb directly overhead throws hard
          warm light down onto her glove, the pink cage and her face, leaving the vault behind
          her in soft amber shadow. Palette of pink plastic, black leather, uniform tan, vivid
          azure blue and limestone gray; natural skin texture, fine 35 mm film grain, sharp
          focus on the cage and her eyes.
  - category: look
    word: READ
    cost: 1
    prompt: Read the typed sheet tacked to the board behind her desk.
    result:
      text: |
        UNDERCROFT — STANDING ORDERS, typed, initialed M.A. at the bottom.

        One: detainees request permission for all movement. Two: requests are made by rank,
        in a full sentence. Three: requests are made once. Four: the Sergeant's decision is
        final. Five: detainees will maintain the Sergeant's uniform on request.

        Under five, in blue pen, underlined twice: *boots included. Tongue, not cloth.*

        "Memorize it," she says, without looking up. "There's a quiz."
      effects:
        - skill.gain: look
art:

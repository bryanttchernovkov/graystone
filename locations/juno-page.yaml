# yaml-language-server: $schema=../../../schema/v2/location.json
# Event: Juno Vance's subscription page, @rootkitty, on the laptop at home. Reached by move.to
# from LOOK-SCROLL on the laptop (always offered there); out closes the tab, back to the laptop.
# DEAL-SUBSCRIBE gives Subscribed: @rootkitty (tag subscribed hides it after); from then on the
# card's SIMP works from anywhere.
id: juno-page
name: "@rootkitty"
hub: true
description: A pink banner, a profile picture with its tongue out, and a grid of photos blurred to pastel smudges, each with a price.
actions:
  - category: look
    word: PREVIEW
    cost: 1
    prompt: Look at what she gives away for free.
    result:
      text: |
        The bio says: *23. graystone's only hacker. chastity, tasks, and the thing you keep
        zooming in on. straight boys welcome. for now.*

        One post is free, and pinned. It's a photo from a library chair, her boots up on the
        table, a short pleated skirt and striped socks, the camera pointed down her own body.
        The skirt sits wrong at the front. The caption says *yes it's real. no you can't see it.
        $20.*

        Under it, four hundred comments. You read more of them than you meant to. Most are men
        saying they're straight.
      effects:
        - skill.gain: look
  - category: deal
    word: SUBSCRIBE
    cost: 1
    unless: [subscribed]
    prompt: Subscribe. Twenty dollars a month to see what's behind the blur.
    result:
      text: |
        The button is pink. Under it, in small gray letters: *by subscribing you confirm you
        are an adult, and a simp.*
      effects:
        - choose:
            - label: Subscribe ($20)
              price: { cash: 20 }
              text: |
                The blur lifts off the grid one square at a time, top left to bottom right, as if
                she's doing it by hand. Boots. Socks. A chastity cage on a pink ribbon. Her, from
                the waist down, in a mirror, with nothing in the way.

                Then a message, before you've finished scrolling: *lol. that was fast. welcome to
                the club, loser.* And a second one: *you'll want more. it's $15 a pic. i'll know
                when you're looking.*
              effects:
                - card.gain: rootkitty-subscription
            - label: Close the tab
              text: |
                You close it. Your thumb hovers over the history for a while, and then you clear
                that too.
art:
  loras: ["KreaTransBabe:1"]
  subject: >
    Close photograph of an open silver laptop on a low honey oak coffee table at night, seen
    from the sofa at seated eye height, the screen filling most of the frame, its thin black
    bezel and the dark keyboard at the bottom edge. On the screen, a clean, modern social
    media profile page laid out in a single centered column on a white background: across the
    top, a wide pastel pink banner with small drawn white stars and cats; below it, in the
    center, a small round profile photograph of one woman, head and shoulders, sticking her
    tongue out at her own camera. She is a trans woman of twenty-three with pale skin and
    freckles, long straight hair dyed half jet black and half pastel pink in two low pigtails,
    blunt bangs, thick black rectangular rimmed glasses and a small silver septum ring,
    wearing an oversized black hoodie zipped up to a black velvet choker. Under the photo,
    three short lines of soft gray blur and a rounded pastel pink button with a white padlock
    icon. Below that, filling the lower half of the screen, a grid of nine square tiles, every
    one blurred to soft featureless smudges of pink and gray, each with a small white padlock
    icon at its center. Beyond the laptop, out of focus, a dark living room with honey oak
    floorboards and the arm of a deep brown leather sofa. The screen's cool white and pink
    glow is the only light, falling on the keys and the wood of the coffee table, the room
    around it in deep shadow. Restrained palette of screen white, pastel pink, black and dark
    oak; natural texture, fine 35 mm film grain, shallow depth of field on the screen.

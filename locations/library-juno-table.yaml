# yaml-language-server: $schema=../../../schema/v2/location.json
# Event: at Juno Vance's corner table in the library. Reached by move.to from TALK-APPROACH in
# the computer corner (its result carries her greeting, so nothing replays here); out goes back
# to the computer corner. Her scenes here are still to come; a later one takes you home with her
# (juno-apartment-*), from here only.
id: library-juno-table
name: Juno's table
hub: true
description: A small round oak table in the corner, a laptop covered in stickers, an energy drink, and Juno Vance with one boot up on the other chair.
actions:
  - category: talk
    word: ASK
    cost: 1
    prompt: Ask what she's working on. She turns the laptop round and shows you.
    result:
      text: |
        "Homework." She turns the laptop round. It's a list: library card numbers, down the left,
        and next to each one the last thing that card looked at on the public computers. She
        scrolls. It goes on for a while. Some of the lines are highlighted pink.

        "Pink ones are my subscribers." She turns it back. "Everybody who sits at those computers
        ends up on my page eventually, dude. It's like gravity." She writes something on a
        sticky note, peels it off and sticks it to the back of your hand: *@rootkitty*, and a
        little drawing of a cat.

        "Twenty bucks a month. Or don't, and keep pretending you're not curious." She puts her
        headphones back on. "Either way you're gonna look."
      effects:
        - skill.gain: talk
art:
  loras: ["KreaTransBabe:1"]
  subject: >
    Eye-level widescreen photograph from seated eye height across a small round oak table in
    the corner of a Carnegie library reading room, the camera level, one woman, alone, sitting
    upright close behind the far side of the table two feet from the lens, framed from the
    tabletop to just above her head. The warm oak tabletop runs across the whole bottom of the
    frame and crosses her at the waist, the hem of her hoodie resting on it. She looks
    directly into the camera, making eye contact with the viewer, with bored, teasing
    confidence: eyes half-lidded behind her glasses, one brow raised, glossy lips pushed into
    a small smirk around the rim of a can. She is a trans woman of twenty-three, slim and
    petite with narrow shoulders and a small bust, pale skin with a light dusting of freckles
    across her nose, long straight hair dyed half jet black and half pastel pink, split
    sharply down a center part, the left half jet black and the right half pastel pink, worn
    in two low pigtails, blunt straight-cut bangs, thick black rectangular rimmed glasses,
    sharp black winged eyeliner, glossy pale pink lips, a small silver ring in her septum, and
    short nails painted black and pastel pink in turn. She wears an oversized black cotton
    hoodie, zipped halfway up and slipping off her left shoulder, over a fitted white ribbed
    crop top; a black velvet choker with a small silver O-ring sits at her throat, and pastel
    pink over-ear headphones with small cat ears rest around her neck, below her chin. She
    leans forward on her left forearm, which lies flat on the tabletop, and her right hand
    holds a slim, plain silver energy drink can to her lips. Beside her left elbow stands a
    plain black laptop, the back of its lid covered edge to edge in small, colorful vinyl
    stickers of cartoon cats, stars, hearts and lightning bolts, none of them with any
    lettering, open, its screen facing her and its stickered lid toward the lens. Behind
    her, a tall arched window with small clear leaded panes and the curve of a dark oak
    bookcase full of faded cloth-bound books. Soft afternoon daylight from the window behind
    her rims her pigtails and shoulders, and a green-shaded brass lamp on the table lights her
    face warmly from the side. Restrained palette of dark oak, black, white, pastel pink and
    pale daylight; natural skin texture, fine 35 mm film grain, shallow depth of field on her
    eyes.

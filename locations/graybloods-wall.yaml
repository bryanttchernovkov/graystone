# yaml-language-server: $schema=../../../schema/v3/location.json
# Event: up close with Red, a GrayBlood, against the warehouse wall at the docks. Reached by
# move.to from TALK-APPROACH at the docks' warehouse view (its result carries her greeting, so
# nothing replays here); out goes back to the warehouse view. TALK-ASK gives Red's Errand;
# DEAL-REPORT with it and $100 turns it into GrayBlood Rep (tag blooded, for the next job).
id: graybloods-wall
name: The warehouse wall
hub: true
description: Corrugated steel, a half-open door, and Red, leaning on the wall like she owns it, because she says she does.
actions:
  # Red's first job: prove you're not a cop. Gives Red's Errand (hidden while you hold it or
  # her rep).
  - category: talk
    word: ASK
    cost: 1
    always: true
    unless: [errand, blooded]
    prompt: Ask her if she's got any work.
    result:
      text: |
        She stares at you. Then she laughs so hard she has to put a hand on the wall.

        "Work? From *me*?" She wipes under one eye with a knuckle. "Lil bro. Look at you. You
        look like the dude they send in with a wire 'cause the real cops are too pretty to get
        shot. Arms up."

        You don't move fast enough, so she does it for you: grabs your wrists and slaps them
        up onto the corrugated steel over your head, kicks your feet apart with her sneaker,
        and pats you down, hard, armpits to ankles, talking the whole time. "Narc. Narc
        shoulders. Narc belt. Who wears a belt like that, five-oh does." She finds your wallet,
        takes it out, reads your license out loud to the whole lot in a newscaster voice, and
        laughs at your middle name. She drops the wallet on the ground.

        "Nah, you clean. You just *look* like a cop. That's worse, honestly." She steps back
        and folds her arms. "Here's the thing. Cops don't hustle. Cops get a paycheck and a
        pension and a lil plaque. So you wanna stand on my side of the lot, you go hustle.
        Bring me a hundred. Cash. In my hand. I don't care how. Beg for it, steal it, sell your
        nerd laptop, sell your little ass on Main Street, I really do not care."

        She jerks her chin at your wallet on the asphalt. "Pick that up. Go on. Bend."

        You bend. She watches you do it, grinning.

        "A hundred, lil bro. Then maybe you ain't a cop. Maybe you're just ugly."
      effects:
        - card.gain: reds-errand
        - tracker.change: { nerve: -1 }
      art:
        loras: ["shndr7_krea2_000001200:1"]
        subject: >
          First-person point-of-view widescreen photograph from standing eye height in a
          cracked asphalt lot beside the rust-streaked corrugated steel wall of a
          warehouse, the camera level, of shndr7 woman in her red puffer jacket, hanging
          open over a fitted black top, with light-wash ripped jeans, standing at arm's
          length from the lens, framed from her hips to just above her head. She looks
          directly into the camera, making eye contact with the viewer, with loud, gleeful
          mockery: pale blue eyes squeezed half shut with laughter, chin tipped up, full
          lips wide open in a cackling grin showing her teeth. In her right hand, held up
          beside her face, she dangles an open brown leather wallet between two fingers by
          its corner, a plastic driver's license card showing blank in its window; her
          left hand rests on her hip. Beside her at the right edge of the frame, the dark
          gap of a roll-up door rolled half open. Low, warm late-afternoon sun from the
          left lights her face and the glossy red jacket and throws the ridges of the
          corrugated wall into hard stripes of light and shadow. Restrained palette of
          glossy red, black, denim blue, brown leather, rust and corrugated gray; natural
          skin texture, fine 35 mm film grain, shallow depth of field on her eyes.
  # Red's Errand paid off: $100 for GrayBlood Rep.
  - category: deal
    word: REPORT
    cost: 1
    always: true
    requires: [errand]
    prompt: Tell her you're back about the errand.
    result:
      text: |
        She sees you coming across the lot and starts slow-clapping before you're halfway.

        "Ayy, he came back. Look at him. Look at his little walk." She holds her hand out, palm
        up, without unfolding her other arm. "Well? Pay me or get off my lot."
      effects:
        - choose:
            - label: Count a hundred dollars into her hand
              price: { cash: 100 }
              text: |
                You count it into her palm, bill by bill. She makes you do it slowly, and out
                loud, and when you lose count at sixty she makes you start again.

                Then she fans it, sniffs it, and snaps it against her other hand like a deck of
                cards. "Okay. Okay, lil bro. That's real." She tucks it inside the red jacket.
                "Say it. Say 'I ain't no cop.'"

                "I'm not a cop."

                "*Ain't.* Say it right. You sound like a substitute teacher."

                "I ain't no cop."

                She grins all the way up. "There it is. Ugh, that was so bad. Say it again." You
                do. She makes you say it four times, louder each time, until a man going in under
                the half-open door stops to watch, and then she tells him, "He ain't no cop," and
                the man says, "Clearly," and goes in.

                "Aight. You're GrayBlood-adjacent now." She taps two fingers on your chest. "Way
                adjacent. Like, parking-lot adjacent. Don't tell nobody, 'cause it's
                embarrassing for me." She leans back on the wall. "I'll find you something real
                when I'm bored again."
              effects:
                - card.lose: reds-errand
                - card.gain: graybloods-rep
                - skill.gain: deal
            - label: Admit you're not there yet
              text: |
                "So you walked all the way over here," she says, "to tell me you broke." She
                flicks you in the middle of the forehead, hard, with one long white nail. "Go.
                Shoo. Come back when you're rich, lil bro. Like, a hundred dollars rich."
      art:
        loras: ["shndr7_krea2_000001200:1"]
        subject: >
          First-person point-of-view widescreen photograph from standing eye height in a
          cracked asphalt lot, the camera level, of shndr7 woman in her red puffer jacket,
          hanging open over a fitted black top, with light-wash ripped jeans, leaning back
          against the rust-streaked corrugated steel wall of a warehouse an arm's length
          from the lens, framed from her hips to just above her head. She looks directly
          into the camera, making eye contact with the viewer, with smug, greedy
          satisfaction: pale blue eyes narrowed and amused, chin tipped up so she looks
          down her nose at the lens, full lips in a wide, lopsided smirk. In her right
          hand, held up beside her face, she fans out a thick spread of green banknotes,
          her long white nails splayed across the bills, and holds the edge of the fan
          under her nose as if smelling it; her left arm is folded across her chest.
          Beside her at the right edge of the frame, the dark gap of a roll-up door rolled
          half open. Low, warm late-afternoon sun from the left lights her face, the
          banknotes and the glossy red jacket and throws the ridges of the corrugated wall
          into hard stripes of light and shadow. Restrained palette of glossy red,
          banknote green, black, denim blue, rust and corrugated gray; natural skin
          texture, fine 35 mm film grain, shallow depth of field on her eyes and the
          bills.
art:
  loras: ["shndr7_krea2_000001200:1"]
  subject: >
    Eye-level widescreen photograph from standing eye height in a cracked asphalt lot, the
    camera level, shndr7 woman in her red puffer jacket, hanging open over a fitted black top,
    with light-wash ripped jeans, alone, leaning back against the rust-streaked corrugated steel
    wall of a warehouse an arm's length from the lens, framed from her hips to just above her
    head. She looks directly into the camera, making eye contact with the viewer, with loud,
    smug arrogance: pale blue eyes narrowed and amused, chin tipped up so she looks down her
    nose at the lens, full lips pulled into a wide, mocking grin showing her teeth. Her arms are
    folded high across her chest, both hands tucked against the red jacket's sleeves, and her
    shoulders and the back of her head rest against the steel. Beside her at the right edge of
    the frame, the dark gap of a roll-up door rolled half open. Low, warm late-afternoon sun
    from the left lights her face and the glossy red jacket and throws the ridges of the
    corrugated wall into hard stripes of light and shadow. Restrained palette of glossy red,
    black, denim blue, rust and corrugated gray; natural skin texture, fine 35 mm film grain,
    shallow depth of field on her eyes.

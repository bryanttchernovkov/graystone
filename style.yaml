# yaml-language-server: $schema=../../schema/v2/style.json
comfy:
  url: http://127.0.0.1:8188
  timeout_seconds: 3600
style:
  prefix: cinematic photorealistic film still, present-day small Midwest town, 35mm film grain
  negative: text, watermark, logo, cartoon, anime, illustration, painting, plastic skin, deformed hands, extra fingers
  loras: [retro-80s:1]
types:
  location: { workflow: krea2, width: 1920, height: 1080 }
  result:   { workflow: krea2, width: 1920, height: 1080 }
  card:     { workflow: krea2, width: 1024, height: 1024 }
  ending:   { workflow: krea2, width: 1920, height: 1080 }
workflows:
  krea2: workflows/krea2.json
ui:
  colors: { background: "#121417", accent: "#3a8fd6", danger: "#d9483b" }
  fonts: { body: "system-ui", display: "Georgia, 'Times New Roman', serif" }

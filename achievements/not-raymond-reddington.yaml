# yaml-language-server: $schema=../../../schema/v3/achievement.json
id: not-raymond-reddington
title: Not Raymond Reddington
text: He walked into the building on purpose, with a plan. You walked into the First Church with open counts, and no plan at all.
hint: Some doors you don't walk through with a record.
when: { location: station-arrest }
art:
  loras: ["nivdoyle_krea2_000001200:1"]
  subject: >
    A wide eye-level photograph across the narthex of an old deconsecrated limestone church
    converted into a sheriff's station, the scene in the right two-thirds of the frame, the left
    third quiet: pale limestone wall, worn flagstones and an empty wooden pew. In the middle of the
    frame, three paces from the lens, a man kneels on the flagstones with his back to the camera,
    upright on both knees, his fingers laced on top of his head, his elbows out, surrendering to
    the front desk in front of him. The man is a lean, slightly narrow-shouldered white man of
    thirty-two with pale skin and short neat dark blond hair slightly messy on top, the thin gold
    arms of round wire-rimmed glasses over his ears, in a faded red and gray plaid flannel shirt
    and worn blue jeans, the soles of his sneakers toward the camera. Two paces beyond him, behind
    a long reception counter of dark polished oak, sits nivdoyle woman in her uniform, wearing her
    black rectangular glasses, leaning back in her chair with her arms folded, looking down at him
    over the counter, very unimpressed: one brow raised, eyes half-lidded, her dark red lips
    pressed flat. A brass desk lamp on the counter lights her face warmly from the side. Behind
    her, a tall pointed stone arch into a nave of gray steel desks under stained-glass windows,
    out of focus. Natural colour, warm lamplight against cool daylight through stained glass,
    fine 35 mm film grain, sharp focus on her face and his laced hands.

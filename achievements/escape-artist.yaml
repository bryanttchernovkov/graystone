# yaml-language-server: $schema=../../../schema/v3/achievement.json
id: escape-artist
title: Escape Artist
text: Two bars, one window, and the longest second of your life stuck at the ribs.
hint: The Undercroft is old, and so is its mortar.
when: { location: undercroft-alley }
art:
  subject: >
    a narrow cobbled alley at night behind an old limestone church, seen from low against the far brick
    wall of the alley. In the right third of the frame, at ground level in the church's wall of smooth
    dressed limestone ashlar blocks, is one small, low basement window, an open, empty opening just
    wider than a man's shoulders, its bottom edge level with the wet grass. A man is wriggling out
    through it head first: his head, his shoulders and both arms are outside, the rest of him still
    inside the dark opening, his chest on the stone sill. He is a broad-shouldered, athletic white man
    of thirty-two with lightly tanned skin, tousled wavy brown hair, a strong square jaw, light stubble
    and round thin gold wire-rimmed glasses, in a loose, bright orange county inmate jumpsuit with the
    sleeves pushed up, his glasses crooked, his face streaked with gray mortar dust and set in a wild,
    breathless grin. His hands are dug into the wet grass and fallen yellow maple leaves in front of the
    window, and two rusted iron bars lie in the grass beside it. Warm incandescent light glows from the
    dark opening around his shoulders. The left of the frame is wet, empty cobbles and a green dumpster
    beside a diner's back door in deep blue shadow, a single orange sodium streetlight far down the
    alley. Palette of inmate orange, wet grass green, gray stone, sodium orange and night blue; natural
    texture, fine 35 mm film grain.
  # One small empty opening, him half through it: "broken window" and a pane in the grass drew a second
  # window and glass, and "his hips stuck" put him outside it (2026-11-06). Passes (ADR 0052): Eli, his LoRA.
  passes:
    - find: >-
        the man in the orange jumpsuit coming out of the window, from the top of his head down to
        the window sill, including his hands
      segment: man:1
      loras: ["jack:1"]

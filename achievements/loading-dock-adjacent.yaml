# yaml-language-server: $schema=../../../schema/v3/achievement.json
id: loading-dock-adjacent
title: Loading-Dock Adjacent
text: That's indoors. Barely. You wiped your feet.
hint: Red has work for people she can stand. Deliver.
when: { card: grayblood-runner }
art:
  subject: >
    a dockside corrugated steel warehouse at dusk, its roll-up door raised to waist height with warm yellow light spilling out,
    seen from across a cracked asphalt lot at standing height, the scene in the right two-thirds of the frame. A broad-shouldered,
    athletic white man of thirty-two with lightly tanned skin, tousled wavy brown hair, a strong square jaw, light stubble and round
    thin gold wire-rimmed glasses, in an unbuttoned faded red and gray plaid flannel shirt over a plain charcoal T-shirt, worn blue work jeans and scuffed brown leather work boots, stands stooped on a small clean rubber doormat in front of the door, carefully
    wiping one boot on it, looking up with a hopeful, eager, slightly frightened smile. A twenty-one-year-old woman with smooth dark
    brown skin and long straight black hair, in an open glossy red puffer jacket, a fitted black top, light-wash ripped jeans and
    scuffed white high-top sneakers, holds up the bottom of the door with one hand and points at the doormat with the other, long
    white nails, her head thrown back in a loud laugh. The left of the frame is empty lot, puddles and blue dusk. Palette of glossy red,
    rust, tungsten yellow and dusk blue; natural skin texture, fine 35 mm film grain.
  passes:
    - find: the stooping man on the doormat, from the top of his head down to his feet
      segment: man in plaid shirt
      loras: ["jack:1"]
      subject: >
        a broad-shouldered white man of thirty-two with tousled wavy brown hair, light stubble and round thin gold wire-rimmed glasses, in
        a plaid flannel shirt and jeans, stooping, wiping a boot on a doormat, looking up with a hopeful, frightened smile. Dusk, fine film grain.
    - find: the laughing woman in the red jacket, from the top of her hair down to her sneakers
      segment: woman in a red jacket
      loras: ["shndr7_krea2_000001200:1"]
      subject: >
        shndr7 woman in her red puffer jacket, hanging open over a fitted black top, with light-wash ripped jeans, twenty-one years old,
        holding up a roll-up door with one hand, pointing down with the other, her head thrown back in a loud laugh. Warm light from inside, fine film grain.

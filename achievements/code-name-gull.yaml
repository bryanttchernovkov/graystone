# yaml-language-server: $schema=../../../schema/v3/achievement.json
id: code-name-gull
title: "Code Name: Gull"
text: She gave you one of her gulls' names. She won't tell you which.
hint: Deputy Seo keeps a notebook. Fill your page.
when: { card: seos-informant }
art:
  loras: ["sorenji_krea2_000001400:1"]
  # Seo is in the base, in a prompt as short as her captions: her LoRA drew her badly as a pass.
  subject: >
    a close medium shot of two people standing on a river wharf on an overcast afternoon, seen from
    along the dock at chest height, both from the waist up in the right two-thirds of the frame.
    sorenji woman in her uniform with a green bomber jacket, with her dusty-pink bob, stands beside
    a man, one bare hand holding his flannel collar, and leans toward his ear to whisper, a hand's
    width of air between her face and his, her small black notebook open in her other hand, lowering
    her aviator sunglasses down her nose, her dark eyes sparkling with mischief, her berry-pink lips
    curved in a small closed-mouth smile. The man is a broad-shouldered, athletic white man of
    thirty-two with lightly tanned skin, tousled wavy brown hair, a strong square jaw, light stubble
    and round thin gold wire-rimmed glasses, in an unbuttoned faded red and gray plaid flannel shirt
    over a plain charcoal T-shirt, bending his head down toward her, eyes wide behind his glasses,
    brows shot up, glancing sideways down the empty dock, his lips pressed tight in a nervous line.
    On a rusted iron mooring bollard right beside them a herring gull stands with its head cocked,
    watching them. The left third of the frame is the wide gray river and a moored rust-red barge,
    soft and out of focus. Soft even overcast light; natural skin texture, fine 35 mm film grain
  # Passes (ADR 0052): only Eli, a little stronger, to pull him away from what her LoRA drew.
  passes:
    - find: >-
        the man in the plaid flannel shirt, from the top of his head down to the bottom of the
        image, including his hands
      segment: man in plaid shirt
      loras: ["jack:1"]
      denoise: 0.55

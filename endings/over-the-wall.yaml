# yaml-language-server: $schema=../../../schema/v2/ending.json
id: over-the-wall
title: Over the Wall
outcome: victory
text: |
  The alley behind the First Church smells of wet leaves and the dumpster from the diner. You
  lie on the cobbles for a breath, then get up and walk, not run, because a man running at
  this hour gets noticed.

  Somewhere under your feet a chair scrapes on flagstone. Somewhere behind you, a key ring
  rattles on its chain.

  You're out. In Graystone, out is a relative term.
art:
  subject: >
    Widescreen photograph at night of a narrow alley behind an old limestone church built of
    smooth dressed limestone ashlar blocks laid in straight courses with thin mortar joints. Low
    in the church wall, at ground level, a small basement window has been broken out: its pane
    gone, two rusted iron bars lying in the wet grass beneath it, warm amber bulb light spilling
    out of the opening onto fallen yellow maple leaves. The wet cobbled alley runs away past a
    green dumpster and the back door of a diner with a glowing kitchen window, toward a single
    sodium streetlight. The alley is empty. Cool blue night shadow fills the alley, cut by the
    warm glow from the window and the orange pool of the streetlight. Palette of night blue,
    sodium orange, warm amber, wet stone and yellow leaves; natural texture, fine 35 mm film
    grain, deep focus.

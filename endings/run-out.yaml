# yaml-language-server: $schema=../../../schema/v3/ending.json
id: run-out
title: Run Out
outcome: defeat
text: The day runs out before you do. Graystone goes on without you, and nobody at the diner asks where you went.
art:
  subject: >
    Widescreen photograph of the main street of a small Midwest town at dusk: two-story brick
    storefronts with a diner and a hardware store, a few pickup trucks parked at angles along
    the curb, the sidewalk empty, and at the end of the street a row of tall concrete grain
    elevators silhouetted against an orange and violet sky beside the rail spur. The street
    lights are just coming on. Low warm sunset light from the far end of the street rims the
    elevators and the truck roofs, the storefronts in cool blue shadow with a few lit windows.
    Palette of sunset orange, violet, brick red and cool blue; natural texture, fine 35 mm film
    grain, deep focus.

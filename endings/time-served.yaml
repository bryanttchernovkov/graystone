id: time-served
title: Time Served
outcome: victory
text: |
  She walks you up the stairs and out through the nave, past the deputies' desks and the
  stained glass nobody took down, and opens the big oak door onto the square. It's morning.
  The courthouse clock says so, and so does the diner across the street, already full.

  "Graystone's a small town," Sergeant Ashby says. "I'll see you around."

  You believe her. You walk down the church steps into the light, a little lighter than you
  went in, and a lot more careful.
art:
  loras: ["KreaEbonyBabe1"]
  subject: >
    Eye-level widescreen photograph from the sidewalk of a small Midwest town square on a bright
    autumn morning, looking up a flight of wide stone steps to the open oak double doors of an
    old limestone Gothic Revival church built of smooth dressed limestone ashlar blocks laid in
    straight courses with thin mortar joints. In the open doorway at the top of the steps stands
    a woman, whole and small in the frame, one gloved hand resting on the edge of the door: a
    Black American woman in her early thirties, tall and athletic with a full, heavy bust, broad
    straight shoulders and a soldier's posture, smooth dark brown skin, long black dreadlocks
    gathered at the nape and falling to the middle of her back, a level, unimpressed stare under
    straight dark brows, black leather duty gloves, a black leather handcuff case on her belt
    and a ring of heavy iron keys on a steel chain at her hip. She wears the Graystone County
    Sheriff's uniform: a crisp, pressed tan long-sleeved uniform shirt of heavy cotton twill
    with a pointed collar, a full button-front placket, two buttoned flap chest pockets piped in
    vivid azure blue, shoulder epaulets edged in vivid azure blue, an embroidered vivid azure
    blue and gold patch on each upper sleeve and a polished gold six-point star badge pinned
    over the left pocket; a vivid, saturated azure blue necktie with a small gold tie bar; tan
    riding breeches with a vivid azure blue stripe down the outer seam; a black leather duty
    belt with a polished brass buckle; and stiff, structured, mirror-polished black leather
    thigh-high riding boots with rigid straight shafts fitted tight to the leg, pulled up over
    the breeches to mid-thigh; a tan felt campaign hat with a wide flat brim, a pinched four-
    dent crown and a vivid azure blue hatband, worn level over her eyes; and over the shirt a
    short dark forest-green uniform jacket with a gold star on the chest, hanging open. Three
    vivid azure blue chevrons sit on each upper sleeve beneath the patch. She looks down the
    steps straight into the lens with a level, knowing look, the brim of her hat shading her
    eyes. Maple trees with red and gold leaves line the square, and the stained-glass windows of
    the church catch the sun. Low clear morning sunlight from the left lights the church facade
    gold and throws her long shadow across the steps. Palette of pale limestone, maple red and
    gold, uniform tan, forest green and vivid azure blue; natural skin texture, fine 35 mm film
    grain, deep focus.

# yaml-language-server: $schema=../../../schema/v2/map.json
# The river docks, down Front Street from Main: one spot seen two ways, like Main Street. DR looks
# out at the river (a patrol location: Deputy Seo by her cruiser); DW turns around to the
# warehouses (GrayBlood ground: Red against the wall). Turning is free; both lead back up to Main.
id: docks
name: The docks
legend:
  DR: docks-river
  DW: docks-warehouse
grid: |
  DR .. DW
portals:
  - { from: docks-river, dir: south, to: docks-warehouse, back: north, cost: 0, prompt: You turn around. }
  - { from: docks-warehouse, dir: west, to: main-street-south, prompt: You walk back up Front Street to Main. }

# yaml-language-server: $schema=../../../../schema/v2/card.json
id: the-undercroft
kind: mission
name: The Undercroft
text: Trial storyline. Booked into the lockup under the old church, with a sentence and a sergeant. Serve it, or find another way out.
start: undercroft
art:
  subject: >
    Photograph of an old deconsecrated limestone Gothic Revival church on the corner of a small
    Midwest town square at dusk, built of smooth dressed limestone ashlar blocks laid in
    straight courses with thin mortar joints, its tall pointed stained-glass windows lit dimly
    from inside, heavy oak double doors at the top of wide stone steps. Two white and tan county
    sheriff's patrol cars with azure blue stripes and dark light bars are parked at the curb in
    front. At the base of the church wall, at sidewalk level, a row of small barred basement
    windows glows warm amber. Square composition with the church facade filling the frame and
    the patrol cars at the bottom. Deep blue dusk sky behind the bell tower, warm sodium
    streetlights along the sidewalk, amber light from the basement windows. Palette of pale
    limestone, dusk blue, sodium amber, tan and azure; natural texture, fine 35 mm film grain.

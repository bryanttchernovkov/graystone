# yaml-language-server: $schema=../../../../schema/v3/card.json
# From WORK-EMAIL on the laptop. Its tag is what station locations will require for the
# printer job and anything else a contractor is let in for. A setback on a snoop action (SNOOP in the
# bullpen, LOCKERS in the gym, DRAWER in her office) is the Sheriff: sheriff-caught.
id: contractor-badge
kind: gear
name: Contractor Badge
tags: [contractor]
text: County of Graystone, contractor, escorted access. A clip-on photo ID that gets you past the front desk of the First Church and not one step further without a deputy.
slots:
  - { match: { category: work } }
setback_penalty:
  tags: [snoop]
  effects:
    - move.to: sheriff-caught
art:
  subject: >
    Square close still-life photograph from above of a laminated white plastic photo ID badge
    lying on a honey oak coffee table, clipped to a vivid azure blue woven lanyard that curls
    loosely across the wood. The badge shows a small blank square photo area, a printed gold
    six-point star emblem in one corner and blurred, unreadable lines of small black print, a
    thin vivid azure blue stripe along its top edge, and a chrome clip at the top. Beside it lie
    a pale yellow sticky note with a blurred, unreadable handwritten line and the corner of an
    open silver laptop. Square composition with the badge centered and the lanyard looping
    around it. Soft late-morning daylight from a window on the left lights the laminate with a
    long soft highlight and warms the wood grain. Restrained palette of white plastic, vivid
    azure blue, gold, pale yellow and honey oak; natural texture, fine 35 mm film grain, shallow
    depth of field on the badge.

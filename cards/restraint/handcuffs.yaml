# yaml-language-server: $schema=../../../../schema/v2/card.json
# Road cuffs: gained in both arrests (Anderson's and Ashby's), lost on arrival in the
# Undercroft, which uses its own restraints. Lighter than Prison Chains: a setback on the
# department's ground (law) costs Nerve, not Body.
id: handcuffs
kind: restraint
name: Handcuffs
tags: [cuffed]
text: County steel, double-locked, wrists behind you. Somebody else has the key, and somebody else decides when.
setback_penalty:
  tags: [law]
  effects:
    - tracker.change: { nerve: -1 }
art:
  loras: ["SA86RN444WSD83T4QX4PYS3P80:1"]
  subject: >
    Still-life photograph from above of a single pair of chrome clejuso handcuffs lying closed
    on the white vinyl back seat of a patrol car, their chain lying in a loose curve between
    the two rings, a small steel handcuff key on a short ring beside them. Square composition,
    the handcuffs centered. Soft gray daylight through a rear side window falls across the
    seat from the left, laying sharp highlights along the chrome rings and each chain link,
    the black steel cage partition of the patrol car out of focus behind them. Restrained
    palette of chrome, white vinyl, black steel and soft gray daylight; natural metal texture,
    fine 35 mm film grain, sharp focus on the cuffs.

# Road cuffs: gained in every arrest (Anderson's, Ashby's, Seo's), lost on arrival in the
# Undercroft (or at Seo's booking), which uses its own restraints. Lighter than Prison Chains: a setback on the
# department's ground (law) costs Nerve, not Body.
id: handcuffs
kind: restraint
name: Handcuffs
tags: [cuffed]
text: County steel, double-locked, wrists behind you. Somebody else has the key, and somebody else decides when.
setback_penalty:
  tags: [law]
  effects:
    - tracker.change: { nerve: -1 }
art:
  loras: ["hngcf5_krea2_000001500:0.9"]
  subject: >
    Square still-life photograph from above of closed polished stainless steel hngcf5 hinged
    handcuffs lying flat on the white vinyl back seat of a patrol car, each cuff about the size
    of a wrist, a small steel handcuff key on a short ring beside them. The handcuffs sit in the
    center of the frame at a slight diagonal. Soft gray daylight through a rear side window
    falls across the seat from the left, laying sharp highlights along the curved steel, the
    black steel cage partition of the patrol car out of focus behind them. Restrained palette of
    polished steel, white vinyl, black steel and soft gray daylight; natural metal texture, fine
    35 mm film grain, sharp focus on the cuffs.

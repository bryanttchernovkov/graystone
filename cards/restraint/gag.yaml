# yaml-language-server: $schema=../../../../schema/v2/card.json
id: gag
kind: restraint
name: Gag
tags: [gagged]
text: A black rubber bit, buckled behind your head. It comes off when she decides you've earned it.
boost: { capacity: 1, start: 1 }
on_empty: lose
slots:
  - { match: { tag: cooperate }, cost: 1 }
setback_penalty:
  tags: [prison]
  effects:
    - tracker.change: { nerve: -1 }
art:
  subject: >
    Still-life photograph of a black rubber bit gag with a black leather buckle strap hanging
    from a steel hook on a wall of smooth dressed limestone ashlar blocks laid in straight
    courses with thin mortar joints, the strap's steel buckle and holes catching the light, a
    pair of black leather duty gloves hanging from the hook beside it. Square composition, the
    gag in the center. A caged incandescent bulb from the upper left throws warm highlights on
    the rubber and the steel buckle and a crisp shadow on the pale stone. Palette of black
    rubber, black leather, polished steel and pale limestone; natural texture, fine 35 mm film
    grain.

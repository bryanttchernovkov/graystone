id: chastity-cage
kind: restraint
name: Chastity Cage
tags: [caged]
text: Stainless steel, and locked. The key is in somebody's pocket, and it isn't yours.
setback_penalty:
  tags: [prison]
  effects:
    - tracker.change: { nerve: -1 }
art:
  loras: ["mtlcg7d_krea2_000001250:1"]
  subject: >
    Square close-up photograph of a woman's slender hand, held up in front of the camera at
    chest height, holding an empty stainless steel mtlcg7 chastity cage between her thumb and
    two fingers, unlocked, its curved polished steel bars open and hollow, the light shining
    straight through them, a tiny brass padlock hanging open from its ring and a tiny brass
    key on a short chain looped over her little finger. Short, neat bare nails, no rings. Behind
    her hand only soft, dark, out-of-focus shadow, nothing to say where it is. Square
    composition, the cage in the center. A single warm bulb above throws sharp highlights on
    the polished steel and the brass and soft light across her skin. Palette of polished steel,
    brass, warm skin and deep shadow; natural texture, fine 35 mm film grain, shallow depth of
    field on the cage.

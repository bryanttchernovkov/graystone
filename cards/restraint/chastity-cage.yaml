art:
  loras: ["chastity_000005800:1"]
  subject: >
    Still-life close-up photograph of a small stainless steel male chastity cage with a ring and
    a tiny brass padlock, lying on a folded tan uniform shirt pocket flap piped in vivid azure
    blue beside a polished gold six-point star badge, a tiny brass key on a short chain resting
    next to the padlock. Square composition, the cage in the center. A single warm bulb above
    throws sharp highlights on the polished steel and brass and soft shadow into the twill.
    Palette of polished steel, brass, tan twill, vivid azure blue and gold; natural texture,
    fine 35 mm film grain, shallow depth of field on the padlock.

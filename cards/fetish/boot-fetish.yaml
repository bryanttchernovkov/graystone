id: boot-fetish
kind: fetish
name: Boot Fetish
tags: [boots]
text: Polished leather, a welt stitched tight, the warmth coming through the shaft. You notice boots now. Women in Graystone notice you noticing.
art:
  subject: >
    Still-life photograph of a single stiff, structured, mirror-polished black leather thigh-
    high riding boot with a rigid straight shaft standing upright on worn gray flagstones
    against a wall of smooth dressed limestone ashlar blocks laid in straight courses with thin
    mortar joints, its glossy toe cap reflecting a caged bulb as a sharp point of light, a tight
    line of welt stitching around the sole, and the long shaft rising out of the top of the
    frame. Square composition, the boot centered from the toe to above the knee. A single caged
    incandescent bulb above and to the right lays one long specular highlight down the shaft and
    across the toe, the rest of the leather in deep glossy black. Palette of black leather, gray
    stone and warm amber; natural leather texture with visible stitching, fine 35 mm film grain,
    shallow depth of field on the toe cap.

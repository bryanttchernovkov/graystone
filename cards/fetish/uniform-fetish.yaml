id: uniform-fetish
kind: fetish
name: Uniform Fetish
tags: [uniform]
text: Starch, a hard four-in-hand knot, a star polished until it throws the light back. A uniform stops you in your tracks now.
art:
  subject: >
    Detail close-up photograph of the chest of a crisp, pressed tan long-sleeved uniform shirt
    of heavy cotton twill: a vivid, saturated azure blue silk necktie knotted in a small hard
    knot in the notch of a pointed collar, a small gold tie bar set level across it, a buttoned
    flap chest pocket piped in vivid azure blue with a sharp pressed crease, and a polished gold
    six-point star badge pinned above it, filling the square frame with no face visible. Warm
    light from above catches the silk sheen of the tie, the polished star and the ridges of the
    twill weave. Palette of tan twill, vivid azure blue, gold and soft shadow; natural fabric
    texture, fine 35 mm film grain, sharp focus on the knot and the star.

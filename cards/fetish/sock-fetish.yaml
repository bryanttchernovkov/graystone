id: sock-fetish
kind: fetish
name: Sock Fetish
tags: [socks]
text: Thin black cotton, damp from a shift inside a riding boot. You know what a woman's feet smell like at five o'clock now, and you'd like to know again.
art:
  subject: >
    Still-life photograph from above of a pair of thin black cotton knee-high socks, worn and
    still creased to the shape of a foot and calf, one draped over the top of a stiff,
    mirror-polished black leather thigh-high riding boot lying on its side on a gray steel
    desk, the other trailing across a manila arrest form beside it. Square composition, the
    boot's open top and the sock hanging out of it in the center of the frame. Cool
    fluorescent light from above shows the soft matte weave of the cotton, a faint damp sheen
    at the heel and toe of each sock, and one long specular highlight down the boot's shaft.
    Restrained palette of black cotton, black leather, steel gray and manila; natural fabric
    and leather texture, fine 35 mm film grain, shallow depth of field on the sock's heel.

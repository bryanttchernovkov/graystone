name: Spanking Fetish
tags: [spanked]
text: You know the sound of that desk drawer from the bottom of the stairs. Your heart goes faster, and it isn't only your heart.
art:
  subject: >
    Square still-life photograph from seated eye height of an old oval-backed wooden hairbrush, its
    dark polished back facing up and worn pale in the middle from use, lying alone on a green leather
    desktop beside a half-open walnut desk drawer. A brass banker's lamp lays a warm pool of light on
    the brush and picks out the grain of the wood. Behind it, out of focus, dark walnut paneling.
    Restrained palette of polished dark wood, green leather, brass and walnut; natural texture, fine
    35 mm film grain, sharp focus on the worn back of the brush.

id: heel-fetish
kind: fetish
name: Heel Fetish
tags: [heels]
text: Black patent, a heel like a nail, the seam of a stocking going up the back of the calf. You hear heels on a floor and you count them.
art:
  subject: >
    Square close still-life photograph of a single black patent leather stiletto pump with a
    pointed toe and a thin high heel, lying on its side on a patterned green and cream rug over
    dark oak floorboards, a glossy highlight running down the heel, and beside it a sheer black
    stocking with a back seam, folded once. Square composition, the shoe in the center. Warm
    light from a green-shaded brass lamp out of frame at the left, the rest in soft shadow.
    Restrained palette of black patent, sheer black, green and cream; natural texture, fine
    35 mm film grain, shallow depth of field on the heel.

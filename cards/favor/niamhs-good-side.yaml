# yaml-language-server: $schema=../../../../schema/v2/card.json
# Gained from the printer job in the bullpen (WORK-FIX, or WORK-SERVICE with a uniform fetish,
# whose WORSHIP option adds a boost). Honest work fills its slot. Nothing reads it yet: her later
# scenes (and the ways back into the station) will.
id: niamhs-good-side
kind: favor
name: Niamh's Good Side
text: She has you down in the sign-in book as "IT (the nice one)". She says there's only the one.
boost: { capacity: 3, start: 1 }
slots:
  - { match: { category: work }, bonus: [ { boost.change: { card: self, amount: +1 } } ] }
art:
  loras: ["nivdoyle_krea2_000001200:1"]
  subject: >
    A chest-up portrait photograph of nivdoyle woman in her uniform and her black rectangular
    glasses, a woman of twenty-seven, seated behind a long reception counter of dark polished
    oak, leaning forward on her forearms, a pen in her right hand resting on an open sign-in
    book beside a small hand-drawn heart in red ink, looking straight into the camera through
    her glasses with warm, conspiratorial fondness, a closed, pleased smile, her eyes crinkled
    with amusement. Behind her, out of focus, a wall of pale limestone blocks and a brass key
    cabinet. A brass desk lamp at the left lights her face warmly from the side. 50 mm lens at
    eye level, natural colour, fine film grain, shallow depth of field on her eyes.

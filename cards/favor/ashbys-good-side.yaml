art:
  loras: ["ashby7_krea2_000001200:0.9"]
  subject: >
    Square waist-up portrait photograph from eye level of ashby7 woman in her sheriff's uniform,
    a sergeant in her early thirties with her long black locs gathered at the nape, standing in
    an underground corridor of smooth dressed limestone ashlar blocks laid in straight courses
    with thin mortar joints under a pointed arch. She stands half-turned with her gloved arms
    folded across her chest and looks sidelong into the lens, making eye contact with the
    viewer, with cool, guarded appraisal: eyes steady, one eyebrow slightly raised, lips closed.
    Her pressed tan uniform shirt has vivid azure blue trim on the pockets and epaulets, three
    vivid azure blue chevrons on each sleeve and a polished gold six-point star badge, with a
    vivid, saturated azure blue tie and a small gold tie bar; she wears black leather duty
    gloves, a black leather duty belt with a ring of heavy iron keys at the hip, and tan riding
    breeches, the same khaki tan as her shirt, with a vivid azure blue stripe down the outer
    seam. The frame ends at her duty belt. A caged incandescent bulb above lights her face and
    the polished star warmly from the side, the corridor behind her falling into soft shadow
    past a row of black iron barred cell doors. Palette of uniform tan, vivid azure blue, gold,
    black leather and pale limestone; natural skin texture, fine 35 mm film grain, shallow depth
    of field on her eyes.

name: Ashby's Trust
tags: [trusted]
text: She looks at you like her boots after the second coat. Almost satisfied.
art:
  loras: ["ashby7_krea2_000001200:0.9"]
  subject: >
    Square waist-up portrait photograph from eye level of ashby7 woman in her sheriff's uniform,
    a sergeant in her early thirties with her long black locs gathered at the nape, standing
    facing the lens in an underground corridor of smooth dressed limestone ashlar blocks laid in
    straight courses with thin mortar joints under a pointed arch. She holds her heavy ring of
    iron keys up beside her face in one black-gloved hand, the keys catching the light, and
    looks straight into the camera, making eye contact with the viewer, with a faint, warm
    almost-smile: eyes soft and steady, brows relaxed, the corners of her closed lips barely
    lifted. Her pressed tan uniform shirt has vivid azure blue trim on the pockets and epaulets,
    three vivid azure blue chevrons on each sleeve and a polished gold six-point star badge,
    with a vivid, saturated azure blue tie and a small gold tie bar; she wears black leather
    duty gloves, a black leather duty belt with a ring of heavy iron keys at the hip, and tan
    riding breeches, the same khaki tan as her shirt, with a vivid azure blue stripe down the
    outer seam. The frame ends at her duty belt. A caged incandescent bulb above lights her
    face, the keys and the gold star warmly, the corridor behind her in soft shadow. Palette of
    uniform tan, vivid azure blue, gold, dark iron and black leather; natural skin texture, fine
    35 mm film grain, shallow depth of field on her eyes and the keys.

id: ashbys-trust
kind: favor
name: Ashby's Trust
tags: [trusted]
text: She looks at you like her boots after the second coat. Almost satisfied.
art:
  loras: ["KreaEbonyBabe1"]
  subject: >
    Square portrait photograph from eye level of a Black American woman in her early thirties,
    tall and athletic with a full, heavy bust, broad straight shoulders and a soldier's posture,
    smooth dark brown skin, long black dreadlocks gathered at the nape and falling to the middle
    of her back, a level, unimpressed stare under straight dark brows, black leather duty gloves and a ring of heavy iron keys on a steel
    chain at her hip, standing in the underground corridor of smooth dressed limestone ashlar
    blocks laid in straight courses with thin mortar joints under a pointed arch, framed from
    the waist up and facing the lens. She wears the Graystone County Sheriff's uniform: a crisp,
    pressed tan long-sleeved uniform shirt of heavy cotton twill with a pointed collar, a full
    button-front placket, two buttoned flap chest pockets piped in vivid azure blue, shoulder
    epaulets edged in vivid azure blue, an embroidered vivid azure blue and gold patch on each
    upper sleeve and a polished gold six-point star badge pinned over the left pocket; a vivid,
    saturated azure blue necktie with a small gold tie bar; a black leather duty belt with a
    polished brass buckle; her head is bare. Three vivid azure blue chevrons sit on each upper
    sleeve beneath the patch. She holds her heavy ring of iron keys up beside her face in one
    gloved hand, the keys catching the light, and looks straight into the lens with a faint,
    warm, almost-smile, her gaze softer than her posture. A caged incandescent bulb above lights
    her face, the keys and the gold star warmly, the corridor behind her in soft shadow. Palette
    of uniform tan, vivid azure blue, gold, dark iron and dark skin; natural skin texture, fine
    35 mm film grain, shallow depth of field on her eyes and the keys.

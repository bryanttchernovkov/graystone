# yaml-language-server: $schema=../../../../schema/v2/card.json
# Anderson's Attention, full. Its tag `owned` opens her earned fetish actions (DEAL-BEG at the
# cruiser for Boot Fetish, DEAL-BEG in holding for Sock Fetish); `noticed` keeps her openers
# hidden. Its action is the one place her storyline reaches you away from her: send her money,
# from anywhere, as often as you can pay for it.
id: andersons-paypig
kind: favor
name: Anderson's Paypig
tags: [owned, noticed]
text: Her number's in your phone under a name she picked. You aren't allowed to change it.
actions:
  - category: deal
    word: SEND
    cost: 1
    price: { cash: 20 }
    prompt: Send Deputy Anderson twenty dollars. She doesn't say thank you. You do.
    result:
      text: |
        You send it. Twenty dollars, and in the memo line the word she makes you use.

        For a minute nothing. Then three dots, and then her reply: a photo of her boots up on
        the dash of the cruiser, crossed at the ankle, and under it, "that's it?? lol."

        Then: "say thank you."

        You type it. She reads it and doesn't answer, and you stand there holding the phone
        for longer than you'd like to admit, warm to the ears.
      effects:
        - tracker.change: { nerve: +1 }
        - skill.gain: deal
      art:
        loras: ["DGirlsModel14:1"]
        subject: >
          Widescreen photograph from the passenger seat of a parked sheriff's patrol car, seated
          eye height, the camera level and turned toward the driver's seat. One woman sits
          behind the wheel turned toward the lens, her boots up on the dashboard, crossed at
          the ankle, framed from the boots to her head. She looks directly into the camera,
          making eye contact with the viewer, with lazy, amused contempt: green eyes
          half-lidded, one dark brow arched, berry lips curled in a small smirk. She is a white
          American woman of twenty-four, slim and toned with a full bust and long legs, fair
          skin, long wavy platinum-blonde hair with bold jet-black streak highlights falling
          past her shoulders, dark elegant makeup with smoky black eyeliner, long dark lashes
          and deep berry lipstick, striking bright green eyes, arched dark brows, and long
          almond-shaped nails painted glossy black. She wears the Graystone County Sheriff's
          patrol uniform: a dark forest-green bomber jacket of smooth nylon twill with ribbed
          knit cuffs, collar band and waistband, zipped up to the middle of her chest, worn with
          both arms in its sleeves and both shoulders covered, a single polished gold six-point
          star badge pinned on its left chest and an embroidered vivid azure blue and gold patch
          on each upper sleeve; above the zipper, the pointed collar of a crisp, pressed tan
          uniform shirt and the knot of a vivid, saturated azure blue necktie with a small gold
          tie bar; a black leather duty belt with a polished brass buckle at her waist below the
          jacket's hem; tan riding breeches with a vivid azure blue stripe down the outer seam;
          and stiff, structured, mirror-polished black leather thigh-high riding boots with
          rigid straight shafts and low, flat stacked-leather riding heels, fitted tight to the
          leg, pulled up over the breeches to mid-thigh, resting on the dash. Her head is bare
          and her hands are bare. Her bare right hand, out of the green bomber sleeve, holds a
          black smartphone up beside her face, its glowing screen turned toward her, one black
          nail tapping the glass; her bare left hand, out of the other green bomber sleeve,
          rests on the top of her boot shaft. Through the
          windshield, out of focus, orange maples and a white clapboard house. Soft overcast
          daylight through the windshield lights her face and the polished boots. Restrained
          palette of forest green, tan, vivid azure blue, black leather, platinum blonde and
          maple orange; natural skin texture, fine 35 mm film grain, focus on her eyes.
art:
  loras: ["DGirlsModel14:1"]
  subject: >
    Square portrait photograph from seated eye height across a gray steel desk in the nave of
    an old deconsecrated limestone Gothic Revival church converted into a sheriff's bullpen,
    of one woman sitting back in her desk chair, framed from the waist up. She looks directly
    into the camera, making eye contact with the viewer, with smug, amused contempt: green
    eyes narrowed with pleasure, one dark brow arched, berry lips parted in a mocking smile.
    She is a white American woman of twenty-four, slim and toned with a full bust and long
    legs, fair skin, long wavy platinum-blonde hair with bold jet-black streak highlights
    falling past her shoulders, dark elegant makeup with smoky black eyeliner, long dark
    lashes and deep berry lipstick, striking bright green eyes, arched dark brows, and long
    almond-shaped nails painted glossy black. She wears the Graystone County Sheriff's
    uniform: a crisp, pressed tan long-sleeved uniform shirt of heavy cotton twill with a
    pointed collar, a full button-front placket, two buttoned tan flap chest pockets edged
    with thin vivid azure blue piping, shoulder epaulets edged in vivid azure blue, an
    embroidered vivid azure blue and gold patch on each upper sleeve and a single polished
    gold six-point star badge pinned over the left pocket; a vivid, saturated azure blue
    necktie with a small gold tie bar; and a black leather duty belt with a polished brass
    buckle. Her head is bare and her hands are bare. She holds a thick fan of green
    banknotes up beside her face in her bare right hand, black nails splayed across the bills,
    and taps the top edge of the fan against her berry lips; her bare left hand rests on an
    open brown leather wallet lying empty on the desk. Behind her, out of focus, tall pointed
    stained-glass windows and rows of steel desks. Daylight through the stained glass falls in
    colored shafts behind her, with cool fluorescent light lighting her face. Restrained
    palette of uniform tan, vivid azure blue, banknote green, platinum blonde and
    stained-glass red and gold; natural skin texture, fine 35 mm film grain, shallow depth of
    field on her eyes and the banknotes.

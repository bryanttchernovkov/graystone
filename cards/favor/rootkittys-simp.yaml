# yaml-language-server: $schema=../../../../schema/v2/card.json
# Subscribed: @rootkitty, full. Tag hooked opens her later scenes (her table, her apartment);
# subscribed keeps SUBSCRIBE hidden. SIMP stays: the same random photo beats, from anywhere but
# custody.
id: rootkittys-simp
kind: favor
name: Rootkitty's Simp
tags: [subscribed, hooked]
text: She renamed herself in your phone. It's a teal heart and the word "owner", and you can't change it back.
actions:
  - category: deal
    word: SIMP
    cost: 1
    tags: [simping]
    unless: [cuffed, inmate, nude]
    price: { cash: 15 }
    prompt: Tip @rootkitty fifteen dollars. She sends a picture for it, and you don't get to pick which.
    result:
      text: |
        You send it. Fifteen dollars, and in the note the only thing she lets you write:
        *for you, juno.*

        Three dots. They stop. They start again.
      effects:
        - move.to: { random: [juno-dm-boots, juno-dm-boots, juno-dm-tea, juno-dm-tea, juno-dm-socks, juno-dm-socks, juno-dm-selfie, juno-dm-selfie, juno-dm-video] }
art:
  loras: ["jovessa_krea2_000001200:1"]
  subject: >
    A square waist-up photograph of jovessa woman in her usual black outfit, a woman of twenty-
    three wearing her black rectangular glasses and a black ring choker, leaning forward on both
    elbows on a small round oak table in the corner of a Carnegie library reading room, holding
    a phone up beside her face in her right hand with its screen turned toward herself, her left
    hand flat on the closed lid of a plain black laptop, the back of its lid covered edge to
    edge in small, colorful vinyl stickers of cartoon cats, stars, hearts and lightning bolts,
    none of them with any lettering, lying on the table. She looks straight into the camera with
    smug, delighted ownership, eyes bright behind her glasses, brows raised, a wide teasing
    grin. The camera sits at seated eye height across the table. Behind her, out of focus, a
    tall arched window with small clear leaded panes and the curve of a dark oak bookcase. Soft
    afternoon daylight from the window rims her hair, and a green-shaded brass lamp lights her
    face warmly from the side. 50 mm lens, natural colour, fine film grain, shallow depth of
    field on her eyes.

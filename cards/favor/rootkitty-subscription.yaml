# yaml-language-server: $schema=../../../../schema/v3/card.json
# Juno Vance's page, paid for. Gained from DEAL-SUBSCRIBE on his page (tag subscribed hides it
# after). SIMP, tagged simping, works from anywhere but custody (cuffed, inmate): a random photo
# beat, and a die on a slot raises the card. Full, it becomes Rootkitty's Simp.
id: rootkitty-subscription
kind: favor
name: "Subscribed: @rootkitty"
tags: [subscribed]
text: Twenty dollars a month, and he can see every time you open the app.
boost: { capacity: 4, start: 1 }
on_full: rootkittys-simp
slots:
  - { match: { tag: simping }, bonus: [ { boost.change: { card: self, amount: +1 } } ] }
  - { match: { tag: simping }, bonus: [ { boost.change: { card: self, amount: +1 } } ] }
actions:
  - category: deal
    word: SIMP
    cost: 1
    tags: [simping]
    unless: [cuffed, inmate, nude]
    price: { cash: 15 }
    prompt: Tip @rootkitty fifteen dollars. He sends a picture for it, and you don't get to pick which.
    result:
      text: |
        You send it. Fifteen dollars, and in the note the only thing he lets you write:
        *for you, juno.*

        Three dots. They stop. They start again.
      effects:
        - move.to: { random: [juno-dm-boots, juno-dm-boots, juno-dm-tea, juno-dm-tea, juno-dm-socks, juno-dm-socks, juno-dm-selfie, juno-dm-selfie, juno-dm-video] }
art:
  subject: >
    Square close still-life photograph from above of a black smartphone in a plain black case
    lying face up on a dark honey oak table, its bright screen showing a clean white and pastel
    teal app page: a wide teal banner with small drawn white stars, a round profile
    photograph of a girl with black and teal hair and black glasses, too small to make out, short
    blurred unreadable lines of gray placeholder text and a large rounded teal button
    with a small white tick. Stuck to the oak beside the phone is a square teal sticky
    note with a small hand-drawn black cartoon cat on it and nothing else, and a slim silver
    energy drink can stands at the upper right. Square composition with the phone centered.
    Soft afternoon daylight from a window at the left lights the oak with a long soft
    highlight, and the screen glows cool and bright. Restrained palette of dark oak, black,
    teal and screen white; natural texture, fine 35 mm film grain, shallow depth of
    field on the screen.

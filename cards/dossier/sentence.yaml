art:
  subject: >
    Close still-life photograph from above of an open ruled ledger on a gray steel desk, its
    cream pages filled with rows of small handwritten block capitals too small to read, one line
    underlined in blue ink, a black pen lying in the gutter, and a heavy ring of old iron keys
    on a steel chain resting across the corner of the page beside a black leather glove. Square

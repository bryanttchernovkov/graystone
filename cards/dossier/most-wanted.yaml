# yaml-language-server: $schema=../../../../schema/v2/card.json
# The APB, full. Setback trap: any setback die on an action at a patrol location (walking in
# included, since an exit carries its destination's tags) gets you arrested by the deputy on
# that street. For now that is always Deputy Anderson.
id: most-wanted
kind: dossier
name: Most Wanted
tags: [wanted]
text: Your description is taped to the dash of every cruiser in the county, with a phone number and a highlighter line under it.
setback_penalty:
  tags: [patrol]
  effects:
    - move.to: anderson-arrest
art:
  subject: >
    Square photograph at night from the sidewalk of a quiet small-town residential street, a
    Graystone County Sheriff's patrol car parked at the curb a few paces away, angled toward
    the camera: a present-day Ford Police Interceptor Utility SUV painted two-tone, with a
    white roof, hood and front doors over a tan body, a broad vivid azure blue stripe
    running the full length of each flank below the windows, a gold six-point star decal on
    each front door, a low black roof light bar with red and blue lenses, a black steel push
    bumper bolted across the front grille and black steel wheels. Its door-mounted chrome
    spotlight is switched on and aimed straight into the lens, a hard white disc of light
    with a starburst flare at the center of the frame, the light bar unlit, the windshield
    dark. The beam lights the fallen maple leaves on the sidewalk and the white picket fence
    beside the camera. Square composition with the spotlight's glare at the center and the
    car's dark shape around it. Lit only by the spotlight and a sodium streetlight far
    behind the car. Palette of night black, glaring white, tan, vivid azure blue and sodium
    orange; natural texture, fine 35 mm film grain, lens flare.

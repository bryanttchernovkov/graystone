# yaml-language-server: $schema=../../../../schema/v3/card.json
# Your Criminal Record, worked off to nothing in the Undercroft. Its tag
# `served` opens the sign-out actions in Cell Three (SIGN, COLLECT, THANK), which lose it.
id: served-sentence
kind: dossier
name: Time Served
tags: [served, inmate]
text: A line in the Sergeant's ledger with her initials next to it. All that's missing is yours.
art:
  subject: >
    Square still-life photograph of a closed ledger bound in worn black cloth lying on a
    dark-stained oak desk, a black pen laid neatly across its cover. Beside it lie a pair of open
    polished steel chain handcuffs, a worn brown leather belt coiled loose with an open brass
    padlock hanging from its ring, and a neatly folded bright orange jumpsuit. A ring of iron keys hangs from a hook on the wall of smooth dressed limestone ashlar
    blocks laid in straight courses with thin mortar joints above. Pale morning daylight falls
    from a stairwell out of frame across the desk, mixing with the warm glow of a caged bulb.
    Palette of black cloth, dark oak, polished steel, iron, pale limestone and soft morning
    light; natural texture, fine 35 mm film grain.

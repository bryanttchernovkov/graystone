# Your Criminal Record (or Most Wanted), worked off to nothing in the Undercroft. Its tag
# `served` opens the sign-out actions in Cell Three (SIGN, COLLECT, THANK), which lose it.
id: served-sentence
kind: dossier
name: Time Served
tags: [served, inmate]
text: A line in the Sergeant's ledger with her initials next to it. All that's missing is yours.
art:
  loras: ["chastity_000005800:1"]
  subject: >
    Still-life photograph of a closed ledger bound in worn black cloth lying on a gray steel
    desk, a black pen laid neatly across its cover, a steel chastity cage and an open pair of
    steel handcuffs set beside it, and a ring of iron keys hanging from a hook on the smooth
    dressed limestone ashlar blocks laid in straight courses with thin mortar joints wall above.
    Square composition. Pale morning daylight falls from a stairwell out of frame across the
    desk, mixing with the warm glow of a caged bulb. Palette of black cloth, polished steel,
    iron, pale limestone and soft morning light; natural texture, fine 35 mm film grain.
